function bindAuth(){
  const scA=document.getElementById("storeChk");
  if(scA) scA.onclick=storageProbe;
  /* לחיצה על שם קיים: עוברים להתחברות והשם כבר ממולא */
  document.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>{
    auth={screen:"login",err:null,msg:null,pending:null,form:{u:b.dataset.who}};
    render();
    const el=document.querySelector('#fLogin [name=p]');
    if(el) el.focus();
  });
  document.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>{
    auth={screen:b.dataset.auth,err:null,msg:null,pending:null}; render();
  });
  const done=$("#codeDone");
  if(done) done.onclick=()=>{
    const u=auth.pending.user;
    session=u.id; save(K_SESS,session);
    auth={screen:"login",err:null,msg:null,pending:null};
    loadUser(u); render(); toast("ברוך הבא, "+(u.name||u.username));
  };

  const fl=$("#fLogin");
  if(fl) fl.onsubmit=ev=>{
    ev.preventDefault();
    const f=new FormData(fl);
    const u=findUser(f.get("u"));
    /* היה כאן "שם משתמש או סיסמה שגויים" אחיד, בהיגיון של שרת שלא רוצה
       לחשוף אילו שמות קיימים. כאן אין שרת: כל החשבונות יושבים באותו
       localStorage וכל אחד יכול לפתוח כלי פיתוח ולראות אותם. ההסתרה לא
       הגנה על כלום — היא רק גרמה למי שנכנס במכשיר חדש לחשוב שהסיסמה
       שלו שגויה, כשבאמת פשוט אין שם חשבון עדיין. */
    if(!u){
      const any=users.filter(x=>x&&x.username).length;
      auth.err=any
        ? 'השם «'+String(f.get("u")||"").trim()+'» לא קיים במכשיר הזה. '+
          'כל מכשיר שומר את החשבונות שלו בנפרד — אם נרשמת במקום אחר, '+
          'צריך להירשם כאן מחדש עם אותם פרטים, ואז לייבא את הגיבוי.'
        : 'עוד אין שום חשבון במכשיר הזה. לחץ «אין לי חשבון — הרשמה», '+
          'הירשם עם אותו שם משתמש ואותה סיסמה שיש לך במכשיר השני, ואז ייבא את הגיבוי.';
      auth.form={u:String(f.get("u")||"")};
      render(); return;
    }
    if(keyStretch(f.get("p"),u.salt)!==u.hash){
      auth.err='הסיסמה לא נכונה. השם «'+u.username+'» כן קיים כאן, אז זו רק הסיסמה.';
      auth.form={u:String(f.get("u")||"")};
      render(); return;
    }
    session=u.id; save(K_SESS,session);
    loadUser(u); auth.err=null; auth.form=null; render(); toast("שלום, "+(u.name||u.username));
  };

  const fs=$("#fSignup");
  if(fs) fs.onsubmit=ev=>{
    ev.preventDefault();
    const f=new FormData(fs);
    const name=String(f.get("u")||"").trim();
    const contact=String(f.get("c")||"").trim();
    auth.form={u:name,c:contact};
    const fail=m=>{ auth.err=m; render() };
    if(!/^[A-Za-z0-9_.\-]{3,20}$/.test(name))
      return fail("שם המשתמש יכול להכיל אותיות באנגלית, ספרות, נקודה ומקף — בין 3 ל־20 תווים.");
    if(findUser(name)) return fail("שם המשתמש הזה כבר תפוס.");
    const isMail=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contact);
    const isPhone=/^[0-9+\-() ]{9,15}$/.test(contact);
    if(!isMail&&!isPhone) return fail("הזן כתובת מייל תקינה או מספר טלפון.");

    const salt=randHex(32), code=makeRecoveryCode();
    const u={id:uid()+randHex(4),username:name,name:name,salt,hv:HASH_VERSION,
             hash:keyStretch(f.get("p"),salt),
             contactType:isMail?"email":"phone",contact,
             recovery:keyStretch(code,salt),created:today()};
    users.push(u); save(K_USERS,users);
    auth={screen:"signup",err:null,msg:null,form:null,pending:{user:u,code}};
    render();
  };

  const fr=$("#fReset");
  if(fr) fr.onsubmit=ev=>{
    ev.preventDefault();
    const f=new FormData(fr);
    const u=findUser(f.get("u"));
    const code=String(f.get("k")||"").trim().toUpperCase();
    if(!u||!u.recovery||keyStretch(code,u.salt)!==u.recovery){
      auth.err="שם המשתמש או קוד השחזור שגויים.";
      auth.form={u:String(f.get("u")||""),k:code};
      render(); return;
    }
    u.hash=keyStretch(f.get("p"),u.salt);
    /* הקוד הישן נשרף — קוד שחזור הוא חד־פעמי */
    const fresh=makeRecoveryCode();
    u.recovery=keyStretch(fresh,u.salt);
    save(K_USERS,users);
    auth={screen:"login",err:null,form:null,pending:null,
          msg:"הסיסמה הוחלפה. קוד שחזור חדש: "+fresh+" — שמור אותו, הקוד הקודם כבר לא תקף."};
    render();
  };

  const fw=$("#fWho");
  if(fw) fw.onsubmit=ev=>{
    ev.preventDefault();
    const u=findUser(new FormData(fw).get("u"));
    if(!u){ auth.err="לא נמצא חשבון בשם הזה במכשיר הזה."; render(); return }
    auth.err=null;
    auth.msg=u.contact
      ? "החשבון רשום עם "+(u.contactType==="email"?"המייל":"הטלפון")+": "+u.contact
      : "בחשבון הזה לא נשמרו פרטי קשר.";
    render();
  };
}

function bindSetup(){
  const fs=$("#fSetup");
  if(fs) fs.onsubmit=ev=>{
    ev.preventDefault();
    const f=new FormData(fs);
    const num=k=>{ const v=parseFloat(f.get(k)); return isNaN(v)?null:v };

    const dob=String(f.get("dob")||"").trim(), hgt=num("h");
    const age=ageFrom(dob);
    if(!age||age<12||age>99) return toast("הזן תאריך לידה תקין");
    if(!(hgt>=120&&hgt<=230)) return toast("הזן גובה בין 120 ל־230 ס\"מ");
    me.sex=f.get("sex")==="f"?"f":"m";
    me.dob=dob;
    delete me.age;              /* הגיל נגזר מהתאריך ולא נשמר בנפרד */
    me.height=Math.round(hgt);
    me.goal=f.get("goal")||"mass";
    me.act=parseInt(f.get("act"),10); if(isNaN(me.act)) me.act=2;
    const tw=num("tw");
    me.targetWeight=(tw>=30&&tw<=250)?tw:null;
    const i=users.findIndex(u=>u.id===me.id);
    if(i>=0) users[i]=me;
    save(K_USERS,users);

    /* המשקל שהוזן כאן הופך לשקילה הראשונה — בלעדיה אין ממה לחשב יעדים,
       ומשתמש חדש היה נתקע במסך ריק. */
    const w=num("w"), bf=num("bf");
    if(w>=25&&w<=250&&!official().some(e=>e.date===today())){
      const rec={id:uid(),date:today(),kind:"morning",weight:+w.toFixed(2),note:"מדידת פתיחה"};
      if(bf>=3&&bf<=65) rec.bf=+bf.toFixed(1);
      entries.push(rec);
    }
    /* היקפים כנקודת בסיס */
    const cRec={id:uid(),date:today()}; let anyC=false;
    ["navel","nipple","shoulders","armFlex","thigh","calf"].forEach(k=>{
      const v=num("c_"+k); if(v>0&&v<300){ cRec[k]=+v.toFixed(1); anyC=true }
    });
    if(anyC&&!circ.some(c=>c.date===today())) circ.push(cRec);

    ui.goal=me.goal; ui.editGoals=false; ui.tab="food";
    persist(); render(); toast("היעדים חושבו לפי הנתונים שלך");
  };
  const c=$("#setupCancel");
  if(c) c.onclick=()=>{ ui.editGoals=false; persist(); render() };
}

function bind(){
  try{ bindChart() }catch(e){ window.__chartErr=e }
  /* סלקטור ממוקד: [data-theme] לבדו תופס גם את תגית ה־HTML,
     והמאזין היה נצמד לכל הדף. */
  document.querySelectorAll("#segTheme button[data-theme]").forEach(b=>b.onclick=()=>{
    setTheme(b.dataset.theme); render();
  });
  const lo=$("#logout");
  if(lo) lo.onclick=()=>ask("להתנתק? הנתונים יישארו שמורים במכשיר.",logout,{ok:"התנתק"});;

  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.tab; persist(); render() });
  document.querySelectorAll("#segMetric button").forEach(b=>b.onclick=()=>{ ui.metric=b.dataset.metric; persist(); render() });
  document.querySelectorAll("#segRange button").forEach(b=>b.onclick=()=>{ ui.range=b.dataset.range; persist(); render() });

  /* ---- העלאת צילום מסך ---- */
  const drop=$("#drop"), fileIn=$("#file");
  if(drop&&fileIn){
    drop.onclick=()=>fileIn.click();
    drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileIn.click() } };
    fileIn.onchange=()=>{ if(fileIn.files&&fileIn.files[0]) runOCR(fileIn.files[0]) };
    ["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
    drop.addEventListener("drop",e=>{
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f&&/^image\//.test(f.type)) runOCR(f); else toast("צריך קובץ תמונה");
    });
  }
  const clr=$("#clearOcr");
  if(clr) clr.onclick=()=>{ window.__ocr=null; window.__ocrImg=null; render() };

  /* ---- ניתוחים קודמים ---- */
  document.querySelectorAll("[data-an]").forEach(el=>{
    el.addEventListener("click",ev=>{
      if(ev.target.closest("[data-del]")) return;      /* לא לפתוח בלחיצה על מחיקה */
      ui.anId=el.dataset.an; persist(); render();
    });
  });
  const bl=$("#backLatest");
  if(bl) bl.onclick=()=>{ ui.anId=null; persist(); render() };

  /* ---- ייבוא קובץ ---- */
  const impDrop=$("#impDrop"), impFile=$("#impFile");
  if(impDrop&&impFile){
    impDrop.onclick=()=>impFile.click();
    impDrop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); impFile.click() } };
    impFile.onchange=()=>{ if(impFile.files&&impFile.files[0]) readImportFile(impFile.files[0]) };
    ["dragenter","dragover"].forEach(t=>impDrop.addEventListener(t,e=>{e.preventDefault();impDrop.classList.add("over")}));
    ["dragleave","drop"].forEach(t=>impDrop.addEventListener(t,e=>{e.preventDefault();impDrop.classList.remove("over")}));
    impDrop.addEventListener("drop",e=>{
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f) readImportFile(f);
    });
  }
  /* שינוי מיפוי עמודה — בונה מחדש את הרשומות מיד */
  document.querySelectorAll("[data-mapcol]").forEach(sel=>{
    sel.onchange=()=>{
      const im=window.__imp; if(!im||im.kind!=="table") return;
      const ci=+sel.dataset.mapcol, key=sel.value||null;
      if(key) im.map.forEach((k,i)=>{ if(k===key&&i!==ci) im.map[i]=null });  /* עמודה אחת לכל שדה */
      im.map[ci]=key;
      const b=buildRecords(im.grid,im.headerRow,im.map);
      im.records=b.records; im.skipped=b.skipped; im.plan=planImport(b.records);
      render();
    };
  });
  const impCancel=$("#impCancel");
  if(impCancel) impCancel.onclick=()=>{ window.__imp=null; render() };

  const impApply=$("#impApply");
  if(impApply) impApply.onclick=()=>{
    const im=window.__imp, p=im&&im.plan; if(!p||!p.add.length) return;
    ask("להוסיף "+p.add.length+" שקילות? שקילות קיימות לא ישתנו.",()=>{
    const src=im.kind==="health"?"Apple Health":"קובץ "+(im.name||"");
    p.add.forEach(r=>{
      const rec={id:uid(),date:r.date,
                 kind:(r.hour!=null&&r.hour>=12)?"other":"morning",
                 note:"יובא מ־"+src+((r.hour!=null&&r.hour>=12)?" · נמדד ב־"+r.hour+":00":"")};
      OCR_FIELDS.forEach(f=>{ if(r[f.key]!=null) rec[f.key]=+(+r[f.key]).toFixed(f.dec) });
      entries.push(rec);
    });
    window.__imp=null; window.__lastAnalysis=null; ui.anId=null;
    persist(); render(); toast("נוספו "+p.add.length+" שקילות");
    });
  };

  const stepApply=$("#stepApply");
  if(stepApply) stepApply.onclick=()=>{
    const im=window.__imp, sp=im&&im.stepPlan; if(!sp||!sp.add.length) return;
    ask("להוסיף "+sp.add.length+" ימי צעדים? ימים קיימים לא ישתנו.",()=>{
    sp.add.forEach(r=>{ steps.push({id:uid(),date:r.date,n:r.n,src:"health"}) });
    steps.sort((a,b)=>a.date<b.date?-1:1);
    /* אם הקובץ הכיל רק צעדים, אין מה להשאיר על המסך */
    if(!im.plan) window.__imp=null; else im.stepPlan=null;
    persist(); render(); toast("נוספו "+sp.add.length+" ימי צעדים");
    });
  };

  const impRestore=$("#impRestore");
  if(impRestore) impRestore.onclick=()=>{
    const d=window.__imp&&window.__imp.json; if(!d) return;
    const r=backupApply(d);
    if(r.msg) toast(r.msg);
  };

  const wf=$("#wForm");
  if(wf) wf.onsubmit=ev=>{
    ev.preventDefault();
    const f=new FormData(wf), rec={id:uid()};

  document.querySelectorAll("[data-delstep]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.delstep;
    ask("למחוק את רישום הצעדים של "+fmtDate(d)+"?",()=>{
    delSteps(d); render(); toast("נמחק");
    });
  });
  const sp2=$("#stepPaste");
  if(sp2) sp2.onclick=async()=>{
    let txt=null;
    try{ txt=await navigator.clipboard.readText() }
    catch(e){ toast("הדפדפן לא נתן גישה ללוח. אפשר להדביק ידנית בשדה."); return }
    const n=parsePastedSteps(txt);
    if(n==null){ toast("לא מצאתי מספר בלוח. העתק שוב מאפליקציית הבריאות."); return }
    const fld=document.querySelector('#stepForm input[name="n"]');
    if(fld){ fld.value=n; fld.focus() }
    toast(nInt(n)+" — בדוק ולחץ שמור");
  };
  const lok=$("#linkOk");
  if(lok) lok.onclick=()=>{
    const l=window.__stepLink; if(!l) return;
    window.__stepLink=null;
    if(setSteps(l.date,l.n,"manual")) toast("נשמר");
    render();
  };
  const lno=$("#linkNo");
  if(lno) lno.onclick=()=>{ window.__stepLink=null; render(); toast("בוטל") };

  const lg=$("#liveGo");   if(lg) lg.onclick=()=>liveStart();
  const ls=$("#liveSave"); if(ls) ls.onclick=()=>liveStop(true);
  const ld2=$("#liveDrop");if(ld2) ld2.onclick=()=>{
    if(live&&live.count>0){ ask("לבטל? "+live.count+" צעדים שנספרו יימחקו.",()=>liveStop(false),{danger:true}); return }
    liveStop(false);
  };

  /* ---- אימונים ---- */
  document.querySelectorAll("[data-startw]").forEach(b=>b.onclick=()=>{
    const p=plans.find(x=>x.id===b.dataset.startw); if(!p) return;
    const items=(p.items&&p.items.length?p.items:parsePlan(p.body||"")).map((it,i)=>{
      const nm=(p.swaps||{})[i]||it.ex;
      const proto=[it.sets?it.sets+" סטים":"",it.reps||"",it.rest?"מנוחה "+it.rest:""].filter(Boolean).join(" · ");
      return {ex:nm||null,name:nm||it.name||it.raw,planned:proto,
              setsPlanned:it.sets||null,sets:it.sets?String(it.sets):"",perf:"",note:"",done:false};
    });
    const w={id:uid(),date:today(),planId:p.id,title:p.title,items,note:""};
    workouts.push(w); ui.logId=w.id; persist(); render(); toast("אימון נפתח — סמן מה ביצעת");
  });
  document.querySelectorAll("[data-openw]").forEach(el=>el.onclick=()=>{
    ui.logId=el.dataset.openw; persist(); render();
  });
  const bw=$("#backWork");
  if(bw) bw.onclick=()=>{ ui.logId=null; persist(); render() };

  const curW=()=>workouts.find(x=>x.id===ui.logId);
  document.querySelectorAll("[data-wdone]").forEach(el=>el.onchange=()=>{
    const w=curW(); if(!w) return;
    w.items[+el.dataset.wdone].done=el.checked; persist(); render();
  });
  [["wsets","sets"],["wperf","perf"],["wnote","note"]].forEach(([attr,key])=>{
    document.querySelectorAll("[data-"+attr+"]").forEach(el=>el.oninput=()=>{
      const w=curW(); if(!w) return;
      w.items[+el.dataset[attr]][key]=el.value; persist();
    });
  });
  const wn=$("#wnote");
  if(wn) wn.oninput=()=>{ const w=curW(); if(w){ w.note=wn.value; persist() } };
  const sw=$("#saveWork");
  if(sw) sw.onclick=()=>{
    const w=curW(); if(!w) return;
    const done=w.items.filter(i=>i.done).length;
    ui.logId=null; persist(); render();
    toast(done?"נשמר — "+done+" תרגילים בוצעו":"נשמר בלי תרגילים מסומנים");
  };
  document.querySelectorAll("[data-delw]").forEach(b=>b.onclick=()=>{
    ask("למחוק את האימון?",()=>{
    workouts=workouts.filter(x=>x.id!==b.dataset.delw);
    ui.logId=null; persist(); render(); toast("נמחק");
    });
  });

  /* ---- ניווט בתוכניות ---- */
  document.querySelectorAll("[data-openp]").forEach(el=>el.onclick=()=>{
    ui.planId=el.dataset.openp; ui.exIdx=null; persist(); render();
  });
  const bp=$("#backPlans");
  if(bp) bp.onclick=()=>{ ui.planId=null; ui.exIdx=null; persist(); render() };

  document.querySelectorAll("[data-exi]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.exi;
    ui.exIdx=(ui.exIdx===i)?null:i;
    persist(); render();
  });

  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const p=plans.find(x=>x.id===ui.planId); if(!p) return;
    p.swaps=p.swaps||{}; p.swaps[b.dataset.i]=b.dataset.pick;
    ui.exIdx=null; persist(); render(); toast("הוחלף ל־"+b.dataset.pick);
  });
  document.querySelectorAll("[data-linkex]").forEach(sel=>sel.onchange=()=>{
    const p=plans.find(x=>x.id===ui.planId); if(!p||!sel.value) return;
    p.links=p.links||{}; p.links[sel.dataset.linkex]=sel.value;
    persist(); render(); toast("קושר ל"+sel.value);
  });
  document.querySelectorAll("[data-unpick]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const p=plans.find(x=>x.id===ui.planId); if(!p||!p.swaps) return;
    delete p.swaps[b.dataset.unpick];
    persist(); render(); toast("חזרה לתרגיל המקורי");
  });

  const pe=$("#pEdit");
  if(pe) pe.onsubmit=ev=>{
    ev.preventDefault();
    const p=plans.find(x=>x.id===ui.planId); if(!p) return;
    const f=new FormData(pe);
    p.title=(f.get("title")||"").trim();
    p.body=f.get("body")||"";
    p.items=parsePlan(p.body);
    p.swaps={};                       /* המבנה השתנה — החלפות ישנות כבר לא תקפות */
    ui.exIdx=null; persist(); render(); toast("נשמר");
  };

  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const e=entries.find(x=>x.id===b.dataset.del);
    if(!e) return;
    ask("למחוק את השקילה מ־"+fmtDate(e.date)+"?",()=>{
      entries=entries.filter(x=>x.id!==b.dataset.del);
      if(window.__lastAnalysis&&window.__lastAnalysis.entry.id===b.dataset.del) window.__lastAnalysis=null;
      persist(); render(); toast("נמחק");
    },{danger:true});
  });
  document.querySelectorAll("[data-delc]").forEach(b=>b.onclick=()=>{
    ask("למחוק את מדידת ההיקפים?",()=>{
    circ=circ.filter(x=>x.id!==b.dataset.delc); persist(); render(); toast("נמחק");
    });
  });
  document.querySelectorAll("[data-delp]").forEach(b=>b.onclick=()=>{
    ask("למחוק את התוכנית?",()=>{
    plans=plans.filter(x=>x.id!==b.dataset.delp);
    ui.planId=null; ui.exIdx=null;
    persist(); render(); toast("נמחק");
    });
  });

  /* שמירת הגיבוי לקובץ. שני מסלולים, כי הם באמת שונים:
     • קובץ מקומי במחשב — קישור הורדה רגיל.
     • הגרסה שרצה דרך הקישור — הורדה רגילה חסומה שם, ולכן משתמשים
       ביכולת ההורדה של הסביבה. באייפון היא נפתחת כחלון השיתוף,
       וזה בדיוק מה שצריך כדי לשלוח את הגיבוי לעצמך. */
  const dl=$("#dl");
  if(dl) dl.onclick=async()=>{
    const name="ShapeUp-גיבוי-"+today()+".json";
    const text=backupText();
    let host=null;
    try{ host=window.claude&&window.claude.use?await window.claude.use("downloads"):null }catch(e){}
    if(host&&host.save){
      try{
        await host.save({filename:name,data:text});
        ui.lastBackup=Date.now(); persist(); render(); toast("קובץ הגיבוי נשמר");
      }catch(e){
        const c=e&&e.code;
        if(c==="declined") toast("הביטול נקלט — לא נשמר כלום");
        else if(c==="too_large") toast("הגיבוי גדול מדי לשמירה. השתמש ב«הצג גיבוי» ← «העתק»");
        else toast("השמירה לא הסתדרה. השתמש ב«הצג גיבוי» ← «העתק»");
      }
      return;
    }
    try{
      const blob=new Blob([text],{type:"application/json"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      ui.lastBackup=Date.now(); persist(); render(); toast("קובץ הגיבוי נשמר");
    }catch(e){ toast("השמירה נחסמה. השתמש ב«הצג גיבוי» ← «העתק»") }
  };

  const exp=$("#exp");
  if(exp) exp.onclick=()=>{ $("#io").value=backupText(); toast("הגיבוי מוצג — העתק ושמור") };
  const cp=$("#cp");
  if(cp) cp.onclick=async()=>{
    const t=$("#io").value||backupText();
    $("#io").value=t;
    try{
      await navigator.clipboard.writeText(t);
      /* העתקה היא גיבוי לכל דבר. בלי זה החיווי "עוד לא גיבית" נשאר דולק
         גם למי שמגבה בהעתקה — ובגרסה המתארחת אין בכלל כפתור הורדה. */
      ui.lastBackup=Date.now(); persist(); render();
      toast("הועתק — שמור את זה במקום בטוח");
    }
    catch(e){ $("#io").select(); toast("בחר והעתק ידנית") }
  };
  const imp=$("#imp");
  if(imp) imp.onclick=()=>{
    /* שלוש סיבות שונות לכישלון — ולכן שלוש הודעות שונות. "לא תקין" סתם
       שולח את המשתמש לנחש, ובפועל הסיבה השכיחה היא טקסט שנחתך בשליחה. */
    const raw=String(($("#io")||{}).value||"").trim();
    if(!raw){ toast("התיבה ריקה — הדבק בה את טקסט הגיבוי"); return }
    let d=null;
    try{ d=JSON.parse(raw) }
    catch(e){
      const cut=raw.length>200&&!/\}\s*$/.test(raw);
      toast(cut? "הטקסט נחתך באמצע — העתק אותו שוב במלואו"
               : "מה שהודבק אינו גיבוי תקין");
      return;
    }
    if(!looksLikeBackup(d)){ toast("זה JSON תקין אבל לא גיבוי — חסרה רשימת השקילות"); return }
    const r=backupApply(d);
    if(r.msg) toast(r.msg);
  };
}

/* הדבקת צילום מסך מהלוח — עובד מכל מקום באפליקציה */
document.addEventListener("paste",e=>{
  if(ui.tab!=="add"&&ui.tab!=="plan") return;
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(const it of items){
    if(it.type&&it.type.indexOf("image")===0){
      const f=it.getAsFile();
      if(f){ e.preventDefault(); ui.tab==="plan"?readPlanFile(f):runOCR(f) }
      return;
    }
  }
});

applyTheme(getTheme());
if(window.matchMedia){
  try{ window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change",()=>{ if(getTheme()==="auto") applyTheme("auto") }) }catch(e){}
}
checkStorage();
bootAuth();
readStepLink();
render();
</script>
</body>
</html>
