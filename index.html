<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- השם שמופיע מתחת לאייקון במסך הבית. בלי התג הזה אייפון נופל לכותרת
     הדף, ואם הקיצור נוצר בעבר — הוא שומר את השם הישן גם אחרי שינוי שם. -->
<meta name="apple-mobile-web-app-title" content="ShapeUp">
<meta name="application-name" content="ShapeUp">
<meta name="theme-color" content="#EEF4FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>ShapeUp</title>
<style>
/* ============================================================================
   ShapeUp — מערכת עיצוב
   ----------------------------------------------------------------------------
   השפה היא מכשיר מדידה, לא צעצוע: משטחים אטומים ושקטים, קו שוליים בעובי
   שיער במקום צל כבד, והמספר הוא הגיבור. האפליקציה הזאת עושה דבר אחד —
   מודדת גוף לאורך זמן — ולכן היא צריכה לקרוא כמו שעון או מד לחץ.

   הצבע: פחם חמים עם נחושת. הנחושת היא צבע המותג ותשומת הלב גם יחד;
   הכתום הסמנטי הוסר, כי כתום ליד נחושת הורס את שניהם. נשארו שלושה
   מצבים ברורים — ירוק לטוב, אלמוג לרע, נחושת לשים לב.

   שלושה מצבים לערכת הצבע ולא שניים: `data-theme` על השורש כשהמשתמש בחר
   במפורש, ובלי סימון — הבחירה של המכשיר דרך prefers-color-scheme.
   ============================================================================ */
:root{
  /* בהיר: נייר חם, לא לבן כחלחל. */
  --bg:#F5F3EF;
  --glow1:rgba(168,114,42,0.05);
  --glow2:rgba(168,114,42,0.03);
  --card:#FFFFFF;
  --card2:#FAF8F4;
  --brd:rgba(28,25,20,0.11);
  --label:#1A1815;
  --label2:rgba(26,24,21,0.66);
  --label3:rgba(26,24,21,0.70);
  --sep:rgba(28,25,20,0.10);
  --blue:#A8722A;
  --accent:#A8722A;
  --green:#2E8B5F;
  --btn-bg:#8A5A18;      /* לבן על נחושת כהה — 5.9:1 */
  --accent-txt:#8A5A18;
  --warn-txt:#8A5A18;    /* אין כתום נפרד: נחושת היא צבע תשומת הלב */
  --good-txt:#1F7A4D;
  --red:#C2453A;
  --bad-txt:#A8342A;
  --orange:#A8722A;
  --purple:#6D5296;
  --teal:#20718A;
  --fill:rgba(28,25,20,0.055);
  --fill2:rgba(28,25,20,0.11);
  --bar:rgba(255,255,255,0.94);
  --shadow:0 1px 2px rgba(28,25,20,0.05);
  --blur:0px;
  --r-card:16px;
  --r-inner:11px;
}
/* מצב לילה — פחם חמים ונחושת. מוגדר פעם אחת ומשמש גם לבחירה מפורשת
   וגם להעדפת המכשיר, כדי שלא ייווצר הפרש בין השניים. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F12;
    --glow1:rgba(232,178,92,0.055);
    --glow2:rgba(232,178,92,0.025);
    --card:#16181D;
    --card2:#1C1F26;
    --brd:rgba(255,255,255,0.075);
    --label:#F2F1EE;
    --label2:rgba(242,241,238,0.64);
    --label3:rgba(242,241,238,0.64);
    --sep:rgba(255,255,255,0.075);
    --blue:#E8B25C;
    --accent:#E8B25C;
    --green:#7FD1A6;
    --btn-bg:#E8B25C;
    --accent-txt:#E8B25C;
    --warn-txt:#E8B25C;
    --good-txt:#7FD1A6;
    --red:#E8877A;
    --bad-txt:#F0A99E;
    --orange:#E8B25C;
    --purple:#B9A0E0;
    --teal:#7EC8D8;
    --fill:rgba(255,255,255,0.055);
    --fill2:rgba(255,255,255,0.11);
    --bar:rgba(14,15,18,0.92);
    --shadow:0 1px 2px rgba(0,0,0,0.34);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F12;
  --glow1:rgba(232,178,92,0.055);
  --glow2:rgba(232,178,92,0.025);
  --card:#16181D;
  --card2:#1C1F26;
  --brd:rgba(255,255,255,0.075);
  --label:#F2F1EE;
  --label2:rgba(242,241,238,0.64);
  --label3:rgba(242,241,238,0.64);
  --sep:rgba(255,255,255,0.075);
  --blue:#E8B25C;
  --accent:#E8B25C;
  --green:#7FD1A6;
  --btn-bg:#E8B25C;
  --accent-txt:#E8B25C;
  --warn-txt:#E8B25C;
  --good-txt:#7FD1A6;
  --red:#E8877A;
  --bad-txt:#F0A99E;
  --orange:#E8B25C;
  --purple:#B9A0E0;
  --teal:#7EC8D8;
  --fill:rgba(255,255,255,0.055);
  --fill2:rgba(255,255,255,0.11);
  --bar:rgba(14,15,18,0.92);
  --shadow:0 1px 2px rgba(0,0,0,0.34);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  /* ההילות הן מה שנותן לזכוכית מה לטשטש. בלעדיהן המשטחים נראים אטומים. */
  background:
    radial-gradient(1200px 760px at 10% -10%, var(--glow1), transparent 62%),
    radial-gradient(1000px 640px at 92% 2%,  var(--glow2), transparent 58%),
    var(--bg);
  background-attachment:fixed;
  color:var(--label);
  font-size:17px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}

/* ---------- layout ---------- */
.wrap{max-width:660px;margin:0 auto;padding:0 16px}
.lgtitle{font-size:32px;font-weight:600;letter-spacing:-0.6px;padding:18px 0 4px;line-height:1.2}
.sub{color:var(--label2);font-size:14.5px;margin:0 0 22px;line-height:1.6}

/* משטח שקט: אטום, קו שוליים בעובי שיער, וצל כמעט בלתי מורגש.
   זכוכית מטושטשת נראית עשירה בצילום ורועשת בשימוש — כל כרטיס
   מושך תשומת לב לעצמו במקום לתוכן שבתוכו. */
.card,.list,.authcard{
  background:var(--card);
  border:1px solid var(--brd);
  box-shadow:var(--shadow);
}
.card{ border-radius:var(--r-card); padding:18px 17px; margin:0 0 13px }
/* כותרת מקטע: קטנה, מרווחת ושקטה — היא תווית ולא הצהרה.
   הקו שנמתח אחריה נותן מבנה בלי להוסיף עוד מסגרת. */
.card h2{font-size:11.5px;font-weight:600;letter-spacing:1.5px;color:var(--label2);
  margin:0 0 14px;display:flex;align-items:center;gap:10px}
.card h2::after{content:'';flex:1;height:1px;background:var(--sep)}
.card h3{font-size:15px;font-weight:600;color:var(--label2);margin:18px 0 8px;text-transform:none}
.card p{margin:0 0 10px}
.tiny{font-size:13px;color:var(--label2);line-height:1.4}

/* ---------- inset grouped list ---------- */
.list{border-radius:var(--r-card);overflow:hidden;margin:0 0 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:0.5px solid var(--sep);min-height:48px}
.row:last-child{border-bottom:none}
.row .k{flex:1;min-width:0}
.row .v{color:var(--label2);font-variant-numeric:tabular-nums;direction:ltr}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--fill)}

/* ---------- fields ---------- */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:6px}
.f.wide{grid-column:1/-1}
label{font-size:13px;color:var(--label2);font-weight:500;padding-inline-start:2px}
input,select,textarea{
  font-family:inherit;font-size:17px;color:var(--label);
  background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);
  padding:12px 14px;width:100%;outline:none;
  -webkit-appearance:none;appearance:none;
}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 26%,transparent)}
textarea{min-height:150px;resize:vertical;line-height:1.5;font-size:15px}
input[type=date]{direction:ltr;text-align:start}
::placeholder{color:var(--label3)}

/* ---------- buttons ---------- */
.btn{
  font-family:inherit;font-size:17px;font-weight:600;
  background:var(--btn-bg);color:#fff;border:none;
  border-radius:var(--r-inner);padding:13px 18px;width:100%;
  cursor:pointer;transition:opacity .15s;
}
.btn:active{opacity:.75}
.btn.sec{background:var(--fill);color:var(--accent-txt)}
.btn.danger{background:var(--fill);color:var(--bad-txt)}
.btn.mini{width:auto;padding:8px 14px;font-size:15px;border-radius:980px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
/* במצב לילה הכחול בהיר, ולכן טקסט לבן עליו מגיע ל-3.6:1 בלבד.
   טקסט כהה על אותו כחול נותן 8:1 — אותה שפה, קריא. */
:root[data-theme="dark"] .btn{color:#06121a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06121a}}
:root[data-theme="dark"] .btn.sec,
:root[data-theme="dark"] .btn.danger{color:var(--accent-txt)}
:root[data-theme="dark"] .btn.danger{color:#FF9A90}   /* על רקע הכפתור האפור, #FF6961 מגיע ל-3.7:1 בלבד */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .btn.sec{color:var(--accent-txt)}
  :root:not([data-theme="light"]) .btn.danger{color:#FF9A90}
}
.btnrow .btn{width:auto;flex:1;min-width:130px}

/* ---------- segmented control ---------- */
.seg{display:flex;background:var(--card2);border:1px solid var(--brd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:12px;padding:3px;gap:3px;margin:0 0 14px}
.seg button{
  flex:1;font-family:inherit;font-size:14px;font-weight:600;
  background:transparent;border:none;color:var(--label);
  padding:7px 4px;border-radius:8px;cursor:pointer;white-space:nowrap;
}
.seg button[aria-selected=true]{background:var(--card);box-shadow:0 1px 4px rgba(16,42,80,.14);border-radius:10px}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:50;
  background:var(--bar);
  -webkit-backdrop-filter:saturate(200%) blur(28px);
  backdrop-filter:saturate(200%) blur(28px);
  border-top:1px solid var(--brd);
  padding-bottom:env(safe-area-inset-bottom);
}
/* תשע לשוניות. דחיסת כולן לרוחב טלפון הפכה את האייקונים והתוויות
   לקטנים מכדי לקרוא ומכדי ללחוץ. במקום זה: גודל אמיתי, והסרגל נגלל.
   הלשונית הפעילה נגררת אל המרכז ב-renderTabs. */
.tabbar .inner{max-width:660px;margin:0 auto;display:flex;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth}
.tabbar .inner::-webkit-scrollbar{display:none}
.tabbar button{
  flex:0 0 auto;min-width:72px;background:none;border:none;font-family:inherit;
  color:var(--label2);font-size:11.5px;font-weight:500;
  padding:9px 6px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
}
@media (min-width:660px){ .tabbar button{flex:1 1 0} }
/* שמונה לשוניות. במסך צר האייקון והתווית מתכווצים במקום לגלוש החוצה. */
.tabbar button span{
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.tabbar button[aria-selected=true]{color:var(--accent-txt)}
.tabbar svg{width:30px;height:30px;display:block}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:980px;
  /* היה nowrap — תווית ארוכה גלשה מחוץ למסך ב-320px. עכשיו היא נשברת. */
  white-space:normal;max-width:100%;text-align:center;line-height:1.35}
.b-ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--good-txt)}
.b-warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--warn-txt)}
.b-crit{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--bad-txt)}
.b-info{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--accent-txt)}
.b-mute{background:var(--fill);color:var(--label2)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:14px 8px}
.tile{background:transparent;border:0;border-radius:0;padding:4px 6px 2px;text-align:center}
.tile .t{font-size:11px;color:var(--label2);font-weight:500;letter-spacing:.4px;margin-bottom:5px}
/* ספרות דקות וגדולות נקראות מדויקות; ספרות שמנות נקראות זולות. */
.tile .n{font-size:29px;font-weight:300;letter-spacing:-1.2px;line-height:1.05;
  font-variant-numeric:tabular-nums;direction:ltr}
.tile .d{font-size:11.5px;font-variant-numeric:tabular-nums;direction:ltr;margin-top:4px}
.up{color:var(--good-txt)}.dn{color:var(--bad-txt)}.flat{color:var(--label2)}

/* ---------- analysis block ---------- */
.step{border-inline-start:3px solid var(--fill2);padding-inline-start:13px;margin:0 0 16px}
.step .st{font-size:12px;font-weight:700;color:var(--label2);letter-spacing:.3px;margin-bottom:5px}
.step.ok{border-color:var(--green)}
.step.warn{border-color:var(--orange)}
.step.crit{border-color:var(--red)}
.step.info{border-color:var(--blue)}
.calc{background:var(--card2);border:1px solid var(--brd);border-radius:10px;padding:10px 12px;font-size:14px;font-variant-numeric:tabular-nums;margin:8px 0;direction:ltr;text-align:start}

/* ---------- chart ---------- */
.chart{width:100%;height:230px;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--label2);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
/* ---------- גרף אינטראקטיבי: בועת פרטים ופקדי זום ---------- */
.chartwrap{position:relative}
.chart{touch-action:none}
.chart:focus-visible{outline:2px solid var(--accent-txt);outline-offset:3px;border-radius:8px}
/* הבועה יושבת מעל הגרף. השוליים ב-transform מונעים ממנה לצאת מהמסך
   בקצוות, בלי לחשב מיקום ידנית. */
.ctip{
  position:absolute;top:6px;transform:translateX(-50%);
  min-width:112px;max-width:190px;
  background:var(--card);border:1px solid var(--brd);border-radius:11px;
  box-shadow:var(--shadow);padding:9px 11px;pointer-events:none;z-index:3;
  display:flex;flex-direction:column;gap:2px;text-align:center;
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
}
.ctip b{font-size:20px;font-weight:680;line-height:1.15;letter-spacing:-.3px}
.ctip .cunit{font-size:12px;font-weight:500;color:var(--label2)}
.ctip .cdate{font-size:12px;color:var(--label2)}
.ctip .cdelta{font-size:12px;color:var(--label2);margin-top:2px}
.ctip .cdelta.up{color:var(--good-txt)} .ctip .cdelta.dn{color:var(--bad-txt)}
.ctip .cflag{font-size:11.5px;color:var(--bad-txt);font-weight:600;margin-top:2px}
/* בקצה השמאלי והימני הבועה נצמדת פנימה במקום לגלוש */
.ctip[style*="left:0"],.ctip[style*="left:1"],.ctip[style*="left:2"]{transform:translateX(-18%)}
.ctip[style*="left:9"]{transform:translateX(-82%)}

.czoom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
.cz{
  font:inherit;font-size:19px;font-weight:600;line-height:1;
  min-width:44px;min-height:44px;padding:0 12px;cursor:pointer;
  background:var(--fill);border:1px solid transparent;border-radius:11px;color:var(--accent-txt);
}
.cz.wide{font-size:13.5px;font-weight:600;padding:0 15px}
.cz:hover:not([disabled]){border-color:var(--accent-txt)}
.cz[disabled]{opacity:.4;cursor:not-allowed}
.cz:focus-visible{outline:2px solid var(--accent-txt);outline-offset:2px}
.czlab{font-size:13px;color:var(--label2);margin-inline-start:2px}

/* ---------- exercise ---------- */
.ex{background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);padding:12px 14px;margin-bottom:9px}
.ex .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ex .nm{font-weight:600;flex:1;min-width:0}
.mus{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.mus span{font-size:11px;padding:2px 8px;border-radius:980px;background:var(--fill);color:var(--label2)}
.mus span.p{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--accent-txt);font-weight:600}
.swap{background:color-mix(in srgb,var(--purple) 10%,transparent);border-radius:var(--r-inner);padding:11px 13px;margin-top:9px}
/* ---------- מסך תוכנית ---------- */
.exr{background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);margin-bottom:9px;overflow:hidden}
.exr.open{box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 40%,transparent)}
.exhead{display:flex;align-items:center;gap:9px;padding:12px 13px;cursor:pointer}
.exhead:active{background:var(--fill)}
.exmain{flex:1;min-width:0}
.exnm{font-weight:650;font-size:16px}
.proto{font-size:13px;color:var(--label2);margin-top:3px;font-variant-numeric:tabular-nums}
.chev{color:var(--label2);font-size:12px;flex:none}
.exbody{padding:0 13px 13px;border-top:0.5px solid var(--sep);padding-top:11px}
.altbtns{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
a.yt{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--brd);color:var(--red);
  border-radius:980px;padding:6px 13px;font-size:14px;font-weight:600;text-decoration:none}
a.yt:active{opacity:.7}
a.yt svg{width:19px;height:19px;flex:none}
a.ytmore{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--label2);
  text-decoration:none;padding:6px 10px;margin-inline-start:6px;border-radius:980px;background:var(--fill)}
a.ytmore:active{opacity:.6}
a.yt:focus-visible,a.ytmore:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.alts{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.alt{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.alt.a1{background:color-mix(in srgb,var(--orange) 12%,transparent)}
.alt.a2{background:color-mix(in srgb,var(--green) 12%,transparent)}
.alt .mus{margin-top:6px}
.cov{margin-top:8px;padding-top:8px;border-top:0.5px solid var(--sep)}
.mus span.miss{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red);font-weight:600}
.alt .tiny{margin-top:5px}

/* ---------- אזור העלאת תמונה ---------- */
.drop{
  display:flex;align-items:center;gap:14px;
  border:2px dashed var(--fill2);border-radius:var(--r-card);
  padding:20px 18px;cursor:pointer;transition:background .15s,border-color .15s;
  color:var(--accent-txt);text-align:start;
}
.drop:hover,.drop:focus,.drop.over{background:var(--fill);border-color:var(--blue);outline:none}
.drop.busy{cursor:default;border-style:solid;color:var(--label)}
.drop svg{width:30px;height:30px;flex:none}
.drop b{color:var(--label);font-weight:600;font-size:16px}
.drop .tiny{color:var(--label2);margin-top:2px}
.spin{
  width:26px;height:26px;flex:none;border-radius:50%;
  border:2.5px solid var(--fill2);border-top-color:var(--blue);
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.shot{width:100%;border-radius:var(--r-inner);margin-top:12px;display:block;max-height:420px;object-fit:contain;background:var(--card2)}
details summary::-webkit-details-marker{display:none}
details summary{list-style:none}
details.xtra{margin-top:14px;border-top:0.5px solid var(--sep);padding-top:12px}
details.xtra summary{cursor:pointer;color:var(--accent-txt);font-weight:600;padding:2px 0}
details.param{background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);margin-bottom:7px;overflow:hidden}
details.param summary{cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 13px;flex-wrap:wrap}
details.param summary:active{background:var(--fill)}
details.param .pn{font-weight:600;font-size:15px;flex:1;min-width:80px}
details.param .pv{font-weight:700;font-size:15px}
details.param .pbody{padding:0 13px 12px;border-top:0.5px solid var(--sep);margin-top:2px;padding-top:10px}
details.param .pbody p{margin:0 0 7px}
details.param .pbody p:last-child{margin:0}
.rng{margin:0 0 11px}
.rngbar{position:relative;height:7px;border-radius:980px;background:var(--fill2)}
.rngbar span{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
  background:var(--blue);transform:translate(50%,-50%);box-shadow:0 0 0 2.5px var(--card2)}
.rnglbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--label2);margin-top:6px}
.rnglbl span:nth-child(2){font-weight:600}

/* ---------- דוח תקופה ---------- */
.headline{background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);padding:14px 15px}
.headline p{font-size:15px;line-height:1.55}
.pcard{background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);padding:12px 14px;margin-top:9px}
.ptop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.pnm{font-weight:650;font-size:16px;flex:1;min-width:90px}
.pline{margin:0 0 6px;font-size:15px;line-height:1.5}

/* ---------- מגמה שבועית ---------- */
.wklist{display:flex;flex-direction:column;gap:11px;margin-top:10px}
.wkitem{display:flex;flex-direction:column;gap:3px}
.wkrow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card2);border:1px solid var(--brd);
  border-radius:var(--r-inner);padding:10px 13px;
}
/* במסך צר (320px) שורת הצעדים מחזיקה ארבעה אלמנטים. עדיף שתישבר לשתי
   שורות מאשר שתגלוש מחוץ לכרטיס. */
.wksrc{
  flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px;color:var(--label2);
}
.wkrow.thin{opacity:.72}
.wkdt{flex:1 1 auto;min-width:88px;font-size:14px;color:var(--label2)}
.wkav{font-weight:650;font-size:16px;min-width:58px;text-align:end}
.wkd{font-size:14px;font-weight:600;min-width:62px;text-align:end}
.wkd.pos{color:var(--good-txt)} .wkd.neg{color:var(--bad-txt)} .wkd.flat{color:var(--label2)}
.wknote{font-size:12.5px;color:var(--label2);margin:3px 13px 0}

/* ---------- קטלוג המיומנויות ---------- */
.lvhead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;
  color:var(--label2);margin:16px 0 8px}
.lvhead:first-of-type{margin-top:0}
.lvn{margin-inline-start:auto;font-size:12px;color:var(--label3);font-weight:600}
/* תשע לשוניות — התוויות מתקצרות עוד קצת במסך צר */

.lvdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.lvdot.l1{background:var(--good-txt)} .lvdot.l2{background:var(--teal)}
.lvdot.l3{background:var(--accent)}   .lvdot.l4{background:var(--orange)}
.lvdot.l5{background:var(--bad-txt)}
.skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.skcard{
  text-align:start;background:var(--card2);border:1px solid var(--brd);
  border-radius:var(--r-inner);padding:11px 13px;cursor:pointer;font-family:inherit;
  color:var(--label);display:flex;flex-direction:column;gap:2px;min-height:60px;
}
.skcard b{font-size:15px;font-weight:650}
.skcard .sken{font-size:11.5px;color:var(--label3);direction:ltr;text-align:start}
.skcard .sksteps{font-size:12px;color:var(--label2);margin-top:2px}
.skcard:hover{border-color:var(--accent)}
.skcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;padding:5px 12px;border-radius:980px;background:var(--fill);color:var(--label2)}
.chip.hot{background:var(--btn-bg);color:#fff;font-weight:600}
:root[data-theme="dark"] .chip.hot{color:#06121a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.hot{color:#06121a}}

.ladder2{display:flex;flex-direction:column;gap:7px}
.lrow{display:flex;align-items:center;gap:11px;background:var(--card2);
  border:1px solid var(--brd);border-radius:var(--r-inner);padding:10px 13px}
.lnum{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--btn-bg);
  color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center}
:root[data-theme="dark"] .lnum{color:#06121a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lnum{color:#06121a}}
.lbody{flex:1;min-width:0}
.lbody b{font-size:14.5px;font-weight:600;display:block}
.ldiff{flex:0 0 auto;font-size:13px;color:var(--label2);min-width:18px;text-align:end}

.ytrow{display:flex;align-items:center;gap:11px;background:var(--card2);
  border:1px solid var(--brd);border-radius:var(--r-inner);padding:12px 14px;
  margin-bottom:8px;text-decoration:none;color:var(--label);min-height:52px}
.ytrow:last-child{margin-bottom:0}
.ytk{flex:1;min-width:0}
.ytk b{font-size:15px;font-weight:600;display:block;direction:ltr;text-align:start}
.ytrow:hover{border-color:var(--accent)}
.ytrow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- כותרת־מקטע לחיצה (מחולל / אירובי) ---------- */
.sect{
  display:flex;align-items:center;gap:12px;width:100%;text-align:start;
  font:inherit;color:var(--label);cursor:pointer;
  background:var(--card);
  -webkit-backdrop-filter:saturate(180%) blur(var(--blur));
  backdrop-filter:saturate(180%) blur(var(--blur));
  border:1px solid var(--brd);box-shadow:var(--shadow);
  border-radius:var(--r-card);padding:15px 16px;margin:0 0 14px;min-height:56px;
}
.sect:hover{border-color:var(--accent)}
.sect:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sect.on{margin-bottom:10px;border-color:var(--accent)}
.secn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.secn b{font-size:18px;font-weight:650;letter-spacing:-0.2px}
.secn span{font-size:13px;color:var(--label2);line-height:1.4}
.secx{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--fill);
  color:var(--accent-txt);font-size:18px;font-weight:700;line-height:1;
  display:grid;place-items:center;
}
.sect.on .secx{background:var(--btn-bg);color:#fff}
:root[data-theme="dark"] .sect.on .secx{color:#06121a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sect.on .secx{color:#06121a}}
/* ---------- מסך התפריט ---------- */
.mhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.mhead h2{margin:0;flex:1;min-width:90px}
.mopt{margin-bottom:11px}
.mtot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card2);
  border:1px solid var(--brd);border-radius:var(--r-inner);padding:11px 5px}
.mt b{font-size:20px;font-weight:680;line-height:1.1}
.mt span{font-size:11px;color:var(--label2);text-align:center;line-height:1.3}
.mrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--sep)}
.mrow:last-of-type{border-bottom:0}
.mrow.sw .mn{color:var(--accent)}
.mn{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg{flex:0 0 auto;font-size:13px;color:var(--label2);white-space:nowrap}
.mk{flex:0 0 auto;font-size:13px;color:var(--label2);min-width:38px;text-align:end}
.mswap{flex:0 0 auto;font:inherit;font-size:12.5px;color:var(--accent-txt);background:none;
  border:1px solid var(--brd);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:44px;min-width:44px}
.mswap:hover{border-color:var(--accent)}
.mswap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.malts{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 11px}
.malts button{font:inherit;font-size:12.5px;color:var(--label);background:var(--fill);
  border:1px solid transparent;border-radius:999px;padding:7px 12px;cursor:pointer;min-height:32px}
.malts button:hover{border-color:var(--accent)}
.malts button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.malts .reset{color:var(--label2)}
.good{color:var(--good-txt);font-weight:600}
.bad{color:var(--bad-txt);font-weight:600}
@media (max-width:359px){
  .mtot{grid-template-columns:repeat(2,1fr)}
  .mk{display:none}
}
/* ---------- כרטיסי האירובי ---------- */
.cdo{display:flex;flex-direction:column;gap:3px;width:100%;text-align:start;
  background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);
  padding:12px 13px;margin-bottom:9px;cursor:pointer;font:inherit;color:var(--txt);
  transition:border-color .15s,background .15s}
.cdo:hover{border-color:var(--accent)}
.cdo.on{border-color:var(--accent);background:var(--glow1)}
.cdo:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cdotop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px}
.cdotop b{font-size:15px;font-weight:650}
.cdointf{font-size:11.5px;color:var(--label2);margin-inline-start:auto;white-space:nowrap}
.cdow{font-size:13px;color:var(--label2);line-height:1.5}
.cdop{font-size:12.5px;color:var(--good-txt);line-height:1.5}
.cdoc{font-size:12.5px;color:var(--label2);line-height:1.5}
.note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--sep);line-height:1.65}
/* ---------- מבנה האימונים בתצוגה המקדימה ---------- */
.sess{background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);
  padding:14px 15px;margin-top:12px}
.sesshead{display:flex;align-items:center;gap:11px;margin-bottom:10px;
  padding-bottom:10px;border-bottom:1px solid var(--sep)}
.sessltr{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--btn-bg);
  color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center}
:root[data-theme="dark"] .sessltr{color:#06121a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sessltr{color:#06121a}}
.sesst{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sesst b{font-size:16px;font-weight:650}
.sesst span{font-size:12.5px;color:var(--label2)}
.bnum{flex:0 0 auto;width:19px;font-size:12px;color:var(--label2);
  font-variant-numeric:tabular-nums;text-align:center}
.cdoltr{background:var(--red)}
.sessrest{margin:9px 0 0;padding-top:9px;border-top:1px solid var(--sep)}
/* ---------- מחולל התוכניות ---------- */
.bq{margin-bottom:16px}
.bql{display:block;font-size:13px;font-weight:600;color:var(--label2);margin-bottom:7px}
.bqhint{font-weight:400;color:var(--label2);font-size:12px;margin-inline-start:6px}
.seg.wrapseg{flex-wrap:wrap;height:auto;padding:4px}
.seg.wrapseg button{flex:1 1 auto;min-width:82px;padding:7px 6px}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.lvl{
  text-align:start;background:var(--card2);border:1px solid var(--brd);
  border-radius:var(--r-inner);padding:10px 12px;cursor:pointer;font-family:inherit;
  color:var(--label);display:flex;flex-direction:column;gap:3px;min-height:56px;
}
.lvl b{font-size:14.5px;font-weight:650}
.lvl span{font-size:12px;color:var(--label2);line-height:1.4}
.lvl.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lvl.on b{color:var(--accent-txt)}
.lvl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.brow{
  display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--sep);font-size:14.5px;
}
.brow:last-child{border-bottom:none}
.bn{flex:1;min-width:0}
.bs{flex:0 0 auto;color:var(--label2);font-size:13px;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- צעדים ---------- */
.stepnow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}
.stepbig{font-size:38px;font-weight:700;line-height:1.05;letter-spacing:0}
.stepmid{font-size:22px;font-weight:650;line-height:1.15;color:var(--label2)}
.stepbars{display:flex;gap:6px;align-items:flex-end;height:88px;margin-bottom:6px}
.stepbar{flex:1;display:flex;flex-direction:column;gap:5px;height:100%}
.sbwrap{flex:1;display:flex;align-items:flex-end;background:var(--fill);border-radius:7px;overflow:hidden}
.sbfill{width:100%;background:var(--btn-bg);border-radius:7px;min-height:3px}
.stepbar.none .sbwrap{background:transparent;border:1px dashed var(--sep)}
.sblab{font-size:11px;text-align:center;color:var(--label2)}
.steprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.steprow input{flex:1 1 120px;min-width:0}
.steprow button{flex:0 0 auto}
.livebox{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sep2{height:1px;background:var(--sep);margin:16px 0}
.h3{font-size:15px;font-weight:650;margin:0 0 8px}
.xbtn{
  flex:0 0 auto;background:none;border:none;cursor:pointer;font-family:inherit;
  color:var(--label2);font-size:15px;line-height:1;padding:8px;margin:-8px -6px -8px 0;
  border-radius:8px;min-width:34px;min-height:34px;
}
.xbtn:hover{color:var(--bad-txt);background:var(--fill)}
.malts button{color:var(--label)}
.xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- מיפוי עמודות ותצוגה מקדימה ---------- */
.maps{display:flex;flex-direction:column;gap:7px}
.mrow{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--brd);border-radius:10px;padding:7px 11px}
.mrow .mh{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow select{width:auto;min-width:132px;padding:7px 10px;font-size:14px;background:var(--card)}
table.prev{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
table.prev th,table.prev td{padding:7px 9px;text-align:start;white-space:nowrap;border-bottom:0.5px solid var(--sep)}
table.prev th{color:var(--label2);font-weight:600;font-size:12px}
table.prev td.num{font-variant-numeric:tabular-nums;direction:ltr}

/* ---------- מסכי כניסה ---------- */
body.noauth{padding-bottom:0}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.authcard{width:100%;max-width:400px;border-radius:24px;padding:26px 24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--label2);margin-bottom:20px}
.bmark{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--teal));flex:none}
.authcard h1{font-size:27px;font-weight:700;letter-spacing:-0.4px;margin:0 0 5px}
.sub2{color:var(--label2);font-size:15px;margin:0 0 20px}
.authcard .f{margin-bottom:13px}
.authcard .btn{margin-top:5px}
/* ---------- מי רשום במכשיר הזה ---------- */
.whobox{background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);
  padding:11px 13px;margin-bottom:16px}
.wholbl{display:block;font-size:12.5px;color:var(--label2);margin-bottom:8px}
.whos{display:flex;flex-wrap:wrap;gap:7px}
.whochip{font:inherit;font-size:14px;font-weight:600;color:var(--accent-txt);
  background:var(--fill);border:1px solid transparent;border-radius:999px;
  padding:9px 15px;cursor:pointer;min-height:44px;direction:ltr}
.whochip:hover{border-color:var(--accent-txt)}
.whochip:focus-visible{outline:2px solid var(--accent-txt);outline-offset:2px}
.authlinks{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:18px}
.lnk{background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--accent-txt);cursor:pointer;padding:10px 8px;min-height:44px}
.lnk:active{opacity:.6}
.amsg{margin-top:14px;padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.5}
.amsg.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.amsg.ok{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.note{font-size:12.5px;color:var(--label2);line-height:1.6;margin:14px 0 0}
.note.fine{margin-top:20px;padding-top:14px;border-top:0.5px solid var(--sep)}
.codebox{margin-top:18px;padding:16px;border-radius:14px;background:var(--card2);border:1px solid var(--brd);text-align:center}
.codebox .code{font-size:23px;font-weight:700;letter-spacing:2px;margin:10px 0;direction:ltr}
/* ---------- בחירת מטרה ---------- */
.pick{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pk{display:flex;align-items:flex-start;gap:11px;background:var(--card2);border-radius:var(--r-inner);
  padding:12px 13px;cursor:pointer;border:2px solid var(--brd)}
.pk:has(input:checked){border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.pk input{margin:3px 0 0;width:19px;height:19px;flex:none;accent-color:var(--blue)}
.pk span{display:block}
.pk b{display:block;font-size:15px;font-weight:650}
.pk i{display:block;font-style:normal;font-size:12.5px;color:var(--label2);line-height:1.5;margin-top:3px}
input.gin{width:74px;padding:6px 9px;font-size:14px;text-align:center;display:inline-block}
ol.steps{margin:10px 0 12px;padding-inline-start:22px}
ol.steps li{font-size:14px;line-height:1.65;margin-bottom:9px;color:var(--label)}
ol.steps li::marker{color:var(--accent-txt);font-weight:700}
ul.tips{margin:10px 0 0;padding-inline-start:20px}
ul.tips li{font-size:14px;line-height:1.6;margin-bottom:7px;color:var(--label)}
ul.tips li::marker{color:var(--accent)}
.codebox .btn{margin-top:12px}

/* ---------- רישום אימון ---------- */
.logrow{display:flex;gap:11px;align-items:flex-start;background:var(--card2);border:1px solid var(--brd);border-radius:var(--r-inner);padding:12px;margin-bottom:9px}
.logrow.done{background:color-mix(in srgb,var(--green) 12%,transparent)}
.lgmain{flex:1;min-width:0}
.lgnm{font-weight:650;font-size:15px}
.lgin{display:flex;gap:8px;margin-top:8px}
.lgin input:first-child{max-width:88px}
.lgnote{margin-top:8px;font-size:14px}

/* סיווג ציוד למסד הישן לפי מה שהתרגיל באמת דורש, לא לפי מילה בשם */
function guessEq(o){
  if(/טבעות|גומייה|בגומייה|מוט|תלייה|חקלאי|מקבילים/.test(o.n)) return "simple";
  if(/משיכה אנכית|אחיזה/.test(o.pat)) return "simple";
  if(o.pat==="משיכה אופקית"&&!/שולחן|גומייה/.test(o.n)) return "simple";
  if(o.pat==="ליבה כפיפה"&&/תלייה/.test(o.n)) return "simple";
  return "none";
}

/* ============================================================================
   גיבוב סיסמאות — SHA-256 במימוש ג'אווהסקריפט
   ----------------------------------------------------------------------------
   מכוון לא להסתמך על crypto.subtle: הוא לא זמין בכל הקשר שבו הקובץ עשוי
   להיפתח, וכשהוא חסר ההתחברות פשוט נשברת. מימוש עצמאי עובד תמיד.
   הסיסמה עצמה לא נשמרת בשום מקום — רק תוצאת הגיבוב.
   ============================================================================ */
const SHA_K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(str){
  const utf8=unescape(encodeURIComponent(str));
  const len=utf8.length, bits=len*8;
  const words=[];
  for(let i=0;i<len;i++) words[i>>2]=(words[i>>2]||0)|(utf8.charCodeAt(i)<<(24-(i%4)*8));
  words[len>>2]=(words[len>>2]||0)|(0x80<<(24-(len%4)*8));
  const total=(((len+8)>>6)+1)*16;
  for(let i=words.length;i<total;i++) words[i]=0;
  words[total-1]=bits;
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Array(64);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<total;i+=16){
    for(let t=0;t<16;t++) w[t]=words[i+t]|0;
    for(let t=16;t<64;t++){
      const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+SHA_K[t]+w[t])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)|0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    h=[(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
const STRETCH=25000;
function keyStretch(pw,salt){
  let v=salt+"|"+pw;
  for(let i=0;i<STRETCH;i++) v=sha256(v);
  return v;
}
function randHex(n){
  let s="";
  for(let i=0;i<n;i++) s+="0123456789abcdef"[Math.floor(Math.random()*16)];
  return s;
}
/* קוד שחזור קריא, בלי תווים שקל לבלבל ביניהם */
function makeRecoveryCode(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<12;i++){ if(i&&i%4===0) s+="-"; s+=A[Math.floor(Math.random()*A.length)] }
  return s;
}

function load(k,fb){ try{const r=localStorage.getItem(k);return r?JSON.parse(r):fb}catch(e){return fb} }

/* ערכת הצבע נשמרת מחוץ למרחב המשתמש, כדי שגם מסך הכניסה יכבד אותה.
   שלוש אפשרויות: בהיר, כהה, או לפי המכשיר. */
const K_THEME="shapeup.theme";
const THEMES=[{id:"light",lab:"בהיר"},{id:"dark",lab:"כהה"},{id:"auto",lab:"לפי המכשיר"}];
/* המצב הנוכחי מוחזק בזיכרון ולא נקרא מהאחסון בכל פעם: אם האחסון חסום,
   הערכה עדיין מתחלפת והכפתור המסומן ממשיך לשקף את מה שבאמת מוצג. */
let curTheme=(function(){ try{ return localStorage.getItem(K_THEME)||"auto" }catch(e){ return "auto" } })();
function getTheme(){ return curTheme }
function applyTheme(t){
  const el=document.documentElement;
  if(t==="light"||t==="dark") el.setAttribute("data-theme",t);
  else el.removeAttribute("data-theme");
  const dark=(t==="dark")||(t==="auto"&&window.matchMedia&&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    if(!m.getAttribute("media")) m.setAttribute("content",dark?"#000000":"#EEF3FB");
  });
}
function setTheme(t){
  curTheme=t;
  try{ localStorage.setItem(K_THEME,t) }catch(e){}
  applyTheme(t);
}
function uk(id,name){ return "trendline.u."+id+"."+name }

const UI_DEFAULT={tab:"add",range:"180",metric:"weight"};

/* חשבון ראשוני, מוזרק פעם אחת יחד עם כל הנתונים שכבר נצברו.
   הסיסמה אינה מופיעה כאן — רק המלח ותוצאת הגיבוב. */
const SEED_USER={ id:null, username:null, name:null, salt:null, height:null, age:null, sex:null, hash:null, contactType:null, contact:null, recovery:null, created:null };

function loadUser(u){
  me=u;
  entries =load(uk(u.id,"entries"),null);
  circ    =load(uk(u.id,"circ"),null);
  plans   =load(uk(u.id,"plans"),null);
  workouts=load(uk(u.id,"workouts"),null)||[];
  meals   =load(uk(u.id,"meals"),null)||[];
  customFoods=load(uk(u.id,"foods"),null)||[];
  steps   =load(uk(u.id,"steps"),null)||[];
  ui      =load(uk(u.id,"ui"),null)||Object.assign({},UI_DEFAULT);
  /* נתוני הזרע שייכים לחשבון הראשון בלבד. משתמש חדש מתחיל ריק —
     גם מבחינת פרטיות וגם מפני שתוכניות האימון שלו הן חומר של המאמן שלו. */
  const mine=u.id===SEED_USER.id;
  if(entries===null) entries=mine?SEED_ENTRIES.map(e=>Object.assign({id:uid()},e)):[];
  if(circ===null)    circ   =mine?SEED_CIRC.map(c=>Object.assign({id:uid()},c)):[];
  if(plans===null)   plans=[];
  if(mine) bootPlans();
  entries.forEach(e=>{ if(!e.id) e.id=uid() });
  circ.forEach(c=>{ if(!c.id) c.id=uid() });
  persist();
}
function bootPlans(){
  if(ui.seededPlans) return;
  SEED_PLANS.forEach(sp=>{
    if(!plans.some(p=>p.title===sp.title))
      plans.push({id:uid(),date:"2026-08-15",title:sp.title,note:sp.note,body:sp.body,swaps:{}});
  });
  ui.seededPlans=true;
}
function logout(){
  session=null; save(K_SESS,null);
  me=null; entries=[];circ=[];plans=[];workouts=[];ui=Object.assign({},UI_DEFAULT);
  auth={screen:"login",err:null,msg:null,pending:null};
  render();
}
function findUser(name){
  const n=String(name||"").trim().toLowerCase();
  return users.find(u=>u&&u.username&&u.username.toLowerCase()===n)||null;
}

/* אתחול: יצירת החשבון הראשון והעברת הנתונים שכבר קיימים מהגרסה הקודמת.
   בגרסה שמשותפת לאחרים אין חשבון מוזרק — הבדיקה על username מוודאת
   שלא נוצר "משתמש רפאים" בלי שם, שהפיל את מסך ההרשמה. */
const HASH_VERSION=2;
function bootAuth(){
  users=users.filter(u=>u&&u.username);
  if(SEED_USER.username&&!users.some(u=>u.id===SEED_USER.id)){
    users.push(Object.assign({},SEED_USER,{hv:HASH_VERSION}));
    save(K_USERS,users);
    const legacyE=load(K_ENTRIES,null), legacyC=load(K_CIRC,null),
          legacyP=load(K_PLANS,null),   legacyU=load(K_UI,null);
    if(legacyE) save(uk(SEED_USER.id,"entries"),legacyE);
    if(legacyC) save(uk(SEED_USER.id,"circ"),legacyC);
    if(legacyP) save(uk(SEED_USER.id,"plans"),legacyP);
    if(legacyU) save(uk(SEED_USER.id,"ui"),legacyU);
  }
  /* החשבון המוזרק נשמר בדפדפן בהרצה הראשונה. אם נוסחת הגיבוב השתנתה
     מאז, ההאש השמור נשאר ישן וההתחברות נכשלת — הקובץ הוא מקור האמת
     לחשבון הזה, ולכן פרטי ההזדהות מסונכרנים ממנו פעם אחת בלבד.
     אחרי הסנכרון הסימון נשמר, כך ששינוי סיסמה עתידי לא יידרס. */
  const seeded=SEED_USER.username?users.find(u=>u.id===SEED_USER.id):null;
  if(seeded&&seeded.hv!==HASH_VERSION){
    seeded.salt=SEED_USER.salt;
    seeded.hash=SEED_USER.hash;
    seeded.recovery=null;
    if(!seeded.height) seeded.height=SEED_USER.height;
    seeded.hv=HASH_VERSION;
    save(K_USERS,users);
  }
  if(session){
    const u=users.find(x=>x.id===session);
    if(u) loadUser(u); else session=null;
  }
}
/* שמירה עם טיפול במקום שנגמר.
   כשהאחסון מתמלא נמחקות התמונות הישנות ביותר — לעולם לא הנתונים המספריים. */
/* כישלון שמירה חייב להיות רועש. נתונים שנעלמים בשקט הם התקלה הגרועה
   ביותר שיכולה לקרות כאן, ולכן מודיעים עליו — פעם אחת, לא בכל הקלדה. */
function saveFailed(){
  if(window.__saveFail) return false;
  window.__saveFail=true;
  try{ toast("השמירה נכשלה — גבה את הנתונים") }catch(e){}
  return false;
}

/* ---- גיבוי ושחזור ----
   היו שלושה מקומות שבנו את הגיבוי ושניים ששחזרו אותו, כל אחד עם רשימת
   שדות משלו. התוצאה: הגיבוי לא כלל אימונים, ארוחות ומאכלים אישיים,
   ומסלול ההדבקה גם דילג על צעדים. עכשיו יש מקור אחד. */
const BACKUP_V=3;
function backupPayload(){
  return {v:BACKUP_V, entries, circ, plans, steps, workouts, meals, customFoods};
}
function backupText(){ return JSON.stringify(backupPayload(),null,1) }
/* מה יש בגיבוי, בעברית — כדי שהמשתמש יראה מה הוא עומד לדרוס */
function backupSummary(d){
  const parts=[];
  const add=(a,one,many)=>{ if(Array.isArray(a)&&a.length) parts.push(a.length+" "+(a.length===1?one:many)) };
  add(d.entries,"שקילה","שקילות"); add(d.circ,"מדידת היקפים","מדידות היקפים");
  add(d.plans,"תוכנית","תוכניות"); add(d.steps,"יום צעדים","ימי צעדים");
  add(d.workouts,"אימון","אימונים"); add(d.meals,"ארוחה","ארוחות");
  add(d.customFoods,"מאכל אישי","מאכלים אישיים");
  return parts.length?parts.join(" · "):"כלום";
}
/* שחזור. הכלל: שדה שאינו קיים בגיבוי — לא נוגעים בו.
   גיבוי מגרסה ישנה לא אומר "אין לי אימונים", הוא אומר "לא שמרתי אימונים",
   ואסור שיימחק בגללו מה שכבר קיים.
   האישור נשאל בחוץ (ask), כי confirm של הדפדפן ניתן להשתקה בשקט. */
function backupApplyNow(d){
  const take=(a,extra)=>a.map(x=>Object.assign({id:uid()},extra||{},x));
  entries=take(d.entries);
  if(Array.isArray(d.circ))        circ        =take(d.circ);
  if(Array.isArray(d.plans))       plans       =take(d.plans,{swaps:{}});
  if(Array.isArray(d.steps))       steps       =take(d.steps);
  if(Array.isArray(d.workouts))    workouts    =take(d.workouts);
  if(Array.isArray(d.meals))       meals       =take(d.meals);
  if(Array.isArray(d.customFoods)) customFoods =take(d.customFoods);
  window.__lastAnalysis=null; window.__imp=null; ui.anId=null;
  persist();
  return "שוחזר: "+backupSummary(d);
}
function backupApply(d,done){
  if(!d||!Array.isArray(d.entries)){
    if(done) done({ok:false,msg:"הטקסט אינו גיבוי תקין"});
    return {ok:false,msg:"הטקסט אינו גיבוי תקין"};
  }
  ask("הגיבוי מכיל: "+backupSummary(d)+
      "\n\nזה יחליף את מה שקיים עכשיו: "+backupSummary(backupPayload()),
      ()=>{ const m=backupApplyNow(d); render(); toast(m); if(done) done({ok:true,msg:m}) },
      {ok:"שחזר והחלף",danger:true});
  return {ok:null,msg:null};
}
function persist(){
  if(!me) return false;
  const K_ENTRIES=uk(me.id,"entries");
  save(uk(me.id,"circ"),circ); save(uk(me.id,"plans"),plans);
  save(uk(me.id,"ui"),ui); save(uk(me.id,"workouts"),workouts); save(uk(me.id,"meals"),meals); save(uk(me.id,"foods"),customFoods);
  save(uk(me.id,"steps"),steps);
  if(save(K_ENTRIES,entries)) return true;
  const withImg=entries.filter(e=>e.img).sort((a,b)=>a.date<b.date?-1:1);
  for(const e of withImg){
    delete e.img;
    if(save(K_ENTRIES,entries)){ toast("האחסון התמלא — תמונות ישנות נמחקו, הנתונים נשמרו"); return true }
  }
  return saveFailed();
}

const DAY=86400000;
function toDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d) }
function dayNum(s){ return Math.round(toDate(s).getTime()/DAY) }
function fmtDate(s){ const d=toDate(s); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getFullYear()).slice(2) }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function n1(x){ return x==null||isNaN(x)?"—":(Math.round(x*10)/10).toFixed(1) }
function n2(x){ return x==null||isNaN(x)?"—":(Math.round(x*100)/100).toFixed(2) }
function sgn(x,dec){ if(x==null||isNaN(x))return "—"; const v=(Math.round(x*Math.pow(10,dec))/Math.pow(10,dec)).toFixed(dec); return (x>0?"+":"")+v }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])) }
function median(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y),m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2 }

/* השלמת שדות נגזרים — מסת שומן ומסה רזה ממשקל ואחוז */
function derive(e){
  const o=Object.assign({},e);
  o._dFat=false; o._dLean=false;
  if(o.fat==null && o.weight!=null && o.bf!=null){ o.fat=o.weight*o.bf/100; o._dFat=true }
  if(o.lean==null && o.weight!=null && o.fat!=null){ o.lean=o.weight-o.fat; o._dLean=true }
  return o;
}
/* שקילות בוקר בלבד — הבסיס לכל ממוצע ומגמה. "אחר" מוחרג לחלוטין. */
function official(){ return entries.filter(e=>e.kind==="morning"&&e.weight!=null).map(derive).sort((a,b)=>a.date<b.date?-1:1) }
function allSorted(){ return entries.map(derive).sort((a,b)=> a.date===b.date ? (a.kind==="morning"?-1:1) : (a.date<b.date?-1:1)) }

/* ============================================================================
   סטטיסטיקה
   ============================================================================ */
function regress(pts){ // pts: [{x,y}]
  const n=pts.length; if(n<2) return null;
  let sx=0,sy=0,sxy=0,sxx=0;
  pts.forEach(p=>{sx+=p.x;sy+=p.y;sxy+=p.x*p.y;sxx+=p.x*p.x});
  const den=n*sxx-sx*sx; if(!den) return null;
  const slope=(n*sxy-sx*sy)/den, icpt=(sy-slope*sx)/n;
  const my=sy/n; let ss=0,sr=0;
  pts.forEach(p=>{ const pr=slope*p.x+icpt; ss+=(p.y-my)**2; sr+=(p.y-pr)**2 });
  return {slope,icpt,r2: ss?1-sr/ss:0,n,span:pts[pts.length-1].x-pts[0].x};
}

/* זיהוי חריגים — MAD בחלון נע של ±10 יום */
function markOutliers(rows,key){
  const out={};
  rows.forEach(r=>{
    const v=r[key]; if(v==null) return;
    const d=dayNum(r.date);
    const nb=rows.filter(o=>o[key]!=null&&Math.abs(dayNum(o.date)-d)<=10&&o.id!==r.id).map(o=>o[key]);
    if(nb.length<4) return;
    const med=median(nb);
    const mad=median(nb.map(x=>Math.abs(x-med)));
    /* כשכל המדידות סביב זהות, ה־MAD יוצא 0 והחלוקה בו מבטלת את הבדיקה
       דווקא במקרה שבו חריגה בולטת ביותר. במצב הזה נופלים לרצפה שמרנית
       שנגזרת מסף המשמעות של המדד — כך נתפסת רק חריגה בלתי אפשרית,
       ולא תנודה אמיתית. */
    const scale=mad?1.4826*mad:(SIG[key]||1)*1.5;
    if(Math.abs(v-med)/scale>3) out[r.id]=true;
  });
  return out;
}

/* מגמה עם שמירת סף — לא מוציא מספר מחלון נתונים קצר מדי */
function trendOf(key,preferDays){
  const rows=official().filter(r=>r[key]!=null);
  if(!rows.length) return {ok:false,reason:"אין נתונים"};
  const last=dayNum(rows[rows.length-1].date);
  const wins=preferDays?[preferDays].concat(WINDOWS.filter(w=>w>preferDays)):WINDOWS;
  for(const w of wins){
    const sub=rows.filter(r=>last-dayNum(r.date)<=w);
    if(sub.length<MIN_POINTS) continue;
    const span=last-dayNum(sub[0].date);
    if(span<MIN_SPAN) continue;
    const reg=regress(sub.map(r=>({x:dayNum(r.date),y:r[key]})));
    if(!reg) continue;
    return {ok:true,window:w,perWeek:reg.slope*7,r2:reg.r2,n:sub.length,span,first:sub[0],last:sub[sub.length-1]};
  }
  return {ok:false,reason:"עוד מוקדם לקבוע מגמה",n:rows.length};
}

/* ממוצע נע אחורה */
function movingAvg(rows,key,win){
  const out=[];
  rows.forEach(r=>{
    if(r[key]==null) return;
    const d=dayNum(r.date);
    const w=rows.filter(o=>o[key]!=null&&dayNum(o.date)<=d&&d-dayNum(o.date)<win);
    if(!w.length) return;
    out.push({d,v:w.reduce((s,o)=>s+o[key],0)/w.length});
  });
  return out;
}
function avgLastDays(key,days,offset){
  const rows=official().filter(r=>r[key]!=null);
  if(!rows.length) return null;
  const last=dayNum(rows[rows.length-1].date);
  const hi=last-(offset||0), lo=hi-days;
  const w=rows.filter(r=>{const d=dayNum(r.date);return d<=hi&&d>lo});
  return w.length? w.reduce((s,r)=>s+r[key],0)/w.length : null;
}

/* ============================================================================
   מנוע הניתוח — הלב של האפליקציה
   ============================================================================ */
function classifyEnergy(kcalDay){
  const a=Math.abs(kcalDay);
  if(a<=KCAL_PLAUSIBLE) return {cls:"ok",  txt:"שינוי סביר", badge:"b-ok"};
  if(a<=KCAL_IMPOSSIBLE) return {cls:"warn",txt:"כנראה רעש מדידה", badge:"b-warn"};
  return {cls:"crit",txt:"בלתי אפשרי פיזיולוגית", badge:"b-crit"};
}

function analyze(entry){
  const rows=official();
  const out=markOutliers(rows,"bf");
  const e=derive(entry);
  const idx=rows.findIndex(r=>r.id===entry.id);
  const before=idx>=0?rows.slice(0,idx):rows.filter(r=>r.date<e.date);

  const res={entry:e,isOutlier:!!out[entry.id],parts:[],flags:[]};

  /* --- 1. השוואה לשקילה הקודמת שאינה חריגה --- */
  const prev=before.slice().reverse().find(r=>!out[r.id]);
  const prevRaw=before[before.length-1];
  if(prev){
    const days=Math.max(1,dayNum(e.date)-dayNum(prev.date));
    const c={days,prev,skipped:prevRaw&&prevRaw.id!==prev.id?prevRaw:null};
    c.dW=e.weight!=null&&prev.weight!=null?e.weight-prev.weight:null;
    c.dBf=e.bf!=null&&prev.bf!=null?e.bf-prev.bf:null;
    c.dFat=e.fat!=null&&prev.fat!=null?e.fat-prev.fat:null;
    c.dLean=e.lean!=null&&prev.lean!=null?e.lean-prev.lean:null;
    if(c.dFat!=null){ c.kcalDay=c.dFat*KCAL_PER_KG_FAT/days; c.verdict=classifyEnergy(c.kcalDay) }
    if(c.dLean!=null){ c.leanPerDay=c.dLean/days; c.leanOverCeiling=c.leanPerDay>LEAN_CEILING_DAY }
    /* הפרשים לכל שאר מדדי הדוח */
    c.extra=OCR_FIELDS.filter(f=>!f.core).map(f=>({
      f, now:e[f.key], was:prev[f.key],
      d:(e[f.key]!=null&&prev[f.key]!=null)?e[f.key]-prev[f.key]:null
    })).filter(x=>x.now!=null);
    res.compare=c;
  }

  /* --- 1.5 השוואה לשלוש השקילות האחרונות ---
     השוואה מול נקודה אחת לא מבדילה בין שינוי לרעש. שלוש נקודות כן:
     שינוי אמיתי גדל ככל שהפער בזמן גדל, ורעש קופץ לכיוונים מעורבים. */
  res.recent=before.slice(-3).reverse().map(pv=>{
    const days=Math.max(1,dayNum(e.date)-dayNum(pv.date));
    const o={prev:pv,days,outlier:!!out[pv.id]};
    o.dW=e.weight!=null&&pv.weight!=null?e.weight-pv.weight:null;
    o.dBf=e.bf!=null&&pv.bf!=null?e.bf-pv.bf:null;
    o.dFat=e.fat!=null&&pv.fat!=null?e.fat-pv.fat:null;
    o.dLean=e.lean!=null&&pv.lean!=null?e.lean-pv.lean:null;
    if(o.dFat!=null){ o.kcalDay=o.dFat*KCAL_PER_KG_FAT/days; o.verdict=classifyEnergy(o.kcalDay) }
    return o;
  });
  /* עקביות: האם הכיוון חוזר על עצמו בשלוש ההשוואות */
  const dirs=res.recent.filter(o=>o.dW!=null&&!o.outlier).map(o=>Math.sign(o.dW));
  if(dirs.length>=2){
    const same=dirs.every(s=>s===dirs[0]&&s!==0);
    res.consistent=same?(dirs[0]>0?"up":"down"):"mixed";
    res.dirCount=dirs.length;
  }

  /* --- 2. ממוצעים --- */
  res.avg7   = avgLastDays("weight",7,0);
  res.avg7p  = avgLastDays("weight",7,7);
  res.avg28  = avgLastDays("weight",28,0);
  res.bf7    = avgLastDays("bf",7,0);

  /* --- 3. מגמה + קצב מול Garthe --- */
  res.trend=trendOf("weight");
  if(res.trend.ok && e.weight){
    const pct=res.trend.perWeek/e.weight*100;
    res.ratePct=pct;
    res.rateBand=RATE_BANDS.find(b=>Math.abs(pct)<=b.max)||RATE_BANDS[RATE_BANDS.length-1];
    if(pct<0) res.rateBand=null; // ירידה — הטווחים של Garthe מתייחסים לעלייה
  }
  res.bfTrend=trendOf("bf");

  /* --- 4. היקפים --- */
  if(circ.length){
    const lastC=circ.slice().sort((a,b)=>a.date<b.date?-1:1).pop();
    res.circAge=dayNum(e.date)-dayNum(lastC.date);
    res.lastCirc=lastC;
  }

  /* --- 5. מנוע ההמלצות --- */
  res.recs=recommend(res);
  return res;
}

/* ייחוס סיבתי — מה הכי סביר שגרם למה שנראה כאן, לפי דירוג. */
function attribute(r){
  const c=r.compare, out=[];
  if(!c) return out;
  const e=r.entry, pv=c.prev;
  const dWater=(e.water!=null&&pv.water!=null)?e.water-pv.water:null;
  const dProt =(e.protein!=null&&pv.protein!=null)?e.protein-pv.protein:null;

  if(r.isOutlier)
    out.push({w:"גבוהה",t:"תנאי מדידה חריגים",d:"המדידה סוטה מהשכנות שלה מעבר לסף הסטטיסטי. הסבר של רקמה לא מסביר סטייה כזו ביום אחד."});

  if(dWater!=null&&c.dBf!=null&&Math.abs(dWater)>=0.4&&dWater*c.dBf<0)
    out.push({w:"גבוהה",t:"ארטיפקט הידרציה",
      d:"אחוז המים "+(dWater<0?"ירד":"עלה")+" ב־"+n1(Math.abs(dWater))+" נקודות ואחוז השומן זז הפוך. זו החתימה הישירה של שינוי בהידרציה — מים מוליכים, וההתנגדות שמשתנה מתורגמת לשומן."});

  if(c.leanOverCeiling)
    out.push({w:"גבוהה",t:"גליקוגן ומים",
      d:"המסה הרזה עלתה מעל התקרה הביולוגית לצבירת שריר. גרם גליקוגן קושר כ־3 גרם מים, כך שיום פחמימות גבוה מספיק כדי לייצר את זה."});

  if(c.dW!=null&&Math.abs(c.dW)>=0.7&&c.days<=2&&(dWater==null||Math.abs(dWater)<0.4))
    out.push({w:"בינונית",t:"תכולת מערכת העיכול ונוזלים",
      d:"תנודת משקל של "+n2(Math.abs(c.dW))+' ק"ג ביום־יומיים בלי תזוזה משמעותית באחוז המים מצביעה על אוכל ושתייה שעדיין במערכת, ועל מלח.'});

  if(dProt!=null&&Math.abs(dProt)>=1.2)
    out.push({w:"בינונית",t:"תנאי המדידה השתנו",
      d:"אחוז החלבון זז ב־"+n1(Math.abs(dProt))+" נקודות. הוא אמור להיות מהיציבים ביותר, ולכן התזוזה מצביעה על המדידה ולא על הגוף."});

  if(r.consistent==="up"||r.consistent==="down")
    out.push({w:"בינונית",t:"מגמה אמיתית "+(r.consistent==="up"?"כלפי מעלה":"כלפי מטה"),
      d:"הכיוון חוזר על עצמו בכל "+r.dirCount+" ההשוואות האחרונות. חזרתיות היא מה שמבדיל שינוי מרעש — רעש קופץ לכיוונים מעורבים."});
  else if(r.consistent==="mixed")
    out.push({w:"גבוהה",t:"רעש, לא כיוון",
      d:"מול שלוש השקילות האחרונות המשקל זז לכיוונים מעורבים. זו התנהגות של רעש מדידה, ואין ממה להסיק."});

  if(!out.length)
    out.push({w:"—",t:"אין אירוע שדורש הסבר",d:"כל התזוזות בתוך הרעש הרגיל של מדידה בתנאים דומים."});
  return out;
}

/* ============================================================================
   דוח תקופה במילים.
   ההשוואה היא בין ממוצע הרבע הראשון של התקופה לממוצע הרבע האחרון — כך כל
   הנתונים משתתפים, ומדידה בודדת בקצה לא קובעת את המסקנה. בלי רגרסיות
   ובלי R², כי מספר שלא מובן אינו מידע.
   ============================================================================ */
const SIG={weight:0.5,bf:0.7,fat:0.5,lean:0.6,smmPct:0.6,smi:0.15,water:0.8,
           protein:0.4,salt:0.2,muscle:0.8,bmr:30,bmi:0.2,visceral:0.5,subcut:0.5,
           score:2,stdWeight:0.5};

/* ============================================================================
   מגמה שבועית
   ----------------------------------------------------------------------------
   השבוע הוא יחידת הזמן הנכונה לגוף: הוא ארוך מספיק כדי לספוג רעש יומי של
   מים ומלח, וקצר מספיק כדי שאפשר יהיה לפעול לפיו. אותם כללים כמו בכל
   שאר הניתוחים — חריגים מוחרגים, שבוע עם מדידה אחת מסומן כלא־ממוצע,
   ושינוי מתחת לסף המשמעות של המדד נקרא "כמעט לא זז".
   ============================================================================ */
const WEEK_SHOW=12;   /* 12 שבועות — אותו טווח שהגרף מציג בבחירה "שבועי" */

/* לעברית יש צורת זוגי, ו"1 ימים" נשמע כמו טקסט של מכונה. */
function heDays(n){  return n===1?"יום אחד":n===2?"יומיים":n+" ימים" }
function heWeeks(n){ return n===1?"שבוע אחד":n===2?"שבועיים":n+" שבועות" }

function weekRange(key){
  const d=toDate(key), e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+6);
  const f=x=>String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0");
  return f(d)+" – "+f(e);
}
function weeklySeries(key,maxWeeks){
  const all=official();
  const bad=markOutliers(all,"bf");
  const rows=all.filter(r=>r[key]!=null&&!bad[r.id]);
  if(!rows.length) return [];
  const buckets={};
  rows.forEach(r=>{
    const k=weekKey(r.date);
    (buckets[k]=buckets[k]||[]).push(r[key]);
  });
  const weeks=Object.keys(buckets).sort().map(k=>({
    week:k, n:buckets[k].length,
    avg:buckets[k].reduce((a,b)=>a+b,0)/buckets[k].length
  }));
  /* השינוי נמדד מול השבוע הקודם **שיש בו נתונים** — שבוע ללא שקילות
     אינו "אפס", הוא פשוט לא קיים, ודילוג עליו נכון יותר מלהתייחס אליו. */
  weeks.forEach((w,i)=>{
    const prev=weeks[i-1];
    w.d=prev?w.avg-prev.avg:null;
    w.gap=prev?Math.round((dayNum(w.week)-dayNum(prev.week))/7):null;
  });
  const out=weeks.slice(-(maxWeeks||WEEK_SHOW)).reverse();
  return out;
}

/* ============================================================================
   השוואת שבוע מול שבוע לכל המדדים
   ----------------------------------------------------------------------------
   בתקופות הארוכות כל מדד מקבל כרטיס משלו. בשבועי זה היה חסר — וזה נתקן כאן.
   אבל שבוע הוא חלון קצר, ולכן יש הבחנה שחייבת להישמר:

   **המשקל מגיב מהר ואפשר לקרוא אותו שבועית.** אחוז השומן, המסה הרזה וכל מה
   שנגזר מהם מגיעים מ־BIA — והם מושפעים ממים, מלח וגליקוגן יותר מאשר משינוי
   ברקמה. לכן למדדי BIA נדרשת תזוזה גדולה פי 1.5 מסף המשמעות הרגיל לפני
   שנאמר עליה משהו; מתחת לזה היא מוצגת כמספר ומסומנת כרעש.
   ============================================================================ */
const WEEK_DIRECT={weight:1, navel:1, nipple:1, shoulders:1, thigh:1, calf:1, armFlex:1, forearmFlex:1};

function weekCompare(){
  const out=[];
  OCR_FIELDS.forEach(f=>{
    const info=PARAM_INFO[f.key]; if(!info) return;
    const w=weeklySeries(f.key,3);
    if(w.length<2) return;
    const now=w[0], prev=w[1];
    if(now.d==null) return;
    const sig=SIG[f.key]||1;
    const direct=!!WEEK_DIRECT[f.key];
    /* מדד BIA צריך תזוזה גדולה יותר לפני שמייחסים לה משמעות */
    const need=direct?sig*0.5:sig*1.5;
    const solid=Math.abs(now.d)>=need;
    out.push({
      key:f.key, lab:info.lab, unit:info.unit, dec:f.dec,
      from:prev.avg, to:now.avg, d:now.d,
      nNow:now.n, nPrev:prev.n, gap:now.gap,
      direct, solid,
      mag:magWord(f.key,now.d),
      verdict:solid?verdictOf(f.key,now.d,{}):null,
      what:info.what
    });
  });
  return out;
}

function periodStats(key,days){
  /* מדידות חריגות לא נכנסות לדוח. אותו כלל שחל על ההשוואה היומית חייב
     לחול גם כאן — אחרת מדידה שכבר הוכחה כבלתי אפשרית מטה את המסקנה. */
  const all=official();
  const bad=markOutliers(all,"bf");
  const rows=all.filter(r=>r[key]!=null&&!bad[r.id]);
  if(rows.length<4) return null;
  const last=dayNum(rows[rows.length-1].date);
  const sub=rows.filter(r=>last-dayNum(r.date)<=days);
  if(sub.length<4) return null;
  const span=last-dayNum(sub[0].date);
  if(span<7) return null;
  const q=Math.max(2,Math.round(sub.length/4));
  const early=sub.slice(0,q), late=sub.slice(-q);
  const avg=a=>a.reduce((s,x)=>s+x[key],0)/a.length;
  const from=avg(early), to=avg(late);
  return {from,to,d:to-from,n:sub.length,span,
          firstDate:sub[0].date,lastDate:sub[sub.length-1].date};
}

/* מילה במקום מספר: כמה גדול השינוי ביחס למה שנחשב משמעותי במדד הזה */
function magWord(key,d){
  const s=SIG[key]||1, a=Math.abs(d);
  if(a<s*0.5) return "כמעט לא זז";
  if(a<s)     return "זז קצת";
  if(a<s*2.5) return "שינוי ברור";
  return "שינוי גדול";
}

/* טוב או רע — ביחס למטרה שנבחרה. אותו שינוי במשקל הוא הצלחה במטרה אחת
   וכיוון הפוך באחרת, ולכן פסק הדין חייב לקרוא את המטרה ולא להניח אותה. */
function verdictOf(key,d,ctx){
  const s=SIG[key]||1;
  if(Math.abs(d)<s*0.5) return {v:"ok",t:"יציב",why:"אין כאן שינוי שדורש התייחסות."};
  const up=d>0;
  switch(key){
    case "weight":{
      const dir=curGoal().dir;
      if(up){
        if(ctx.bfUp) return {v:"warn",t:"תלוי",why:"המשקל עלה, אבל גם אחוז השומן. חלק מהעלייה אינו רקמה רזה."};
        if(dir==="up") return {v:"good",t:"טוב",why:"המשקל עלה בלי שאחוז השומן עלה — בדיוק הכיוון שאתה מכוון אליו."};
        if(dir==="down") return {v:"warn",t:"תלוי",why:"המשקל עלה, ובמטרה שבחרת הכיוון הרצוי הוא למטה."};
        return {v:"warn",t:"תלוי",why:"המטרה היא לשמור על המשקל, והוא זז למעלה."};
      }
      if(ctx.leanDown) return {v:"bad",t:"לא טוב",why:"המשקל ירד ויחד איתו המסה הרזה. זו לא הירידה שרצית."};
      if(dir==="down") return {v:"good",t:"טוב",why:"המשקל ירד והמסה הרזה נשמרה — זו בדיוק הירידה שרצית."};
      if(dir==="up") return {v:"warn",t:"תלוי",why:"המשקל ירד. במטרה של עלייה זה כיוון הפוך."};
      return {v:"warn",t:"תלוי",why:"המטרה היא לשמור על המשקל, והוא זז למטה."};
    }
    case "bf": case "fat": case "visceral": case "subcut":
      return up?{v:"bad",t:"לא טוב",why:"עלייה בשומן. זה המדד שאתה רוצה לשמור יציב או יורד."}
               :{v:"good",t:"טוב",why:"ירידה בשומן. זה הכיוון הנכון בכל אחת מהמטרות."};
    case "lean": case "smmPct": case "smi": case "muscle":
      return up?{v:"good",t:"טוב",why:"עלייה במסה הרזה היא המטרה המרכזית שלך."}
               :{v:"bad",t:"לא טוב",why:"ירידה במסה הרזה. שווה לבדוק אם הקלוריות או החלבון ירדו."};
    case "water":
      return {v:"ok",t:"ניטרלי",why:"אחוז המים משקף הידרציה ותנאי מדידה, לא הרכב גוף. הוא כלי אבחון, לא יעד."};
    case "protein": case "salt":
      return {v:"warn",t:"שים לב",why:"המדד הזה אמור להיות מהיציבים ביותר. תזוזה בו מרמזת שתנאי המדידה השתנו."};
    case "bmr":
      return up?{v:"good",t:"נלווה",why:"ה־BMR נגזר מהמסה הרזה, ולכן הוא עלה כי היא עלתה. לא מדידה עצמאית."}
               :{v:"warn",t:"נלווה",why:"ה־BMR ירד כי המסה הרזה ירדה. הוא לא נמדד בנפרד."};
    case "bmi":
      return {v:"ok",t:"לא רלוונטי",why:"BMI הוא רק משקל חלקי גובה. הוא לא מבדיל בין שריר לשומן, ואצלך הוא מטעה."};
    case "score":
      return {v:"ok",t:"לא רלוונטי",why:"ציון שהיצרן מחשב מהשאר. אין לו משמעות פיזיולוגית עצמאית."};
    default:
      return {v:"ok",t:"ניטרלי",why:""};
  }
}

function periodReport(days){
  const ctx={};
  const w=periodStats("weight",days), bf=periodStats("bf",days), ln=periodStats("lean",days);
  ctx.bfUp=bf?bf.d>SIG.bf*0.5:false;
  ctx.leanDown=ln?ln.d<-SIG.lean*0.5:false;

  const items=[];
  OCR_FIELDS.forEach(f=>{
    const info=PARAM_INFO[f.key]; if(!info) return;
    const st=periodStats(f.key,days);
    if(!st) return;
    items.push({key:f.key,lab:info.lab,unit:info.unit,st,
                mag:magWord(f.key,st.d),verdict:verdictOf(f.key,st.d,ctx),
                what:info.what,dec:f.dec});
  });

  /* כותרת התקופה — הסיפור בשורה אחת */
  let head=null;
  if(w){
    const wUp=w.d>SIG.weight*0.5, wDown=w.d<-SIG.weight*0.5;
    const bfUp=bf&&bf.d>SIG.bf*0.5, bfDown=bf&&bf.d<-SIG.bf*0.5;
    const lnUp=ln&&ln.d>SIG.lean*0.5, lnDown=ln&&ln.d<-SIG.lean*0.5;
    if(wUp&&!bfUp&&(lnUp||!ln)) head={v:"good",t:"עלייה איכותית",
      d:"המשקל עלה, אחוז השומן לא עלה, והתוספת נזקפת בעיקר למסה רזה. זה בדיוק מה שאתה מנסה להשיג."};
    else if(wUp&&bfUp) head={v:"warn",t:"עלייה מעורבת",
      d:"המשקל עלה, אבל גם אחוז השומן. חלק מהעלייה הוא שומן — לא אסון, אבל שווה לבדוק את קצב העלייה."};
    else if(wDown&&lnDown) head={v:"bad",t:"ירידה שכוללת מסה רזה",
      d:"גם המשקל וגם המסה הרזה ירדו. במטרה של בנייה זה הכיוון ההפוך, ושווה לבדוק קלוריות וחלבון."};
    else if(wDown&&bfDown) head={v:"good",t:"ירידה בשומן",
      d:"המשקל ירד והשומן ירד איתו, בזמן שהמסה הרזה נשמרה. אם המטרה כרגע היא לעלות — זו עצירה, לא כישלון."};
    else if(!wUp&&!wDown) head={v:"ok",t:"תקופה יציבה",
      d:"המשקל כמעט לא זז. אם זה נמשך שבועות והביצועים לא משתפרים, זו העילה לתוספת קלורית קטנה."};
    else head={v:"ok",t:"תמונה מעורבת",d:"המדדים לא מצביעים לכיוון אחד ברור."};
  }
  return {head,items,base:w};
}

function recommend(r){
  const out=[];

  if(r.isOutlier){
    out.push({cls:"crit",t:"אל תיגע בתזונה",
      d:"השקילה הזו סומנה כחריגה סטטיסטית. הכלל הקבוע: לא משנים תזונה בעקבות מדידה בודדת. תעד, תמשיך כרגיל, ותן לממוצע לספוג את זה."});
  }

  if(r.compare&&r.compare.verdict&&r.compare.verdict.cls!=="ok"){
    out.push({cls:"info",t:"הפער מול המדידה הקודמת אינו שינוי ברקמה",
      d:"האנרגיה שהיה נדרש כדי שהשינוי הזה יהיה אמיתי חורגת מהאפשרי. המקור הוא הידרציה, גליקוגן, מלח או תכולת מערכת עיכול — לא שומן ולא שריר."});
  }

  if(r.circAge==null){
    out.push({cls:"warn",t:"אין מדידת היקפים",
      d:"סרט מדידה לא מושפע מהידרציה. בלי היקפים אין דרך לאשר שהעלייה איכותית, וכל מסקנה נשענת על BIA לבדו."});
  }else if(r.circAge>14){
    out.push({cls:"warn",t:"היקפים באיחור "+r.circAge+" יום",
      d:"זו הפעולה בעלת הערך הגבוה ביותר כרגע. היקף מותניים יציב בזמן שהמשקל עולה הוא ההוכחה הטובה ביותר שהעלייה איכותית — יותר מכל מספר של המשקל."});
  }

  /* ---- הקצב מול המטרה שנבחרה ----
     אותו קצב יכול להיות מצוין במטרה אחת ובעייתי באחרת, ולכן ההערכה
     נעשית מול טווח היעד של המטרה ולא מול טווח אחיד. */
  const G=GOALS.find(g=>g.id===((me&&me.goal)||ui.goal||"mass"))||GOALS[0];
  if(r.trend.ok&&r.ratePct!=null&&G.rate){
    const [lo,hi]=G.rate, p=r.ratePct;
    const inRange=p>=lo&&p<=hi;
    const wrongWay=(G.dir==="up"&&p<0)||(G.dir==="down"&&p>0);
    if(wrongWay){
      out.push({cls:"bad",t:"הכיוון הפוך למטרה — "+G.lab,
        d:"הקצב הוא "+n2(p)+"% בשבוע, בכיוון ההפוך ממה שהמטרה מבקשת. "+
          "שבוע בודד עדיין יכול להיות רעש, אבל אם זה נמשך שבועיים — משהו בתזונה לא תואם ליעד."});
    }else if(inRange){
      out.push({cls:"ok",t:"הקצב בטווח היעד — "+n2(p)+"% בשבוע",
        d:"טווח היעד ל"+G.lab+" הוא "+n2(lo)+"% עד "+n2(hi)+"% בשבוע. אתה בתוכו. להמשיך כרגיל."});
    }else{
      const fast=Math.abs(p)>Math.max(Math.abs(lo),Math.abs(hi));
      out.push({cls:"warn",t:(fast?"מהר מהיעד":"איטי מהיעד")+" — "+n2(p)+"% בשבוע",
        d:"טווח היעד ל"+G.lab+" הוא "+n2(lo)+"% עד "+n2(hi)+"%. "+
          (fast
            ? (G.dir==="up"
                ? "בקצב מהיר יותר חלק גדל מהתוספת הוא שומן ולא שריר (Garthe 2013). לפני שמקצצים — לבדוק את ההיקפים."
                : "ירידה מהירה מדי מגדילה את איבוד המסה הרזה. שווה להוסיף קלוריות מעט ולשמור על החלבון גבוה.")
            : "לא לפעול על סמך שבוע בודד. אם זה נמשך שבועיים־שלושה, זו העילה להתאמה קטנה.")});
    }
  }else if(!r.trend.ok){
    out.push({cls:"info",t:"עוד מוקדם לקבוע מגמה",
      d:"נדרשות לפחות "+MIN_POINTS+" שקילות בוקר בפריסה של "+MIN_SPAN+
        " יום לפחות כדי להוציא מספר בעל משמעות. עדיף לומר 'לא יודע' מאשר לתת אקסטרפולציה חסרת בסיס."});
  }

  const st=(r.avg7!=null&&r.avg7p!=null)?r.avg7-r.avg7p:null;
  if(st!=null&&Math.abs(st)<0.15&&r.trend.ok&&Math.abs(r.trend.perWeek)<0.1){
    out.push({cls:"info",t:"המשקל הממוצע יציב",
      d:"אם זה נמשך 2–3 שבועות והביצועים באימון וההיקפים לא משתפרים — זו העילה לתוספת קלורית קטנה. יציבות של שבוע אחד אינה קיפאון."});
  }

  if(!out.length) out.push({cls:"ok",t:"אין פעולה נדרשת",d:"הנתונים בטווח הצפוי. להמשיך בתוכנית הנוכחית ולהמשיך לתעד."});
  return out;
}

/* ============================================================================
   קריאת מסך מצילום — OCR
   ----------------------------------------------------------------------------
   התוצאה אף פעם לא נשמרת ישירות. היא ממלאת את הטופס, ואתה מאשר.
   טעות OCR שנכנסת בשקט לנתונים מזיקה יותר מהקלדה ידנית, כי היא בלתי נראית.
   ============================================================================ */
const OCR_CDN="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let tessWorker=null, numWorker=null, tessLoading=null;

   הדוח כולו באנגלית, ולכן אין מעבר עברי כלל: מנוע העברית דווקא הרס את הספרות
   בבדיקות, ומעבר אנגלי נקי מדויק בהרבה.

   המבנה הוא טבלה: תווית | Measurement | Valuation | Normal.
   עמודת Normal מכילה טווחים ("51.5~69.7") שאסור לקרוא כערכים — לכן כל אסימון
   שנראה כמו טווח נזרק לפני שמחפשים מספר.

   חוק החילוץ: **המספר האחרון לפני אסימון הטווח**, ואם אין טווח — האחרון בשורה.
   החוק הזה נכון לכל שורה בדוח, ובזכותו אפשר לקרוא גם את שורות התרשימים:
     "Weight(kg) 0 26 51.5 60.6 69.7 83 96 110 123 137 150 | 68.40 | 51.5~69.7"
   הערך תמיד יושב אחרי מספרי הסימון ולפני הטווח.

const OCR_FIELDS=[

 {key:"subcut",  lab:'שומן תת־עורי',    unit:'ק"ג', min:1,  max:60,  dec:1, labels:["subcutaneous fat(kg)","subcutaneous fat","subcutaneous"]},

 /* --- יעדי הבקרה של המכשיר. הם יכולים להיות שליליים, ולכן טווח שלילי מותר --- */
 {key:"weightCtrl",lab:'יעד שינוי משקל', unit:'ק"ג', min:-40,max:40, dec:1, signed:1, labels:["weight control"]},
 {key:"fatCtrl",   lab:'יעד שינוי שומן', unit:'ק"ג', min:-40,max:40, dec:1, signed:1, labels:["fat control"]},
