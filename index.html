    if(swapped) h+='<div class="tiny">במקור: '+esc(it.ex||it.name||it.raw)+'</div>';
    h+='</div>';
    if(curX) h+='<span class="badge '+(curX.eq==="simple"?"b-warn":"b-ok")+'">'+(curX.eq==="simple"?"ציוד":"ללא ציוד")+'</span>';
    h+='<span class="chev">'+(open?"▲":"▼")+'</span></div>';

    if(curX){
      h+='<div class="mus" style="padding:0 13px 10px">'+
         curX.p.map(m=>'<span class="p">'+esc(m)+'</span>').join("")+
         curX.s.map(m=>'<span>'+esc(m)+'</span>').join("")+'</div>';
    }

    if(open){
      h+='<div class="exbody">';
      if(curX) h+='<p class="tiny" style="margin-bottom:8px">'+ytLink(curX,"הדגמה של "+curX.n)+'</p>';
      if(!baseX){
        /* תוכנית של מישהו אחר יכולה להשתמש בשמות שלא במסד. במקום מבוי סתום,
           אפשר לקשר את השורה לתרגיל מוכר — ומשם החלופות עובדות רגיל. */
        h+='<p class="tiny">התרגיל לא זוהה. בחר את התרגיל המקביל מהרשימה, ומשם יוצעו חלופות לפי שרירי המטרה שלו.</p>';
        h+='<div class="lgin"><select data-linkex="'+i+'"><option value="">— בחר תרגיל —</option>'+
           EX_DB.slice().sort((a,b)=>a.n<b.n?-1:1).map(x=>'<option value="'+esc(x.n)+'">'+esc(x.n)+'</option>').join("")+
           '</select></div>';
      }else{
        const sub=substitutes(baseX.n,names.filter(n=>n!==baseX.n));
        const opt=(o,label,cls)=>{
          if(!o) return '<div class="alt '+cls+'"><b>'+label+'</b>'+
            '<div class="tiny">אין חלופה שמכסה את שרירי המטרה. תרגיל שמאמן משהו אחר לא יוצג כאן.</div></div>';
          const d=o.x.diff-baseX.diff, c=o.cov;
          const pct=Math.round(c.ratio*100);
          let h2='<div class="alt '+cls+'"><b>'+label+':</b> '+esc(o.x.n)+
            ' <span class="badge b-mute">קושי '+o.x.diff+(d?' · '+(d>0?"קשה יותר":"קל יותר"):' · זהה')+'</span>'+
            (c.ratio>=1?' <span class="badge b-ok">כיסוי מלא</span>'
                       :' <span class="badge b-warn">כיסוי '+pct+'%</span>');
          /* מה בדיוק מכוסה — כדי שלא תצטרך להאמין למנוע על סמך מילה */
          h2+='<div class="cov"><span class="tiny">שרירי המטרה של '+esc(baseX.n)+':</span><div class="mus">';
          baseX.p.forEach(m=>{
            const st=c.full.indexOf(m)>=0?"p":(c.part.indexOf(m)>=0?"":"miss");
            h2+='<span class="'+st+'">'+esc(m)+
                (st==="p"?" ✓":st==="miss"?" ✗":" ~")+'</span>';
          });
          h2+='</div></div>';
          if(c.missed.length)
            h2+='<div class="tiny">לא מכוסה: <b>'+c.missed.map(esc).join(", ")+'</b>. '+
                'אם זה השריר שאתה מכוון אליו — עדיף לוותר על ההחלפה.</div>';
          else if(c.part.length)
            h2+='<div class="tiny">'+c.part.map(esc).join(", ")+' מאומן כאן כשריר משני ולא כמטרה ראשית.</div>';
          h2+='<div class="altbtns">'+ytLink(o.x)+
              '<button class="btn sec mini" data-pick="'+esc(o.x.n)+'" data-i="'+i+'">בחר</button></div></div>';
          return h2;
        };
        h+=opt(sub&&sub.simple,"עם ציוד פשוט","a1");
        h+=opt(sub&&sub.none,"בלי ציוד בכלל","a2");
        if(swapped) h+='<div class="btnrow"><button class="btn sec" data-unpick="'+i+'">חזרה לתרגיל המקורי</button></div>';
      }
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';

  h+='<div class="card"><h2>עריכה</h2>';
  h+='<form id="pEdit"><div class="fields">'+
     '<div class="f wide"><label>שם התוכנית</label><input type="text" name="title" value="'+esc(p.title||"")+'"></div>'+
     '<div class="f wide"><label>התרגילים</label><textarea name="body">'+esc(p.body||"")+'</textarea></div></div>'+
     '<div class="btnrow"><button class="btn" type="submit">שמור שינויים</button>'+
     '<button class="btn danger" type="button" data-delp="'+p.id+'">מחק תוכנית</button></div></form>';
  h+='<p class="tiny" style="margin-top:10px">קישורי ההדגמה פותחים חיפוש ביוטיוב לפי שם התרגיל באנגלית — '+
     'לא סרטון שנבחר מראש, כדי שלא תגיע לסרטון שגוי.</p>';
  h+='</div>';
  return h;
}

/* ============================================================================
   מחולל תוכניות אימון
   ----------------------------------------------------------------------------
   ארבע שאלות — מטרה, ותק, כמה אימונים בשבוע, ואיפה מתאמנים — ומהן נגזרת
   תוכנית. מה שקובע את המבנה הוא הראיות, לא טעם:

   **נפח** — Schoenfeld, Ogborn & Krieger 2017 (Journal of Sports Sciences),
   מטה־אנליזה של 15 מחקרים: יחס מנה־תגובה מדורג, בתשואה פוחתת. הטווח שרוב
   הראיות תומכות בו הוא 10–20 סטים לקבוצת שריר בשבוע. **המספר המדויק פחות
   מבוסס מהכיוון** — ולכן הנפח כאן עולה עם הוותק ולא נקבע כמספר קסם.

   **תדירות** — בנפח שבועי זהה, פיצול לשתי פעמים בשבוע לקבוצת שריר עדיף מעט
   על פעם אחת. מעבר לשתיים היתרון לא ברור. לכן **כל פיצול כאן נותן לכל
   קבוצת שריר לפחות פעמיים בשבוע** — זה מה שקובע איזה פיצול מתאים לכמה ימים,
   ולא נוחות.

   **קרבה לכשל** — Refalo ואחרים 2023 (Sports Medicine): היתרון של אימון עד
   כשל מוחלט זניח. לכן היעד הוא 1–3 חזרות במאגר, והוא מוקל למתחילים.

   **בגירעון לא מורידים נפח.** מה ששומר על מסת השריר בדיאטה הוא האימון,
   לא התזונה. זו נקודה שנוגדת אינטואיציה ולכן היא מסומנת במפורש בתוכנית.
   ============================================================================ */

/* ארבע רמות. הסיווג נשען על מה שהמתאמן מסוגל לעשות ועל קצב ההתקדמות
   שהוא עדיין מקבל — לא רק על ותק, כי ותק לבד לא אומר כלום. */
const LEVELS=[
 {id:"new", lab:"מתחיל", when:"פחות מחצי שנה, או חוזר אחרי הפסקה ארוכה",
  sets:[8,10], perEx:3, rir:[3,4], relSets:3,
  why:"נפח נמוך יחסית בכוונה. בשלב הזה הגירוי הקטן ביותר עדיין עובד, והבלם האמיתי הוא היכולת להתאושש וללמוד את התנועה — לא כמות הסטים.",
  prog:"להוסיף חזרה או שתיים כמעט בכל אימון. כשהגעת לקצה טווח החזרות — להוסיף משקל או לעבור לווריאציה קשה יותר."},
 {id:"early", lab:"מתחיל מתקדם", when:"חצי שנה עד שנה וחצי, התנועות כבר יושבות",
  sets:[10,14], perEx:3, rir:[2,3], relSets:3,
  why:"ההתקדמות כבר לא יומית אלא שבועית, ולכן הנפח עולה. עדיין רחוק מהתקרה.",
  prog:"פרוגרסיה כפולה: מוסיפים חזרות עד קצה הטווח, ואז מוסיפים משקל וחוזרים לתחתית הטווח."},
 {id:"mid", lab:"מתקדם", when:"שנה וחצי עד שלוש שנים",
  sets:[14,18], perEx:4, rir:[1,3], relSets:4,
  why:"כאן כבר צריך נפח אמיתי כדי להמשיך לגדול, וזה גם השלב שבו ניהול העייפות מתחיל להיות חלק מהתוכנית.",
  prog:"פרוגרסיה כפולה, ושבוע הקלה (deload) כשהביצועים יורדים על פני כמה אימונים — לא לפי לוח זמנים."},
 {id:"vet", lab:"ותיק", when:"שלוש שנים ומעלה של אימון עקבי",
  sets:[16,20], perEx:4, rir:[1,3], relSets:4,
  why:"בקצה העליון של הטווח שהראיות תומכות בו. מעבר לזה התוספת קטנה ומחיר ההתאוששות עולה — ולכן התוכנית לא הולכת גבוה יותר.",
  prog:"פרוגרסיה כפולה, יותר גיוון בווריאציות, ו־deload יזום כשהעייפות מצטברת."}
];

/* סביבות אימון. הערך `eq` מסנן את מסד התרגילים. */
const ENVS=[
 /* `prefer` — הציוד שמקבל עדיפות בבחירה. בלי זה, בחדר כושר נבחרו דווקא
    תרגילי הסטריט־וורקאאוט, כי הם הקשים ביותר במסד. מי שהולך לחדר כושר
    רוצה מוט ומשקולות, ותרגיל משקל גוף נכנס רק כשאין חלופה. */
 {id:"gym",  lab:"חדר כושר",            eq:["gym","simple","none"], prefer:"gym", note:"מוט, משקולות, כבלים ומכונות."},
 {id:"kit",  lab:"משקל גוף עם ציוד",     eq:["simple","none"],       note:"מוט מתח, טבעות, מקבילונים או גומיות."},
 {id:"bw",  lab:"משקל גוף בלי ציוד",     eq:["none"],                note:"רצפה וקיר בלבד."},
 {id:"home", lab:"בבית",                eq:["none"],                note:"רצפה, קיר, ריהוט, מגבת ותיק. כמו בלי ציוד, עם מה שיש בסלון."}
];

/* תבניות אימון. כל תבנית היא רשימת תבניות־תנועה למילוי, לפי סדר:
   מורכב כבד קודם, בידוד בסוף. */
/* תחביר `תבנית>שריר` דורס את שריר היעד של התבנית לאותו מקום באימון.
   הוא נחוץ בדיוק במקום אחד: המקום השלישי ביום המשיכה. בלי הדריסה נבחר
   שם עוד תרגיל שהגב הרחב ראשוני בו, והגב הגיע ל־33 סטים בשבוע. */
const SESS={
  full:{lab:"אימון מלא", pats:["סקוואט","דחיפה אופקית","משיכה אנכית","מפרק ירך","משיכה אופקית","דחיפה אנכית","ליבה"]},
  up:  {lab:"פלג גוף עליון", pats:["דחיפה אופקית","משיכה אנכית","דחיפה אופקית","משיכה אופקית","דחיפה אנכית","פשיטת מרפק","כפיפת מרפק","ליבה"]},
  low: {lab:"פלג גוף תחתון", pats:["סקוואט","מפרק ירך","סקוואט","שוק","ליבה"]},
  push:{lab:"דחיפה", pats:["דחיפה אופקית","דחיפה אנכית","דחיפה אופקית","פשיטת מרפק","ליבה"]},
  pull:{lab:"משיכה", pats:["משיכה אנכית","משיכה אופקית","משיכה אופקית>כתף","כפיפת מרפק","ליבה"]},
  legs:{lab:"רגליים", pats:["סקוואט","מפרק ירך","סקוואט","שוק","ליבה"]}
};

/* בחירת הפיצול לפי מספר האימונים. התנאי היחיד: כל קבוצת שריר לפחות
   פעמיים בשבוע. זה מה שפוסל פיצול "יום לכל שריר" בתדירות נמוכה. */
function pickSplit(days,level){
  const adv=(level==="mid"||level==="vet");
  if(days<=2) return {keys:["full","full"], name:"אימון מלא", why:"בשני אימונים בשבוע, פיצול כלשהו היה נותן לכל שריר פעם אחת בלבד. אימון מלא נותן פעמיים."};
  if(days===3) return adv
    ? {keys:["up","low","full"], name:"עליון · תחתון · מלא", why:"בשלושה אימונים אפשר כבר לפצל, והאימון המלא השלישי סוגר את התדירות לפעמיים לכל קבוצה."}
    : {keys:["full","full","full"], name:"אימון מלא ×3", why:"בשלב הזה תדירות גבוהה לכל תנועה שווה יותר מפיצול — כל אימון הוא עוד הזדמנות לתרגל את התנועה."};
  if(days===4) return {keys:["up","low","up","low"], name:"A · B (עליון · תחתון)", why:"ארבעה אימונים מתחלקים בדיוק לשניים, וכל קבוצת שריר מקבלת פעמיים בשבוע."};
  if(days===5) return {keys:["up","low","push","pull","legs"], name:"A · B · C משולב", why:"חמישה אימונים לא מתחלקים יפה, ולכן שני הראשונים עליון·תחתון והשאר דחיפה·משיכה·רגליים. כל קבוצה יוצאת פעמיים."};
  return {keys:["push","pull","legs","push","pull","legs"], name:"A · B · C (דחיפה · משיכה · רגליים)", why:"שישה אימונים = שתי סבבים מלאים. הפיצול הקלאסי, וכאן הוא באמת מתאים."};
}

/* לכל תבנית תנועה יש שריר שהיא אמורה לאמן. בלי זה הבחירה מתבצעת לפי
   קושי בלבד — ואז "פסאודו פלאנץ'" (קושי 4, שריר ראשי כתף) תופס את מקום
   תרגיל החזה, והחזה יורד לחצי קרדיט. הקושי הוא שובר שוויון, לא הקריטריון. */
const PAT_MAIN={
 "דחיפה אופקית":["חזה"],
 "דחיפה אנכית":["כתף"],
 "משיכה אנכית":["גב רחב"],
 "משיכה אופקית":["גב רחב","רומבואידים"],
 "סקוואט":["ארבע ראשי"],
 /* רק המסטרינג, בכוונה. הישבן כבר מקבל עבודה כבדה מהסקוואט, וכשהתרתי
    גם ישבן — המנוע בחר היפ תראסט (ישבן ראשוני) והמסטרינג נשאר בלי כלום. */
 "מפרק ירך":["המסטרינג"],
 "שוק":["תאומים","סולית"],
 "כפיפת מרפק":["בייספס","ברכיאליס"],
 "פשיטת מרפק":["טרייספס"],
 "ליבה":["בטן"]
};

/* בחירת תרגיל: מסננים לפי ציוד, מעדיפים תרגיל שבאמת מאמן את השריר של
   התבנית, ורק אז מתאימים את הקושי לרמה. */

/* ---- סביבות מרובות ----
   אפשר לבחור גם חדר כושר וגם משקל גוף. `env` יכול להיות מזהה יחיד
   או מערך; שלוש העזר האלה מטפלות בשניהם, כדי ששאר הקוד לא ידע מזה. */
function envList(env){
  const ids=Array.isArray(env)?env:[env];
  const out=ids.map(id=>ENVS.find(e=>e.id===id)).filter(Boolean);
  return out.length?out:[ENVS[0]];
}
function envAllowed(env){
  const s={};
  envList(env).forEach(e=>e.eq.forEach(q=>{ s[q]=1 }));
  return Object.keys(s);
}
function envPrefer(env){
  const p=envList(env).map(e=>e.prefer).filter(Boolean);
  return p.length?p[0]:null;
}
function envMerge(env){
  const l=envList(env);
  return {
    id:l.map(e=>e.id).join("+"),
    lab:l.map(e=>e.lab).join(" + "),
    eq:envAllowed(env),
    prefer:envPrefer(env),
    note:l.map(e=>e.note).join(" ")
  };
}
function pickEx(rawPat,env,level,used,slot){
  const bits=String(rawPat).split(">");
  const pat=bits[0];
  const override=bits[1]?[bits[1]]:null;
  const allowed=envAllowed(env);
  const lvIdx=LEVELS.findIndex(l=>l.id===level);
  const maxDiff=[2,3,4,5][lvIdx]+(slot>1?1:0);
  const core=/^ליבה/;
  let pool=EX_DB.filter(x=>{
    if(allowed.indexOf(x.eq)<0) return false;
    /* מיומנויות ראווה (דגל אנושי, בק לבר, מנא, אייאון קרוס, מתח ביד אחת)
       שייכות למסלול הלמידה ולא לתוכנית כוח. בלי הסינון הזה "דגל אנושי
       סטראדל" נבחר כתרגיל הליבה בכל אימון, והגב הרחב הגיע ל-34 סטים. */
    if(x.sk) return false;
    if(core.test(pat)) return core.test(x.pat);
    return x.pat===pat;
  });
  if(!pool.length) return null;
  /* ראשית מה שבטווח הקושי; אם אין — הקל ביותר שיש */
  let fit=pool.filter(x=>(x.diff||1)<=maxDiff);
  if(!fit.length) fit=pool.slice().sort((a,b)=>(a.diff||1)-(b.diff||1)).slice(0,3);
  /* אם כל המתאימים כבר נבחרו באימון הזה — מוותרים על המקום.
     חזרה על אותו תרגיל פעמיים באותו אימון היא לא תוכנית, והיא גם ניפחה
     את חשבון הנפח וכיבתה את אזהרת הגב בדיוק במקום שבו היא הכי נחוצה. */
  const from=fit.filter(x=>used.indexOf(x.n)<0);
  if(!from.length) return null;

  /* ניקוד: קודם כול — האם התרגיל באמת מאמן את השריר של התבנית.
     2 = שריר ראשוני, 1 = משני, 0 = לא נוגע בו.
     רק בתוך אותה רמה מכריע הקושי, והקרוב ביותר לתקרה מנצח. */
  const main=override||PAT_MAIN[core.test(pat)?"ליבה":pat]||[];
  const hits=(list)=>(list||[]).some(m=>main.some(k=>fam(m)===fam(k)));
  const score=x=>hits(x.p)?2:hits(x.s)?1:0;
  const prefer=envPrefer(env);
  from.sort((a,b)=>{
    const d=score(b)-score(a);
    if(d) return d;
    if(prefer){                          /* בחדר כושר — ציוד לפני קושי */
      const pa=(a.eq===prefer?1:0), pb=(b.eq===prefer?1:0);
      if(pb-pa) return pb-pa;
    }
    return Math.abs((a.diff||1)-maxDiff)-Math.abs((b.diff||1)-maxDiff);
  });
  return from[0];
}

/* מרשם סטים/חזרות/מנוחה לפי תפקיד התרגיל ברמה */
function prescribe(ex,lvl,slot,isCore){
  const compound=(ex.p||[]).length>1||/סקוואט|מפרק ירך|דחיפה|משיכה/.test(ex.pat||"");
  const isStatic=/סטטי/.test(ex.pat||"");
  /* שני התרגילים הראשונים באימון הם המורכבים הכבדים, והם מקבלים סט נוסף.
     בלי זה, פיצול "אימון מלא" בשלושה ימים נתן לחזה 9 סטים בלבד — מתחת
     לטווח, רק מפני שיש בו תרגיל דחיפה אחד לאימון. */
  const sets=(slot<2&&lvl.id!=="new")?lvl.perEx+1:lvl.perEx;
  let reps,rest;
  if(isStatic){ reps="10–30 שניות"; rest="דקה"; }
  else if(isCore){ reps="12–20 חזרות"; rest="45–60 שניות"; }
  else if(compound){ reps="6–10 חזרות"; rest="2–3 דקות"; }
  else { reps="10–15 חזרות"; rest="60–90 שניות"; }
  return {sets:Math.min(sets,5),reps,rest};
}

/* בניית התוכנית המלאה. מחזיר גם את חשבון הנפח, כדי שאפשר יהיה להראות
   אותו ולא רק להבטיח אותו. */
function buildProgram(opt){
  const lvl=LEVELS.find(l=>l.id===opt.level)||LEVELS[0];
  const goal=GOALS.find(g=>g.id===opt.goal)||GOALS[0];
  const envO=envMerge(opt.env);
  const days=Math.max(2,Math.min(6,+opt.days||3));
  const split=pickSplit(days,lvl.id);
  const seen={}, sessions=[], unfilled={};

  split.keys.forEach((k,i)=>{
    const t=SESS[k], used=[], lines=[], items=[];
    let n=0;
    t.pats.forEach(rawPat=>{
      const pat=String(rawPat).split(">")[0];
      const isCore=/^ליבה/.test(pat);
      const ex=pickEx(rawPat,envO.id,lvl.id,used,n);
      /* תבנית שאין לה תרגיל בסביבה הזו — נרשמת ומוצגת. שתיקה כאן
         הייתה מייצרת תוכנית לא מאוזנת בלי שאיש יידע למה. */
      if(!ex){ unfilled[pat]=(unfilled[pat]||0)+1; return }
      used.push(ex.n);
      const pr=prescribe(ex,lvl,n,isCore);
      lines.push(ex.n+" | "+pr.sets+" סטים | "+pr.reps+" | מנוחה "+pr.rest);
      items.push({ex:ex,pr:pr});
      /* ---- ספירת נפח ----
         שני תיקונים שנדרשו אחרי שראיתי את המספרים בפועל:

         א. **יד בתוך תרגיל מורכב נספרת כחצי.** כמעט כל תרגיל דחיפה מסומן
            במסד עם טרייספס כשריר ראשוני, ולכן ספירה מלאה נתנה 31 סטים
            לטרייספס בתוכנית של חמישה ימים. עבודה עקיפה על היד אמיתית,
            אבל היא לא שווה סט ישיר.

         ב. **תרגיל ליבה לא תורם נפח משני.** "דרגון פלאג" מסומן עם גב רחב
            כמשני, וארבעה אימונים כאלה הוסיפו 8 סטים מדומים לגב. */
      const ARM=["טרייספס","בייספס","ברכיאליס","אמות"];
      const multi=(ex.p||[]).length>1;
      (ex.p||[]).forEach(m=>{
        const f=fam(m);
        const w=(ARM.indexOf(f)>-1&&multi)?0.5:1;
        seen[f]=(seen[f]||0)+pr.sets*w;
      });
      if(!isCore) (ex.s||[]).forEach(m=>{ const f=fam(m); seen[f]=(seen[f]||0)+pr.sets*0.5 });
      n++;
    });
    /* כל אימון מקבל אות רצה — A, B, C — כמו שמאמן היה כותב.
       האות היא לפי מיקום האימון בשבוע, והכותרת מוסיפה מה עושים בו. */
    const letter=String.fromCharCode(65+i);
    const title="אימון "+letter;
    const sub=t.lab;
    sessions.push({key:k,letter:letter,title:title,sub:sub,
                   body:lines.join("\n"),items:items});
  });

  const vol=Object.entries(seen).map(([m,v])=>[m,Math.round(v*10)/10])
              .sort((a,b)=>b[1]-a[1]);
  const low=vol.filter(v=>v[1]<10).map(v=>v[0]);
  const high=vol.filter(v=>v[1]>20).map(v=>v[0]);
  const back=(vol.find(v=>v[0]==="גב רחב")||["גב רחב",0])[1];
  const chest=(vol.find(v=>v[0]==="חזה")||["חזה",0])[1];
  /* אזהרת המשיכה: בלי משהו לתלות עליו אין דרך אמיתית לאמן גב, והתוכנית
     תצא דוחפת הרבה יותר ממה שהיא מושכת. זו מגבלה של הסביבה ולא של המנוע,
     ולכן היא נאמרת ולא מוסתרת. */
  const pullWarn=(back<10||back<chest*0.7)
    ? {back,chest,noBar:envO.eq.indexOf("simple")<0&&envO.eq.indexOf("gym")<0}
    : null;
  return {lvl,goal,env:envO,days,split,sessions,vol,low,high,unfilled,pullWarn};
}

/* המלצה לפי מטרה — לא דעה, גזירה מהניקוד למעלה */
function cardioPlan(goalId,days){
  const g=goalId||"mass";
  if(g==="cut")  return {n:3, pick:["walk","bike","row"], txt:"בחיטוב האירובי עוזר — הוא מרחיב את הפער בלי לקצץ עוד אוכל. שלוש פעמים בשבוע, ורצוי הליכה או אופניים כדי לא לגנוב התאוששות מהאימונים."};
  if(g==="mass") return {n:2, pick:["walk","bike"],       txt:"בעלייה במסה האירובי הוא לבריאות הלב, לא לשריפה. פעמיים בשבוע, אופניים או הליכה — הצורות שבמחקר כמעט לא הפריעו."};
  if(g==="fit")  return {n:3, pick:["run","bike","hiit"], txt:"אם הכושר הוא המטרה, כאן דווקא כדאי לרוץ. שלוש פעמים בשבוע, ואחת מהן אינטרוולים."};
  return {n:2, pick:["walk","bike","row"], txt:"פעמיים בשבוע זה מספיק כדי לשמור על הלב בלי להפריע לאימונים."};
}
function cardioCard(){
  const b=ui.build||{};
  const goal=b.goal||(me&&me.goal)||"mass";

       '<span class="cdow">'+esc(c.what)+'</span>'+

       '<span class="cdoc">✕ '+esc(c.con)+'</span>'+
       '</button>';
  });
  h+='</div>';
  h+='<div class="bq"><label class="bql">מתי</label><div class="lvls" id="bWhen">';
  CARDIO_WHEN.forEach(w=>{
    h+='<button class="lvl'+(when===w.id?" on":"")+'" data-cwhen="'+w.id+'">'+
       '<b>'+esc(w.lab)+'</b><span>'+esc(w.why)+'</span></button>';
  });
  h+='</div></div>';
  h+='<p class="tiny note">מה שבאמת יודעים: סקירה של 43 מחקרים (Schumann ואחרים, 2022) מצאה שאירובי במקביל לכוח <b>לא</b> פוגע בגדילת השריר ולא בכוח המרבי — רק בכוח המתפרץ, ובעיקר כששניהם באותו אימון. מה שכן הראה הבדל (Wilson ואחרים, 2012) זה שריצה הפריעה יותר מאופניים, וככל שהאירובי ארוך ותכוף יותר כך ההפרעה גדלה. לבריאות עצמה, ארגון הבריאות העולמי ממליץ על 150–300 דקות מתון בשבוע או 75–150 דקות עצים.</p>';
  h+='</div>';
  return h;
}
/* ---- כרטיס הבנייה: ארבע שאלות, תצוגה מקדימה, ואז שמירה ---- */
function buildCard(){
  const b=ui.build||(ui.build={});
  const goal=b.goal||(me&&me.goal)||"mass";
  const level=b.level||null;
  const days=b.days||null;
  const env=b.env||null;
  const pv=window.__prog;

  let h='<div class="card"><h2>בנה לי תוכנית</h2>';
  h+='<p class="tiny" style="margin-bottom:14px">ארבע שאלות, ומהן נגזרת התוכנית — כמה אימונים, איך לפצל אותם, ואילו תרגילים. '+
     'המבנה נקבע לפי הראיות ולא לפי טעם, וכל החלטה מוסברת בסוף.</p>';

  /* 1 — מטרה */
  h+='<div class="bq"><label class="bql">1 · מה המטרה</label><div class="seg wrapseg" id="bGoal">'+
     GOALS.map(g=>'<button data-bgoal="'+g.id+'" aria-selected="'+(goal===g.id)+'">'+esc(g.lab)+'</button>').join("")+
     '</div></div>';

  /* 2 — ותק */
  h+='<div class="bq"><label class="bql">2 · כמה זמן אתה מתאמן</label><div class="lvls" id="bLevel">';
  LEVELS.forEach(l=>{
    h+='<button class="lvl'+(level===l.id?" on":"")+'" data-blevel="'+l.id+'">'+
       '<b>'+esc(l.lab)+'</b><span>'+esc(l.when)+'</span></button>';
  });
  h+='</div></div>';

  /* 3 — תדירות */
  h+='<div class="bq"><label class="bql">3 · כמה אימונים בשבוע</label><div class="seg" id="bDays">'+
     [2,3,4,5,6].map(d=>'<button data-bdays="'+d+'" aria-selected="'+(days===d)+'">'+d+'</button>').join("")+
     '</div>';
  if(days) h+='<p class="tiny" style="margin-top:7px">'+esc(pickSplit(days,level||"new").name)+'</p>';
  h+='</div>';

  /* 4 — סביבה. בחירה מרובה: אפשר גם חדר כושר וגם משקל גוף. */
  const envSel=Array.isArray(env)?env:(env?[env]:[]);
  h+='<div class="bq"><label class="bql">4 · איפה אתה מתאמן <span class="bqhint">אפשר לבחור יותר מאחד</span></label><div class="lvls" id="bEnv">';
  ENVS.forEach(e=>{
    h+='<button class="lvl'+(envSel.indexOf(e.id)>-1?" on":"")+'" data-benv="'+e.id+'">'+
       '<b>'+esc(e.lab)+'</b><span>'+esc(e.note)+'</span></button>';
  });
  h+='</div>';
  if(envSel.length>1)
    h+='<p class="tiny" style="margin-top:7px">מאוחד: '+esc(envMerge(envSel).lab)+
       '. המנוע יבחר מכל מה שזמין לך, ויעדיף ציוד חדר כושר כשהוא נבחר.</p>';
  h+='</div>';

  const ready=goal&&level&&days&&envSel.length;
  h+='<div class="btnrow" style="margin-top:4px">'+
     '<button class="btn" id="bGo"'+(ready?"":" disabled")+'>בנה תוכנית</button>'+
     (pv?'<button class="btn sec" id="bClear">נקה</button>':'')+'</div>';
  if(!ready) h+='<p class="tiny" style="margin-top:8px">ענה על ארבע השאלות כדי להמשיך.</p>';

  /* ---- תצוגה מקדימה ---- */
  if(pv){
    h+='<div class="sep2"></div>';
    h+='<div class="headline"><span class="badge b-ok">'+esc(pv.split.name)+'</span>'+
       '<p style="margin:9px 0 0">'+esc(pv.days)+' אימונים בשבוע · '+esc(pv.lvl.lab)+' · '+esc(pv.env.lab)+
       ' · מטרה: '+esc(pv.goal.lab)+'</p>'+
       '<p class="tiny" style="margin:7px 0 0">'+esc(pv.split.why)+'</p></div>';

    pv.sessions.forEach((s,i)=>{
      h+='<div class="sess">';
      h+='<div class="sesshead"><span class="sessltr">'+esc(s.letter)+'</span>'+
         '<div class="sesst"><b>'+esc(s.title)+'</b><span>'+esc(s.sub)+'</span></div>'+
         '<span class="badge b-mute">'+s.items.length+' תרגילים</span></div>';
      s.items.forEach((it,j)=>{
        h+='<div class="brow"><span class="bnum">'+(j+1)+'</span>'+
           '<span class="bn">'+esc(it.ex.n)+'</span>'+
           '<span class="bs num">'+it.pr.sets+'×'+esc(it.pr.reps.replace(" חזרות","").replace(" שניות","ש׳"))+'</span></div>';
      });
      h+='<p class="tiny sessrest">מנוחה: '+esc(s.items[0]?s.items[0].pr.rest:"")+
         ' בין הסטים בתרגילים המורכבים, פחות בבידוד.</p>';
      h+='</div>';
    });

    /* האירובי, אם נבחר — נכנס לתוכנית ככל אימון אחר ולא כהערת שוליים */
    const cSel=CARDIO.filter(c=>c.id===(b.cardio||""))[0];
    if(cSel){
      const cRec=cardioPlan(goal,pv.days);
      const cWhen=CARDIO_WHEN.filter(w=>w.id===(b.cwhen||"after"))[0]||CARDIO_WHEN[0];
      h+='<div class="sess"><div class="sesshead"><span class="sessltr cdoltr">♥</span>'+
         '<div class="sesst"><b>אירובי</b><span>'+esc(cSel.lab)+' · '+cRec.n+' פעמים בשבוע</span></div></div>'+
         '<div class="brow"><span class="bn">'+esc(cSel.what)+'</span></div>'+
         '<p class="tiny sessrest">מתי: '+esc(cWhen.lab)+'. '+esc(cWhen.why)+'</p></div>';
    }

    /* חשבון הנפח — מראים אותו, לא מבטיחים אותו */
    h+='<div class="sep2"></div><h3 class="h3">נפח שבועי לפי שריר</h3>';
    h+='<p class="tiny" style="margin-bottom:10px">הטווח שרוב הראיות תומכות בו: <b>10–20 סטים לקבוצת שריר בשבוע</b> '+
       '(Schoenfeld ואחרים 2017). סט של שריר משני נספר כחצי.</p><div class="wklist">';
    pv.vol.slice(0,10).forEach(([m,v])=>{
      const st=v<10?"neg":v>20?"neg":"pos";
      const lab=v<10?"מתחת לטווח":v>20?"מעל הטווח":"בטווח";
      h+='<div class="wkrow"><span class="wkdt">'+esc(m)+'</span>'+
         '<span class="wkav num">'+v+'</span>'+
         '<span class="wkd '+st+'">'+lab+'</span></div>';
    });
    h+='</div>';
    if(pv.low.length) h+='<p class="tiny" style="margin-top:9px">'+esc(pv.low.join(", "))+
       ' יוצאים מתחת ל־10 סטים. זה תקין כשהם שרירים קטנים שמקבלים עבודה עקיפה — אם אתה רוצה להדגיש אותם, הוסף תרגיל.</p>';
    if(pv.high.length) h+='<p class="tiny" style="margin-top:9px">'+esc(pv.high.join(", "))+
       ' יוצאים מעל 20 סטים. מעבר לטווח הזה התוספת קטנה ומחיר ההתאוששות עולה.</p>';

    /* אזהרת המשיכה — הדבר החשוב ביותר שהמסך הזה יכול לומר בסביבה בלי מוט */
    if(pv.pullWarn){
      h+='<div class="pcard" style="margin-top:14px"><div class="ptop">'+
         '<span class="pnm">הגב מקבל פחות מדי</span>'+
         '<span class="badge b-warn">'+pv.pullWarn.back+' מול '+pv.pullWarn.chest+' סטים</span></div>';
      h+='<p class="pline">התוכנית דוחפת יותר ממה שהיא מושכת.</p>';
      if(pv.pullWarn.noBar)
        h+='<p class="tiny"><b>זו לא בעיה של התוכנית אלא של הציוד.</b> בלי משהו לתלות עליו '+
           'אין דרך אמיתית לאמן גב — אפשר לדחוף על הרצפה, אי אפשר למשוך ממנה. '+
           'שולחן יציב הוא המינימום; <b>מוט מתח פשוט פותר את זה לגמרי.</b> '+
           'אם אתה יכול להשיג אחד, שנה את התשובה ל״משקל גוף עם ציוד״ ותראה את ההבדל.</p>';
      else
        h+='<p class="tiny">שווה להוסיף תרגיל משיכה נוסף. חוסר איזון בין דחיפה למשיכה '+
           'הוא אחת הסיבות השכיחות לכתפיים כואבות.</p>';
      h+='</div>';
    }

    const uf=Object.keys(pv.unfilled||{});
    if(uf.length)
      h+='<p class="tiny" style="margin-top:9px"><b>לא נמצא תרגיל ל:</b> '+esc(uf.join(", "))+
         ' בסביבה שבחרת. המקומות האלה פשוט נשמטו מהאימון.</p>';

    /* הסבר ההחלטות */
    h+='<div class="sep2"></div><h3 class="h3">למה זה נראה ככה</h3>';
    h+='<p class="tiny"><b>הנפח:</b> '+esc(pv.lvl.why)+'</p>';
    h+='<p class="tiny"><b>קרבה לכשל:</b> לעצור '+pv.lvl.rir[0]+'–'+pv.lvl.rir[1]+
       ' חזרות לפני כשל. היתרון של אימון עד כשל מוחלט נמצא זניח (Refalo ואחרים 2023), '+
       'והמחיר בהתאוששות אמיתי.</p>';
    h+='<p class="tiny"><b>איך מתקדמים:</b> '+esc(pv.lvl.prog)+'</p>';
    if(pv.goal.dir==="down")
      h+='<p class="tiny"><b>אתה בגירעון — ואל תוריד נפח.</b> מה ששומר על מסת השריר בדיאטה הוא האימון, לא התזונה. '+
         'זה נוגד אינטואיציה, ולכן התוכנית לא הופחתה בגלל המטרה.</p>';
    if(pv.goal.dir==="up")
      h+='<p class="tiny"><b>אתה בעודף.</b> זה השלב שבו נפח האימון באמת משתלם — יש ממה לבנות.</p>';

    h+='<div class="btnrow" style="margin-top:14px"><button class="btn" id="bSave">שמור '+
       pv.sessions.length+' אימונים כתוכניות</button></div>';
    h+='<p class="tiny" style="margin-top:8px">ייווצרו '+pv.sessions.length+' תוכניות נפרדות. '+
       'אחר כך אפשר ללחוץ על כל תרגיל ולקבל חלופות — בדיוק כמו בתוכניות שהעלית.</p>';
  }

  h+='</div>';
  return h;
}

/* הסולם: אם יש משפחה במסד — נגזר ממנה לפי דרגת קושי. אחרת רשימה מפורשת,
   וכל שם חייב להימצא במסד — אחרת השלב לא יוצג. */
function skillLadder(s){
  const src=s.fam
    ? EX_DB.filter(x=>x.fam===s.fam)
    : (s.steps||[]).map(n=>matchEx(n)).filter(Boolean);
  /* ממוין תמיד לפי דרגת קושי — גם ברשימה מפורשת. המסך מבטיח "מהקל לקשה",
     ובכמה סולמות הסדר שכתבתי ביד לא תאם את הדרגות שבמסד. מיון יציב:
     בשוויון נשמר הסדר המקורי. */
  return src.map((x,i)=>[x,i])
            .sort((a,b)=>((a[0].diff||1)-(b[0].diff||1))||(a[1]-b[1]))
            .map(p=>p[0]);
}
function skillMuscles(s){
  const c={};
  skillLadder(s).forEach(x=>{
    (x.p||[]).forEach(m=>{ const f=fam(m); c[f]=(c[f]||0)+2 });
    (x.s||[]).forEach(m=>{ const f=fam(m); c[f]=(c[f]||0)+1 });
  });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

/* ---- מנוע התפריט ---- */
let FOOD_IDX=null;
function foodBy(n){
  if(!FOOD_IDX){ FOOD_IDX={}; FOOD_ALL.forEach(x=>{ const k=fnorm(x.n); if(!(k in FOOD_IDX)) FOOD_IDX[k]=x }) }
  const k=fnorm(n); return Object.prototype.hasOwnProperty.call(FOOD_IDX,k)?FOOD_IDX[k]:null;
}
/* פירוק המלל החופשי: פסיקים, "ו", נקודות ושורות. מילה בת אות אחת נזרקת —
   אחרת "ו" הייתה פוסלת חצי מהמסד. */
function menuWords(txt){
  return String(txt||"").split(/[,\n;.״"'\/|]+|\s+ו\s+|\s{2,}/)
    .map(s=>s.trim()).filter(s=>s.length>1);
}
function menuBlocked(name,dislike){
  const w=menuWords(dislike); if(!w.length) return false;
  const n=fnorm(name);
  return w.some(x=>{ const q=fnorm(x); return q.length>1&&n.indexOf(q)>-1 });
}
/* ערבוב יציב: אותה קלט תמיד מחזירה אותו סדר, אחרת התפריט היה משתנה
   בכל רענון מסך והמשתמש לא היה יכול לחזור למה שראה. */
function menuSeed(s){ let h=2166136261; const t=String(s);
  for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619) } return h>>>0 }
function menuShuffle(arr,seed){
  const a=arr.slice(); let s=menuSeed(seed)||1;
  for(let i=a.length-1;i>0;i--){ s=(s*1664525+1013904223)>>>0;
    const j=s%(i+1); const t=a[i]; a[i]=a[j]; a[j]=t }
  return a;
}
/* מאכל לתפקיד: קודם המועדף של השלד, ואם הוא נפסל — הבא בתור מהמאגר */
function menuPick(role,pref,dislike,like,seed,used){
  const pool=(MENU_R[role]||[]).filter(n=>foodBy(n)&&!menuBlocked(n,dislike));
  if(!pool.length) return null;
  const liked=menuWords(like).map(fnorm).filter(x=>x.length>1);
  const score=n=>{ const f=fnorm(n); return liked.some(q=>f.indexOf(q)>-1)?1:0 };
  let order=menuShuffle(pool,role+"|"+seed);
  order.sort((a,b)=>score(b)-score(a));
  if(pref&&pool.indexOf(pref)>-1&&!score(order[0])) order=[pref].concat(order.filter(n=>n!==pref));
  const fresh=order.filter(n=>(used||[]).indexOf(n)<0);
  return (fresh.length?fresh:order)[0];
}
function menuMacros(parts){
  let k=0,p=0,c=0,f=0;
  parts.forEach(it=>{ const r=it.g/100;
    k+=it.food.kcal*r; p+=(it.food.p||0)*r; c+=(it.food.c||0)*r; f+=(it.food.f||0)*r });
  return {kcal:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f)};
}
function menuRound(g){ return g>=100?Math.round(g/10)*10:(g>=30?Math.round(g/5)*5:Math.max(5,Math.round(g))) }
/* בונה ארוחה אחת מתוך שלד, ומכייל אותה ליעד קלוריות וחלבון של אותה ארוחה.
   הכיול הוא איטרטיבי, ולא מכה אחת: מסתכלים על החלבון של *כל* הארוחה ולא רק
   על מנת החלבון — לחם, יוגורט וגרנולה תורמים גם הם, ובלי זה היעד נשבר בגדול
   (נמדד: 252 גרם חלבון מול יעד של 152). כל מנה נחתכת לתקרה ולרצפה שלה,
   אחרת המחולל היה סוגר קלוריות עם "פיתה 200 גרם". */
function buildMeal(tpl,kcalT,protT,o,seed){
  const used=[],parts=[];
  tpl.parts.forEach((sl,i)=>{
    const n=menuPick(sl.r,sl.p,o.dislike,o.like,seed+"|"+i,used);
    if(!n) return; used.push(n);
    const food=foodBy(n); if(!food) return;
    parts.push({role:sl.r,fix:!!sl.fix,food:food,
                g:menuClamp(sl.r,n,MENU_BASE[sl.r]||100)});
  });
  if(!parts.length) return null;
  const isProt=x=>["prot","protAM","protSnk"].indexOf(x.role)>-1;
  const isFlex=x=>!x.fix&&["carb","carbAM","fruit","fat","dairy","pulse"].indexOf(x.role)>-1;
  const pParts=parts.filter(isProt), fParts=parts.filter(isFlex);
  const scale=(list,s)=>list.forEach(x=>{
    x.g=menuClamp(x.role,x.food.n,menuRound(x.g*Math.max(0.3,Math.min(3,s)))) });

  for(let pass=0;pass<4;pass++){
    /* חלבון — מול החלבון של הארוחה כולה */
    if(pParts.length&&protT>0){
      const all=menuMacros(parts).p, mine=menuMacros(pParts).p;
      if(mine>0) scale(pParts,Math.max(0,protT-(all-mine))/mine);
    }
    /* קלוריות — על מה שגמיש בלבד */
    if(fParts.length&&kcalT>0){
      const all=menuMacros(parts).kcal, mine=menuMacros(fParts).kcal;
      if(mine>0) scale(fParts,Math.max(0,kcalT-(all-mine))/mine);
    }
    /* אם עדיין חסר הרבה — התקרות חוסמות, ואין טעם להגדיל עוד את אותה מנה.
       מה שמאמן עושה בפועל: מוסיף רכיב. טחינה, אגוזים, עוד פרוסה. */
    const now=menuMacros(parts).kcal;
    if(kcalT>0&&now<kcalT*0.92&&pass<3){
      const have=parts.map(x=>x.food.n);
      let added=null;
      /* תוספת אחת מכל תפקיד — שלוש מנות שמן זעירות באותה ארוחה זה לא תפריט */
      [["fat","carbAM","fruit"],["carbAM","fruit","fat"],["fruit","fat","carbAM"]][pass%3].some(r=>{
        if(parts.some(x=>x.extra&&x.role===r)) return false;
        const n=menuPick(r,null,o.dislike,o.like,seed+"|boost"+pass,have);
        if(!n||have.indexOf(n)>-1) return false;
        added={role:r,fix:false,food:foodBy(n),g:menuClamp(r,n,MENU_BASE[r]||100),extra:1};
        return true;
      });
      if(added&&added.food){ parts.push(added); fParts.push(added) }
    }
  }
  const m=menuMacros(parts);
  return {name:tpl.n,parts:parts,kcal:m.kcal,p:m.p,c:m.c,f:m.f};
}
/* חלוקת היום: ארוחה עיקרית שווה 1, ביניים שווה 0.55 ממנה.
   החלבון מתחלק שווה בין הארוחות — פיזור על פני היום, לא הכול בערב. */
function menuSlots(meals,snacks){
  const s=[];
  const M=Math.max(2,Math.min(5,+meals||3)), S=Math.max(0,Math.min(3,+snacks||0));
  for(let i=0;i<M;i++) s.push({kind:i===0?"am":"main", w:1,
    lab:i===0?"בוקר":(i===M-1?"ערב":(M===3?"צהריים":"ארוחה "+(i+1)))});
  for(let i=0;i<S;i++) s.push({kind:"snk", w:0.55, lab:S===1?"ביניים":"ביניים "+(i+1)});
  return s;
}
function buildMenu(o){
  o=o||{};
  const t=nutriTargets();
  const kcal=o.kcal||(t.ready?Math.round((t.kcal[0]+t.kcal[1])/2):2200);
  const prot=o.protein||(t.ready?Math.round((t.protein[0]+t.protein[1])/2):130);
  const slots=menuSlots(o.meals,o.snacks);
  const wSum=slots.reduce((a,x)=>a+x.w,0);
  const seed=(o.seed||0)+"|"+(o.dislike||"")+"|"+(o.like||"");
  const out=slots.map((sl,si)=>{
    const kT=Math.round(kcal*sl.w/wSum), pT=Math.round(prot*sl.w/wSum);
    const tpls=menuShuffle(MEAL_TPL[sl.kind],sl.kind+"|"+seed);
    const opts=[];
    for(let i=0;i<tpls.length&&opts.length<4;i++){
      const m=buildMeal(tpls[i],kT,pT,o,seed+"|"+si+"|"+i);
      if(m) opts.push(m);
    }
    return {lab:sl.lab,kind:sl.kind,kcalT:kT,protT:pT,options:opts};
  });
  return {slots:out,kcal:kcal,protein:prot,ready:t.ready,targets:t};
}
/* סיכום היום לפי מה שנבחר בפועל */
function menuTotals(menu,pick){
  let k=0,p=0,c=0,f=0;
  menu.slots.forEach((s,i)=>{
    const o=s.options[(pick&&pick[i])||0]||s.options[0]; if(!o) return;
    k+=o.kcal; p+=o.p; c+=o.c; f+=o.f;
  });
  return {kcal:k,p:p,c:c,f:f};
}
function nutriTargets(){
  const last=official().slice(-1)[0];
  const w=last?last.weight:null;
  const age=myAge();
  const h=heightCm();
  const sex=(me&&me.sex)||"m";
  const goal=GOALS.find(g=>g.id===((me&&me.goal)||ui.goal||"mass"))||GOALS[0];
  const act=ACTIVITY[(me&&me.act!=null)?me.act:2]||ACTIVITY[2];
  if(!w||!age) return {goal,act,ready:false,missing:!w?"weight":"age"};
  /* Mifflin-St Jeor. הקבוע שונה בין גברים לנשים ב־166 קק"ל —
     חישוב לפי הנוסחה הלא נכונה מטה את היעד היומי בכל יום מחדש. */
  const bmr=10*w+6.25*h-5*age+(sex==="f"?-161:5);
  /* טווח ולא מספר בודד: NEAT — תנועה לא־אימונית — משתנה במאות קק"ל בין ימים */
  const tdeeLo=bmr*act.m*0.95, tdeeHi=bmr*act.m*1.10;
  const kcalLo=Math.round(tdeeLo*(1+goal.adj)/10)*10;
  const kcalHi=Math.round(tdeeHi*(1+goal.adj)/10)*10;
  /* Morton 2018: רוויה סביב 1.6 גר'/ק"ג, רווח בר־סמך עד ~2.2.
     בגירעון הטווח עולה — שם החלבון מגן על המסה הרזה. */
  const pr=goal.prot||[1.6,2.2];
  const pLo=Math.round(w*pr[0]), pHi=Math.round(w*pr[1]);
  const fatMin=Math.round(w*0.6);          /* רצפת שומן לתפקוד הורמונלי */
  return {goal,act,ready:true,w,age,h,sex,bmr:Math.round(bmr),
          tdee:[Math.round(tdeeLo),Math.round(tdeeHi)],
          kcal:[kcalLo,kcalHi],protein:[pLo,pHi],fatMin,
          target:(me&&me.targetWeight)||null};
}

/* ============================================================================
   כתיבה חופשית בעברית — "שתי כפות אורז, פרוסת גבינה צהובה, 200 גרם חזה עוף"
   ----------------------------------------------------------------------------
   שלושה שלבים לכל פריט: כמה (מספר או מילה), באיזו יחידה, ואיזה מאכל.
   משקל היחידה נלקח קודם מהמאכל עצמו — "פרוסה" של גבינה צהובה היא 25 גרם
   ושל לחם 30 — ורק אם אין, מטבלת ברירת מחדל.
   ============================================================================ */
const HE_NUM={"אחד":1,"אחת":1,"שני":2,"שתי":2,"שניים":2,"שתיים":2,"זוג":2,
 "שלוש":3,"שלושה":3,"ארבע":4,"ארבעה":4,"חמש":5,"חמישה":5,"שש":6,"שישה":6,
 "שבע":7,"שבעה":7,"שמונה":8,"תשע":9,"תשעה":9,"עשר":10,"עשרה":10,
 "חצי":0.5,"רבע":0.25,"שליש":0.34};
/* צורות רבים ונטיות → שם היחידה הבסיסי */
const UNIT_ALIAS={"כף":"כף","כפות":"כף","כפית":"כפית","כפיות":"כפית",
 "כוס":"כוס","כוסות":"כוס","כוסית":"כוס","פרוסה":"פרוסה","פרוסות":"פרוסה","פרוסת":"פרוסה",
 "יחידה":"יחידה","יחידות":"יחידה","חתיכה":"יחידה","חתיכות":"יחידה",
 "מנה":"מנה","מנות":"מנה","מנת":"מנה","חופן":"חופן","חופנים":"חופן",
 "כדור":"כדור","כדורים":"כדור","קופסה":"קופסה","קופסת":"קופסה",
 "גביע":"גביע","גביעים":"גביע","בקבוק":"בקבוק","פחית":"פחית","שקית":"שקית",
 "חטיף":"חטיף","ביצה":"ביצה","ביצים":"ביצה","פיתה":"פיתה","לחמנייה":"לחמנייה",
 "סקופ":"סקופ","קובייה":"קובייה","קוביות":"קובייה","משולש":"משולש",
 "כנף":"כנף","כנפיים":"כנף","שוק":"שוק","עוגייה":"עוגייה","עוגיות":"עוגייה"};
const UNIT_G={"כף":15,"כפית":5,"כוס":200,"פרוסה":30,"יחידה":100,"מנה":200,"חופן":30,
 "כדור":60,"קופסה":150,"גביע":150,"בקבוק":330,"פחית":330,"שקית":30,"חטיף":50,
 "ביצה":55,"פיתה":70,"לחמנייה":80,"סקופ":30,"קובייה":10,"משולש":110,
 "כנף":40,"שוק":110,"עוגייה":15};
const GRAM_WORDS=/^(גרם|גר|ג|גרמים)$/;
const KILO_WORDS=/^(קילו|קילוגרם|ק"ג|קג)$/;

/* נרמול לצורך התאמה: אותיות סופיות לצורתן הרגילה ו־"יי" ל־"י",
   כדי ש"שניצלונים" ו"שניצלון" ייראו אותו דבר, וכך גם "עוגיות" ו"עוגייה". */
function fnorm(s){
  return tnorm(s).replace(/ך/g,"כ").replace(/ם/g,"מ").replace(/ן/g,"נ")
                 .replace(/ף/g,"פ").replace(/ץ/g,"צ").replace(/יי/g,"י");
}
/* צורות יחיד אפשריות של מילה ברבים */
function variants(w){
  const v=[w];
  if(/יות$/.test(w)){ v.push(w.slice(0,-3)+"יה", w.slice(0,-3)) }
  if(/ות$/.test(w)) { v.push(w.slice(0,-2)+"ה", w.slice(0,-2)) }
  if(/ימ$/.test(w)) { v.push(w.slice(0,-2), w.slice(0,-2)+"ה") }
  return v.filter(x=>x.length>1);
}
function splitWords(s,keepUnits){
  return fnorm(s).split(" ").filter(w=>w.length>1&&!HE_NUM[w]&&
    !GRAM_WORDS.test(w)&&!KILO_WORDS.test(w)&&!/^\d/.test(w)&&
    (keepUnits||!UNIT_ALIAS[fnorm(w)]&&!UNIT_ALIAS[w]));
}
function hitsIn(nf,w){ return variants(w).some(v=>nf.indexOf(v)>=0) }

/* התאמת שם חופשי למאכל.
   קודם מנסים את הטקסט המלא — כך "חטיף חלבון" נשאר חטיף ולא הופך לאבקה —
   ורק אחר כך בלי מילות היחידה. הזוכה הוא השם הקצר ביותר שכל המילים בו,
   כדי ש"אורז" ייתן אורז לבן ולא נתח ארוך יותר. */
function matchFood(q){
  const lists=[splitWords(q,true),splitWords(q,false)];
  /* שמות היחידות נכללים בטקסט לחיפוש — "שניצלון" הוא יחידה של
     "שניצל עוף בתנור", ובלי זה "שני שניצלונים" לא נמצא. */
  const foods=allFoods().map(f=>({f,nf:fnorm(f.n),
    words:fnorm(f.n+" "+((f.a||[]).join(" "))).split(" ").filter(Boolean),
    extra:fnorm(Object.keys(f.u||{}).concat(f.a||[]).join(" "))}));
  for(const words of lists){
    if(!words.length) continue;
    let best=null,bestScore=-1,bestLen=1e9;
    foods.forEach(o=>{
      const hay=o.nf+" "+o.extra;
      if(!words.every(w=>variants(w).some(v=>hay.indexOf(v)>=0))) return;
      /* התאמה למילה שלמה עדיפה על התאמה כתת־מחרוזת — אחרת "לחם"
         נתפס בתוך "לחמנייה" רק מפני שהשם קצר יותר. */
      let sc=0;
      words.forEach(w=>{ if(variants(w).some(v=>o.words.indexOf(v)>=0)) sc+=2; else sc+=1 });
      /* שובר שוויון: מאכל בסיסי מנצח גרסה מורכבת. בלי זה "אורז" מחזיר
         "אורז עם ירקות" רק מפני שהשם קצר במקרה. */
      const pri=o.f.pri||0, bp=(best&&best.pri)||0;
      if(sc>bestScore || (sc===bestScore&&pri>bp) ||
         (sc===bestScore&&pri===bp&&o.nf.length<bestLen)){
        best=o.f; bestScore=sc; bestLen=o.nf.length;
      }
    });
    if(best) return best;
  }
  /* נפילה שמרנית: רוב המילים חייבות להתאים, ולפחות אחת באורך 3 ומעלה.
     בלי הסף הזה טקסט חסר משמעות מתאים למאכל אקראי. */
  const words=splitWords(q,false);
  if(!words.length) return null;
  let best=null,score=0;
  foods.forEach(o=>{
    const hit=words.filter(w=>hitsIn(o.nf,w));
    const ratio=hit.length/words.length;
    if(ratio>=0.5&&hit.some(w=>w.length>=3)&&ratio>score){ score=ratio; best=o.f }
  });
  return best;
}
function gramsFor(food,unit,qty){
  if(unit==="גרם") return qty;
  if(unit==="קילו") return qty*1000;
  if(food&&food.u&&food.u[unit]) return qty*food.u[unit];
  if(UNIT_G[unit]) return qty*UNIT_G[unit];
  /* בלי יחידה: אם למאכל יש יחידה טבעית אחת, זו הכוונה */
  if(food&&food.u){
    const k=Object.keys(food.u);
    if(k.length) return qty*food.u[k[0]];
  }
  return qty*100;
}

function parseFoodLine(raw){
  const txt=String(raw||"").trim();
  if(!txt) return null;
  const toks=tnorm(txt).split(" ").filter(Boolean);
  let qty=null,unit=null;
  toks.forEach(w=>{
    if(qty==null){
      if(/^\d+([.,]\d+)?$/.test(w)) qty=parseFloat(w.replace(",","."));
      else if(HE_NUM[w]!=null) qty=HE_NUM[w];
    }
    if(unit==null){
      const cand=UNIT_ALIAS[w]||UNIT_ALIAS[fnorm(w)];
      if(cand) unit=cand;
      else if(GRAM_WORDS.test(w)) unit="גרם";
      else if(KILO_WORDS.test(w)) unit="קילו";
    }
  });
  if(qty==null) qty=1;
  const food=matchFood(txt);
  if(!food) return {raw:txt,ok:false,qty,unit};
  const grams=Math.round(gramsFor(food,unit,qty));
  return {raw:txt,ok:true,food:food.n,qty,unit:unit||null,grams:Math.max(1,grams)};
}
/* מפריד פריטים: פסיק, נקודה־פסיק, שורה חדשה, או " ו" כמילת חיבור */
function parseFoodText(text){
  return String(text||"")
    .split(/[,;\n]+|\s+ו[־\-]?\s*(?=\d)|\s+ו(?=[א-ת]{3,})/)
    .map(s=>s.trim()).filter(Boolean)
    .map(parseFoodLine).filter(Boolean);
}

/* מאכלים שהמשתמש הוסיף בעצמו, מהקלדה או מצילום תווית */
function allFoods(){ return FOOD_DB.concat(customFoods) }
function foodByName(n){ return allFoods().find(f=>f.n===n)||null }

/* ----------------------------------------------------------------------------
   קריאת תווית תזונה מצילום.
   זה עובד בניגוד להערכת כמויות מצלחת, כי תווית היא טקסט. שוב שני מעברים:
   המנוע העברי קורא את שמות הרכיבים ומשמיד ספרות, והמעבר האנגלי המוגבל
   לספרות מחזיר את המספרים.
   ---------------------------------------------------------------------------- */
const LABEL_FIELDS=[
 {key:"kcal",syn:["אנרגיה","קלוריות","קלוריה","energy","calories","kcal"],min:0,max:900,dec:0},
 {key:"p",   syn:["חלבונים","חלבון","protein"],                          min:0,max:100,dec:1},
 {key:"c",   syn:["פחמימות","פחמימה","carbohydrate","carbohydrates","carbs"],min:0,max:100,dec:1},
 {key:"f",   syn:["שומנים","שומן","fat","fats"],                          min:0,max:100,dec:1}
];
/* שורות משנה שאסור לקחת מהן: "מתוכן סוכרים", "מתוכן חומצות שומן רוויות" */
const LABEL_SKIP=/מתוכן|רווי|סוכר|טרנס|כולסטרול|נתרן|מלח|סיב|of which|saturat|sugar|sodium|fibre|fiber/i;

function parseLabel(lines){
  const rows=lines.map(l=>({raw:l,norm:tnorm(l)})).filter(r=>r.norm);
  const per100=rows.some(r=>/100\s*(גרם|גר|ג|g|ml|מ"ל|מל)/.test(r.raw));
  const out={};
  LABEL_FIELDS.forEach(f=>{
    for(const s of f.syn){
      const ns=tnorm(s); if(!ns) continue;
      for(const R of rows){
        if(R.norm.indexOf(ns)<0) continue;
        if(LABEL_SKIP.test(R.raw)) continue;
        const nums=(R.raw.replace(/,/g,".").match(/\d{1,4}(?:\.\d{1,2})?/g)||[])
          .map(parseFloat).filter(v=>!isNaN(v)&&v>=f.min&&v<=f.max);
        if(!nums.length) continue;
        /* באנרגיה מודפסים גם קילו־ג'אול וגם קלוריות. הקלוריות תמיד הקטן מביניהם. */
        out[f.key]=+(f.key==="kcal"?Math.min.apply(null,nums):nums[0]).toFixed(f.dec);
        return;
      }
    }
  });
  return {vals:out,per100,lines};
}

async function labelLinesFromImage(canvas){
  await loadTesseract();
  if(!planTxtWorker) planTxtWorker=await Tesseract.createWorker(["heb","eng"]);
  const A=await planTxtWorker.recognize(canvas,{},{text:true,blocks:true});
  if(!labelNumWorker){
    labelNumWorker=await Tesseract.createWorker("eng");
    await labelNumWorker.setParameters({tessedit_char_whitelist:"0123456789.,"});
  }
  const B=await labelNumWorker.recognize(canvas,{},{text:true,blocks:true});
  const aLines=linesOf(A.data).filter(l=>l.bbox);
  const bWords=wordsOf(B.data).filter(w=>w.bbox&&/\d/.test(w.text||""));
  if(!aLines.length) return (A.data.text||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  return aLines.map(l=>{
    const nums=bWords.filter(w=>{const y=(w.bbox.y0+w.bbox.y1)/2;return y>=l.bbox.y0-3&&y<=l.bbox.y1+3})
                     .map(w=>String(w.text).trim()).filter(Boolean);
    const name=(l.text||"").replace(/[‎‏‪-‮⁦-⁩]/g,"").replace(/\d+([.,]\d+)?/g,"").replace(/\s+/g," ").trim();
    return (name+" "+nums.join(" ")).trim();
  }).filter(Boolean);
}

/* ----------------------------------------------------------------------------
   חיפוש במאגר מזון ציבורי (Open Food Facts).
   זה **לא** בינה מלאכותית ולא ידע של האפליקציה — זו שאילתה לשירות חיצוני,
   ולכן היא נשלחת רק בלחיצה מפורשת ולא ברקע. השירות מגביל קצב בקשות ולפעמים
   פשוט לא עונה, ולכן המאגר המקומי נשאר המקור העיקרי והחיפוש הוא עזר בלבד.
   מה שנמצא נכנס לטופס לאישור — לא נשמר לבד.
   ---------------------------------------------------------------------------- */
/* מאגר התזונה הלאומי של משרד הבריאות, דרך data.gov.il.
   זהו מקור רשמי בעברית עם ערכים ל־100 גרם, ולכן הוא עדיף בהרבה על מאגרים
   בינלאומיים: השמות בעברית, המזון ישראלי, והנתונים לא נכתבו על ידי משתמשים.
   השאילתה נשלחת רק בלחיצה מפורשת. */
const MOH_RID="c3cb0630-0650-46c1-a068-82d575c094b2";
async function searchFoodOnline(term){
  window.__net={busy:true,term};
  render();
  const url="https://data.gov.il/api/3/action/datastore_search?resource_id="+MOH_RID+
            "&q="+encodeURIComponent(term)+"&limit=25";
  try{
    const ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(),12000);
    const res=await fetch(url,{signal:ctl.signal});
    clearTimeout(to);
    if(!res.ok) throw new Error("status "+res.status);
    const j=await res.json();
    if(!j.success) throw new Error("bad response");
    const num=v=>{ const x=parseFloat(v); return isNaN(x)?null:+x.toFixed(1) };
    const items=((j.result&&j.result.records)||[]).map(rec=>({
      n:String(rec.shmmitzrach||"").trim(),
      en:String(rec.english_name||"").trim(),
      kcal:num(rec.food_energy),
      p:num(rec.protein), c:num(rec.carbohydrates), f:num(rec.total_fat),
      fiber:num(rec.total_dietary_fiber), sodium:num(rec.sodium)
    })).filter(x=>x.n&&x.kcal!=null&&x.kcal>=0&&x.kcal<=900);
    window.__net={busy:false,term,items,total:(j.result&&j.result.total)||items.length,
      msg:items.length?null:"לא נמצא במאגר משרד הבריאות. נסה ניסוח אחר, או הקלד את הערכים ידנית."};
  }catch(err){
    window.__net={busy:false,term,items:[],
      err:err.name==="AbortError"
        ? "החיפוש לקח יותר מדי זמן. נסה שוב, או הקלד ידנית."
        : "החיפוש נכשל — ייתכן שאין חיבור לאינטרנט. הקלד את הערכים ידנית."};
  }
  render();
}

      : (err.message||String(err))};

function dayTotals(date){
  const t={kcal:0,p:0,c:0,f:0,items:0};
  meals.filter(m=>m.date===date).forEach(m=>{
    (m.items||[]).forEach(it=>{
      const g=it.grams||0, fd=foodByName(it.food);
      if(!fd) return;
      t.kcal+=fd.kcal*g/100; t.p+=fd.p*g/100; t.c+=fd.c*g/100; t.f+=fd.f*g/100; t.items++;
    });
  });
  t.kcal=Math.round(t.kcal); t.p=Math.round(t.p); t.c=Math.round(t.c); t.f=Math.round(t.f);
  return t;
}

/* "כדאי לי לאכול את זה?" — תשובה מול מה שנשאר היום ומול המטרה */
function shouldEat(foodName,grams){
  const fd=foodByName(foodName); if(!fd) return null;
  const T=nutriTargets();
  const sofar=dayTotals(ui.foodDate||today());
  const add={kcal:Math.round(fd.kcal*grams/100),p:Math.round(fd.p*grams/100),
             c:Math.round(fd.c*grams/100),f:Math.round(fd.f*grams/100)};
  if(!T.ready) return {add,verdict:"ok",t:"אין עדיין שקילה",
    d:"בלי משקל עדכני אי אפשר לחשב יעד קלורי. הוסף שקילה ואז התשובה תהיה מבוססת."};

  const after=sofar.kcal+add.kcal;
  const leftLo=T.kcal[0]-sofar.kcal, leftHi=T.kcal[1]-sofar.kcal;
  const pLeft=T.protein[0]-sofar.p;
  const bits=[];
  let verdict="ok",t="";

  if(after<=T.kcal[1]){
    verdict="good"; t="כן, זה נכנס";
    bits.push("אחרי הארוחה תהיה על "+after+" קק\"ל, בתוך היעד היומי של "+T.kcal[0]+"–"+T.kcal[1]+".");
  }else if(after<=T.kcal[1]*1.1){
    verdict="warn"; t="גבולי";
    bits.push("זה יעלה אותך ל־"+after+" קק\"ל, מעט מעל היעד. יום בודד לא קובע — מה שקובע הוא הממוצע השבועי.");
  }else{
    verdict="bad"; t="חורג משמעותית";
    bits.push("זה יביא אותך ל־"+after+" קק\"ל מול יעד של עד "+T.kcal[1]+". חריגה של "+(after-T.kcal[1])+" קק\"ל.");
  }

  if(add.p>=20) bits.push("יש כאן "+add.p+" גרם חלבון — תרומה משמעותית ליעד.");
  if(pLeft>0) bits.push("נשארו לך "+Math.max(0,Math.round(pLeft))+" גרם חלבון להיום מתוך "+T.protein[0]+".");
  else bits.push("כבר עברת את סף החלבון היומי.");

  /* צפיפות חלבון — גרם חלבון לכל 100 קק"ל. זה מה שמבדיל בין "הרבה קלוריות"
     לבין "קלוריות שלא עושות כלום בשביל המטרה". */
  if(add.kcal>=150){
    const dens=add.p/(add.kcal/100);
    if(dens<2)
      bits.push("צפיפות החלבון נמוכה — "+n1(dens)+" גרם לכל 100 קק\"ל. "+
        (T.goal.id==="cut"?"בחיטוב זה הצירוף שהכי מקשה לשמור על מסה רזה."
                          :"זה לא אוסר, אבל הקלוריות האלה לא מקדמות את יעד החלבון."));
    else if(dens>=8)
      bits.push("צפיפות חלבון גבוהה — "+n1(dens)+" גרם לכל 100 קק\"ל. מזון יעיל למטרה שלך.");
  }

  if(T.goal.id==="mass"&&verdict==="bad")
    bits.push("גם בעלייה במסה, עודף גדול לא בונה יותר שריר — הוא מוסיף שומן. Garthe 2013 מראה שקצב מהיר יותר נזקף בעיקר לשומן.");
  if(T.goal.id==="keep"&&verdict==="warn")
    bits.push("בשמירה אפשר לאזן את זה בימים הסמוכים. אין צורך לתקן באותו יום.");

  return {add,verdict,t,d:bits.join(" "),left:[Math.round(leftLo),Math.round(leftHi)],T,sofar};
}

/* ============================================================================
   אימונים — סימון ביצוע ומעקב ביצועים
   ----------------------------------------------------------------------------
   מה שנרשם הוא מה שבוצע בפועל, לא מה שהתוכנית ביקשה. ההשוואה בין השניים
   היא כל העניין: תוכנית שלא מבוצעת כמו שנכתבה היא מידע, לא כישלון.
   ============================================================================ */
function firstNum(s){ const m=String(s||"").match(/\d+(?:\.\d+)?/); return m?parseFloat(m[0]):null }

/* היסטוריית ביצוע לתרגיל מסוים, מהחדש לישן */
function exHistory(exName){
  const out=[];
  workouts.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(w=>{
    (w.items||[]).forEach(it=>{
      if(it.ex===exName&&it.done) out.push({date:w.date,sets:it.sets,perf:it.perf,note:it.note});
    });
  });
  return out;
}
/* השוואה לפעם הקודמת — לפי המספר הראשון שנרשם בביצוע */
function exTrend(exName){
  const h=exHistory(exName);
  if(h.length<2) return null;
  const a=firstNum(h[0].perf), b=firstNum(h[1].perf);
  if(a==null||b==null) return null;
  const d=a-b;
  return {d,now:a,prev:b,
    v:d>0?"good":d<0?"bad":"ok",
    t:d>0?"עלייה":d<0?"ירידה":"אותו דבר"};
}

function weekKey(d){
  const t=toDate(d), day=t.getDay();
  const sun=new Date(t.getFullYear(),t.getMonth(),t.getDate()-day);
  return sun.getFullYear()+"-"+String(sun.getMonth()+1).padStart(2,"0")+"-"+String(sun.getDate()).padStart(2,"0");
}
/* נפח שבועי לפי שריר — זה המספר שהראיות מדברות עליו, לא נפח של אימון בודד */
function weeklyVolume(weeksBack){
  const now=dayNum(today()), vol={}, weeks=new Set();
  workouts.forEach(w=>{
    if(now-dayNum(w.date)>weeksBack*7) return;
    weeks.add(weekKey(w.date));
    (w.items||[]).forEach(it=>{
      if(!it.done||!it.ex) return;
      const x=EX_DB.find(d=>d.n===it.ex); if(!x) return;
      const s=firstNum(it.sets)||it.setsPlanned||3;
      x.p.forEach(m=>{ vol[m]=(vol[m]||0)+s });
    });
  });
  const n=Math.max(1,weeks.size);
  return {perWeek:Object.entries(vol).map(([m,v])=>[m,v/n]).sort((a,b)=>b[1]-a[1]),weeks:n};
}

/* ============================================================================
   צעדים
   ----------------------------------------------------------------------------
   מה שצריך לדעת לפני שקוראים את הקוד: **דפדפן לא יכול לספור צעדים ברקע.**
   אין לו גישה לחיישן כשהמסך כבוי או כשהלשונית לא פעילה, וזו מגבלה של
   מערכת ההפעלה ולא של הקוד. לכן יש כאן שלוש דרכים, לפי סדר האמינות:

     1. הקלדה ידנית — מעתיקים את המספר מאפליקציית הבריאות של הטלפון.
        זו הדרך המדויקת, כי שם הספירה רצה כל היום ברמת המערכת.
     2. ייבוא מ־Apple Health (export.xml) — כל ההיסטוריה בבת אחת.
     3. מונה חי מהחיישן — עובד רק כשהאפליקציה פתוחה על המסך. שימושי
        להליכה ממוקדת, לא למעקב יומי.

   הספים כאן מבוססים על Paluch ואחרים, Lancet Public Health 2022 —
   מטא־אנליזה של 15 מחקרי עוקבה. התמותה יורדת עם עליית הצעדים ומתיישרת
   סביב 6,000–8,000 ליום מעל גיל 60, וסביב 8,000–10,000 מתחת לגיל 60.
   **10,000 אינו מספר מחקרי** — הוא הגיע משם של מד־צעדים יפני משנות ה־60
   (manpo-kei, "מונה 10,000 צעדים"), ונשאר בתרבות.
   ============================================================================ */
const STEP_SRC={manual:"הוקלד",health:"Apple Health",live:"מונה חי"};

function stepsOn(date){
  const r=steps.find(s=>s.date===date);
  return r?r.n:null;
}
function setSteps(date,n,src){
  n=Math.max(0,Math.round(n));
  const r=steps.find(s=>s.date===date);
  if(r){ r.n=n; r.src=src||r.src; }
  else steps.push({id:uid(),date,n,src:src||"manual"});
  steps.sort((a,b)=>a.date<b.date?-1:1);
  return persist();
}
function delSteps(date){
  steps=steps.filter(s=>s.date!==date);
  return persist();
}
/* ימים אחרונים כולל ימים בלי נתון — יום בלי רישום אינו אפס צעדים,
   הוא פשוט לא נמדד, ולכן הוא לא נכנס לממוצע. */
function lastStepDays(n){
  const out=[], t=dayNum(today());
  for(let i=n-1;i>=0;i--){
    const d=new Date((t-i)*DAY);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    out.push({date:key,n:stepsOn(key)});
  }
  return out;
}
function stepAvg(days){
  const has=lastStepDays(days).filter(d=>d.n!=null);
  if(!has.length) return null;
  return {avg:has.reduce((s,d)=>s+d.n,0)/has.length, days:has.length, of:days};
}

/* אותם כללים כמו בשאר המגמות: שבוע ראשון–שבת, שבוע עם יום אחד מסומן
   ככזה, ושבוע בלי נתונים אינו אפס אלא פשוט לא קיים. */
function weeklySteps(maxWeeks){
  if(!steps.length) return [];
  const b={};
  steps.forEach(s=>{ (b[weekKey(s.date)]=b[weekKey(s.date)]||[]).push(s.n) });
  const w=Object.keys(b).sort().map(k=>({
    week:k, n:b[k].length,
    avg:b[k].reduce((x,y)=>x+y,0)/b[k].length
  }));
  w.forEach((x,i)=>{
    const p=w[i-1];
    x.d=p?x.avg-p.avg:null;
    x.gap=p?Math.round((dayNum(x.week)-dayNum(p.week))/7):null;
  });
  return w.slice(-(maxWeeks||WEEK_SHOW)).reverse();
}

/* הערכה מול הראיות. הטווח תלוי בגיל, ולכן הוא נקרא מתאריך הלידה. */
function stepVerdict(avg){
  const age=myAge();
  const young=age==null||age<60;
  const plateau=young?[8000,10000]:[6000,8000];
  if(avg<3000) return {v:"bad",t:"נמוך",band:plateau,
    why:"מתחת ל־3,000 צעדים ביום זו רמת פעילות שנחשבת יושבנית. כאן כל תוספת קטנה נותנת את השיפור הגדול ביותר — העלייה החדה בתועלת היא דווקא בתחתית הסולם."};
  if(avg<plateau[0]) return {v:"warn",t:"יש לאן לעלות",band:plateau,
    why:"אתה בתוך הטווח שבו כל אלף צעדים נוספים עדיין קונים שיפור ברור. היעד שבו העקומה מתיישרת אצלך הוא סביב "+plateau[0].toLocaleString("en-US")+"."};
  if(avg<plateau[1]) return {v:"good",t:"טוב",band:plateau,
    why:"אתה בתוך הטווח שבו רוב התועלת כבר הושגה. מכאן והלאה התוספת קיימת אבל קטנה בהרבה."};
  return {v:"good",t:"מצוין",band:plateau,
    why:"מעל הטווח שבו העקומה מתיישרת. יותר צעדים לא מזיקים, אבל אל תצפה מהם לקפיצה נוספת — מכאן ההשפעה הגדולה מגיעה מהאימונים ומהתזונה."};
}

/* צעדים לא נכנסים לחישוב הקלוריות כתוספת, כדי לא לספור פעמיים:
   מכפיל הפעילות שבחרת כבר מכיל את התנועה היומית. מה שכן אפשר לעשות
   הוא לבדוק אם המכפיל שבחרת מתיישב עם כמה שאתה באמת זז. */
function stepActivityHint(avg){
  const act=(me&&me.act)||ui.act||null;
  let fits;
  if(avg<5000) fits="יושבני עד קל";
  else if(avg<7500) fits="קל";
  else if(avg<10000) fits="בינוני";
  else fits="גבוה";
  return {fits,act};
}

/* ---------- מונה חי ----------
   זיהוי צעד מתאוצה: מסננים את הרעש בממוצע נע, ומחפשים חצייה של סף כלפי
   מעלה עם מרווח מינימלי בין צעדים. הסף והמרווח נבחרו כך שריצה במקום
   וטלטול היד לא ייספרו כהליכה — עדיף לפספס צעד מלהמציא צעדים. */
const STEP_MIN_GAP=260, STEP_THRESH=1.35;
let live=null;
function liveState(){ return live }
function liveSupported(){ return typeof DeviceMotionEvent!=="undefined" }
function liveNeedsPermission(){
  return liveSupported()&&typeof DeviceMotionEvent.requestPermission==="function";
}
function liveStop(save){
  if(!live) return;
  window.removeEventListener("devicemotion",live.onMotion);
  document.removeEventListener("visibilitychange",live.onHide);
  const n=live.count;
  live=null;
  if(save&&n>0){
    const cur=stepsOn(today())||0;
    setSteps(today(),cur+n,"live");
    toast(n.toLocaleString("en-US")+" צעדים נוספו להיום");
  }
  render();
}
async function liveStart(){
  if(!liveSupported()){ toast("אין במכשיר הזה חיישן תנועה שהדפדפן יכול לקרוא"); return }
  if(liveNeedsPermission()){
    let res;
    try{ res=await DeviceMotionEvent.requestPermission() }
    catch(e){ res="denied" }
    if(res!=="granted"){
      toast("בלי אישור לחיישן התנועה אי אפשר לספור. אפשר להקליד את המספר ידנית.");
      return;
    }
  }
  const st={count:0,started:Date.now(),avg:1,up:false,lastAt:0,got:false};
  st.onMotion=e=>{
    const a=e.accelerationIncludingGravity;
    if(!a||a.x==null) return;
    st.got=true;
    const mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)/9.81;
    st.avg=st.avg*0.9+mag*0.1;              /* קו בסיס נע — מנטרל כיוון החזקה */
    const dev=mag-st.avg;
    const now=Date.now();
    if(!st.up&&dev>STEP_THRESH-1&&now-st.lastAt>STEP_MIN_GAP){
      st.up=true; st.count++; st.lastAt=now;
      const el=document.getElementById("liveN");
      if(el) el.textContent=st.count.toLocaleString("en-US");
    }else if(st.up&&dev<0.05) st.up=false;
  };
  /* אם המסך נכבה או המשתמש עבר לאפליקציה אחרת — הספירה נעצרת ממילא.
     עוצרים במפורש ושומרים, כדי שלא ייראה כאילו הוא ממשיך לרוץ. */
  st.onHide=()=>{ if(document.hidden) liveStop(true) };
  window.addEventListener("devicemotion",st.onMotion);
  document.addEventListener("visibilitychange",st.onHide);
  live=st;
  render();
  setTimeout(()=>{
    if(live===st&&!st.got){
      toast("החיישן לא מדווח תנועה. בטלפון זה עובד; במחשב בדרך כלל לא.");
    }
  },2500);
}

function nInt(x){ return x==null?"—":Math.round(x).toLocaleString("en-US") }

/* ---------- גשר מהטלפון ----------
   הטלפון כבר סופר צעדים כל היום ברמת מערכת ההפעלה, בלי שום אפליקציה.
   מה שחסר הוא רק להעביר את המספר לכאן. שתי דרכים, שתיהן עובדות בלי
   שאני נוגע בסיסמה או במפתח כלשהו:

     א. קיצור (Shortcuts) שמעתיק את המספר ללוח → כפתור "הדבק מהלוח".
     ב. קיצור שפותח את הקישור עם המספר בכתובת: ...#steps=8432
        הכתובת נקראת פעם אחת בטעינה, ממלאת את הטופס, ומנוקה מיד.

   בשני המקרים המספר **ממלא טופס ולא נשמר לבד** — אותו כלל שחל על ה־OCR
   ועל הייבוא: קריאה שגויה שנשמרת בשקט מזיקה יותר מהקלדה. */
const THOU="[,\\s\u00A0\u2009\u202F\u2007]";
function parsePastedSteps(txt){
  if(!txt) return null;
  /* קודם מחפשים מספר עם מפרידי אלפים ("8,432" או "8 432"), ורק אחר כך
     מספר רגיל. מחיקה גורפת של רווחים הייתה מדביקה מספרים שכנים:
     "16/08 8432" היה נקרא כ-160884. */
  const s=String(txt);
  const strip=new RegExp(THOU,"g");
  const cand=[];
  /* מעבר ראשון: מספר עם מפרידי אלפים. הוא **חייב** להתחיל אחרי תו שאינו
     ספרה ולהסתיים לפני תו שאינו ספרה, אחרת "16/08 8432" היה נקרא כ־
     "08 843" = 8843. (בלי lookbehind, כדי לא לשבור אייפונים ישנים.) */
  const g=new RegExp("(^|\\D)(\\d{1,3}(?:"+THOU+"\\d{3})+)(?!\\d)","g");
  let m;
  while((m=g.exec(s))!==null){ cand.push(m[2].replace(strip,"")); g.lastIndex=m.index+m[0].length }
  /* מעבר שני: מספרים רגילים. \d+ תופס ממילא רצף שלם. */
  (s.match(/\d+/g)||[]).forEach(x=>cand.push(x));
  /* לוקחים את הגדול שעדיין סביר — קיצור שמעתיק רק מספר מחזיר אותו
     בדיוק, והמקסימום עוזר רק כשיש רעש מסביב. */
  let best=null;
  cand.forEach(x=>{
    const n=parseInt(x,10);
    if(isNaN(n)||n<0||n>200000) return;
    if(best==null||n>best) best=n;
  });
  return best;
}
function readStepLink(raw){
  /* `raw` קיים כדי שאפשר יהיה לבדוק את הפונקציה בלי לגעת בכתובת האמיתית.
     בשימוש רגיל היא נקראת בלי ארגומנט וקוראת את הכתובת בעצמה. */
  const h=String(raw!=null?raw:(location.hash||"")).replace(/^#/,"");
  if(!h||h.indexOf("steps=")<0) return;
  const q={};
  h.split("&").forEach(p=>{ const [k,v]=p.split("="); if(k) q[k]=decodeURIComponent(v||"") });
  const n=parsePastedSteps(q.steps);
  if(n==null) return;
  const d=/^\d{4}-\d{2}-\d{2}$/.test(q.date||"")?q.date:today();
  /* מנקים את הכתובת מיד, אחרת רענון היה מציע שוב את אותו מספר ישן.
     בדף שנפתח כקובץ מקומי הדפדפן לפעמים חוסם את שתי הדרכים — אז הבאנר
     פשוט יופיע שוב אחרי רענון, וזה מצב שאפשר לחיות איתו. */
  if(raw==null){
    try{ history.replaceState(null,"",location.pathname+location.search) }
    catch(e){ try{ location.hash="" }catch(e2){} }
  }
  window.__stepLink={n,date:d};
  if(me){ ui.tab="steps"; ui.logId=null }
}

function stepsCard(){
  const t=today(), tn=stepsOn(t);
  const a7=stepAvg(7), a28=stepAvg(28);
  let h='<div class="card"><h2>צעדים</h2>';

  /* היום — המספר הגדול, כי זה מה שמסתכלים עליו */
  h+='<div class="stepnow">'+
     '<div><div class="stepbig num">'+nInt(tn)+'</div>'+
     '<div class="tiny">'+(tn==null?"לא נרשם היום":"היום"+(steps.find(s=>s.date===t)?" · "+esc(STEP_SRC[steps.find(s=>s.date===t).src]||""):""))+'</div></div>';
  if(a7) h+='<div style="text-align:end"><div class="stepmid num">'+nInt(a7.avg)+'</div>'+
            '<div class="tiny">ממוצע '+heDays(a7.days)+' אחרונים</div></div>';
  h+='</div>';

  /* שבעת הימים האחרונים — עמודות. יום בלי נתון נשאר ריק ולא אפס. */
  const days=lastStepDays(7);
  const mx=Math.max(1,...days.map(d=>d.n||0));
  const DN=["א","ב","ג","ד","ה","ו","ש"];
  h+='<div class="stepbars">';
  days.forEach(d=>{
    const has=d.n!=null;
    const pct=has?Math.max(4,Math.round(d.n/mx*100)):0;
    h+='<div class="stepbar'+(has?"":" none")+'" title="'+esc(fmtDate(d.date))+'">'+
       '<div class="sbwrap"><div class="sbfill" style="height:'+pct+'%"></div></div>'+
       '<div class="sblab">'+DN[toDate(d.date).getDay()]+'</div></div>';
  });
  h+='</div>';
  h+='<p class="tiny" style="margin:2px 0 12px">יום ריק הוא יום שלא נרשם, לא יום של אפס צעדים. '+
     'ימים בלי נתון לא נכנסים לממוצע.</p>';

  /* פסק דין מול הראיות — רק כשיש מספיק ימים */
  if(a7&&a7.days>=3){
    const v=stepVerdict(a7.avg);
    const b=v.v==="good"?"b-ok":v.v==="bad"?"b-crit":"b-warn";
    h+='<div class="headline"><span class="badge '+b+'">'+esc(v.t)+'</span>'+
       '<p style="margin:9px 0 0">הממוצע שלך הוא <b class="num">'+nInt(a7.avg)+'</b> צעדים ביום. '+
       'הטווח שבו העקומה מתיישרת בגילך הוא <b class="num">'+nInt(v.band[0])+'</b>–<b class="num">'+nInt(v.band[1])+'</b>.</p>'+
       '<p class="tiny" style="margin:7px 0 0">'+esc(v.why)+'</p></div>';
    if(a28&&a28.days>=10&&Math.abs(a28.avg-a7.avg)>800){
      const up=a7.avg>a28.avg;
      h+='<p class="tiny" style="margin:10px 0 0">בחודש האחרון הממוצע שלך היה <span class="num">'+nInt(a28.avg)+
         '</span>. השבוע אתה '+(up?"זז יותר":"זז פחות")+' מהרגיל.</p>';
    }
  }else if(a7){
    h+='<p class="tiny">יש '+heDays(a7.days)+' עם נתון. משלושה ימים ומעלה כבר אפשר לומר משהו על הממוצע.</p>';
  }

  /* הגיע מספר מהקיצור בטלפון — מוצג לאישור, לא נשמר לבד */
  const lnk=window.__stepLink;
  if(lnk){
    const had=stepsOn(lnk.date);
    h+='<div class="headline" style="margin-bottom:12px"><span class="badge b-info">הגיע מהטלפון</span>'+
       '<p style="margin:9px 0 0"><b class="num">'+nInt(lnk.n)+'</b> צעדים ל־'+esc(fmtDate(lnk.date))+'.'+
       (had!=null?' רשום שם כרגע <b class="num">'+nInt(had)+'</b> — האישור יחליף אותו.':'')+'</p>'+
       '<div class="btnrow" style="margin-top:10px">'+
       '<button class="btn" id="linkOk">אשר ושמור</button>'+
       '<button class="btn sec" id="linkNo">בטל</button></div></div>';
  }

  /* הקלדה — הדרך המדויקת */
  const pre=lnk?lnk.n:tn;
  h+='<form id="stepForm" class="steprow">'+
     '<input type="date" name="date" value="'+(lnk?lnk.date:t)+'" required>'+
     '<input type="number" name="n" inputmode="numeric" min="0" max="200000" step="1" '+
       'placeholder="מספר צעדים"'+(pre!=null?' value="'+pre+'"':'')+' required>'+
     '<button class="btn" type="submit">שמור</button></form>';
  h+='<div class="btnrow" style="margin-top:8px"><button class="btn sec" id="stepPaste">הדבק מהלוח</button></div>';
  h+='<p class="tiny" style="margin-top:8px">הדרך הכי מדויקת: לפתוח את אפליקציית הבריאות בטלפון ולהעתיק את המספר. '+
     'שם הספירה רצה כל היום ברמת מערכת ההפעלה, בלי שום אפליקציה פתוחה.</p>';

  h+='<details style="margin-top:10px"><summary class="tiny" style="cursor:pointer;color:var(--accent-txt);font-weight:600">'+
     'איך גורמים לזה לקרות לבד כל ערב</summary>'+
     '<div class="tiny" style="margin-top:8px;line-height:1.75">'+
     '<b>באייפון — אפליקציית קיצורים (Shortcuts):</b><br>'+
     '1. קיצורים ← <b>אוטומציה</b> ← + ← <b>שעה ביום</b> ← 23:50 ← "הפעל מיד".<br>'+
     '2. הוסף פעולה <b>"מצא דגימות בריאות"</b> ← סוג: <b>צעדים</b> ← טווח: היום ← חשב <b>סכום</b>.<br>'+
     '3. הוסף <b>"העתק ללוח"</b>.<br>'+
     '4. בערב תפתח כאן ותלחץ <b>"הדבק מהלוח"</b> — המספר ייכנס לבד.<br><br>'+
     '<b>גרסה בלחיצה אחת:</b> במקום "העתק ללוח" הוסף <b>"פתח כתובת"</b> עם הכתובת של האפליקציה '+
     'ובסופה <span dir="ltr">#steps=</span> ואחריו התוצאה. הדף ייפתח עם המספר מוכן לאישור.<br><br>'+
     '<b>באנדרואיד:</b> הצעדים יושבים ב־Health Connect. אפליקציית אוטומציה כמו MacroDroid יכולה '+
     'לקרוא אותם ולהעתיק ללוח באותה צורה.<br><br>'+
     'בשתי הדרכים המספר <b>ממלא טופס ואתה מאשר</b> — הוא לא נשמר לבד, כמו בכל ייבוא כאן.'+
     '</div></details>';

  /* מונה חי */
  h+='<div class="sep2"></div>';
  if(live){
    const mins=Math.max(1,Math.round((Date.now()-live.started)/60000));
    h+='<div class="livebox"><div><div class="stepbig num" id="liveN">'+live.count.toLocaleString("en-US")+'</div>'+
       '<div class="tiny">נספרו במונה החי · '+mins+' דק׳</div></div>'+
       '<div class="btnrow" style="margin:0">'+
       '<button class="btn" id="liveSave">סיים ושמור</button>'+
       '<button class="btn sec" id="liveDrop">בטל</button></div></div>';
    h+='<p class="tiny" style="margin-top:9px">אל תנעל את המסך ואל תעבור לאפליקציה אחרת — הדפדפן מפסיק לקבל '+
       'את החיישן ברגע שהאפליקציה יורדת מהמסך. אם זה יקרה, מה שנספר עד אז יישמר.</p>';
  }else{
    h+='<div class="btnrow"><button class="btn sec" id="liveGo">התחל מונה חי</button></div>';
    h+='<p class="tiny" style="margin-top:8px"><b>מונה חי סופר רק כשהאפליקציה פתוחה על המסך.</b> '+
       'דפדפן לא יכול לקרוא את החיישן ברקע — זו מגבלה של הטלפון, לא של האפליקציה. '+
       'מתאים להליכה ממוקדת; למעקב יומי עדיף להעתיק את המספר מאפליקציית הבריאות.</p>';
  }

  /* היסטוריה */
  if(steps.length){
    const recent=steps.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,10);
    h+='<div class="sep2"></div><h3 class="h3">הימים האחרונים</h3><div class="wklist">';
    recent.forEach(s=>{
      h+='<div class="wkrow"><span class="wkdt num">'+esc(fmtDate(s.date))+'</span>'+
         '<span class="wksrc">'+esc(STEP_SRC[s.src]||"")+'</span>'+
         '<span class="wkav num">'+nInt(s.n)+'</span>'+
         '<button class="xbtn" data-delstep="'+esc(s.date)+'" aria-label="מחק את '+esc(fmtDate(s.date))+'">✕</button>'+
         '</div>';
    });
    h+='</div>';
  }

  const ws=weeklySteps(WEEK_SHOW);
  if(ws.length>=2){
    h+='<div class="sep2"></div><h3 class="h3">שבוע מול שבוע</h3><div class="wklist">';
    ws.forEach(w=>{
      const thin=w.n<3;
      let cls="flat",txt="—";
      if(w.d!=null){
        if(Math.abs(w.d)<400){ cls="flat"; txt="≈" }
        else { cls=w.d>0?"pos":"neg"; txt=(w.d>0?"+":"−")+nInt(Math.abs(w.d)) }
      }
      h+='<div class="wkitem"><div class="wkrow'+(thin?" thin":"")+'">'+
         '<span class="wkdt num">'+esc(weekRange(w.week))+'</span>'+
         '<span class="wkav num">'+nInt(w.avg)+'</span>'+
         '<span class="wkd '+cls+' num">'+txt+'</span></div>';
      if(thin) h+='<p class="wknote">רק '+heDays(w.n)+' נרשם בשבוע הזה — הממוצע חלקי.</p>';
      h+='</div>';
    });
    h+='</div><p class="tiny" style="margin-top:10px">שינוי קטן מ־400 צעדים ביום מסומן ≈ — '+
       'הוא בתוך התנודה הרגילה של יום־יום ולא מייצג שינוי בהרגל.</p>';
  }

  h+='<p class="tiny" style="margin-top:12px">הספים לפי Paluch ואחרים, <i>Lancet Public Health</i> 2022 — '+
     'מטא־אנליזה של 15 מחקרי עוקבה. <b>10,000 אינו מספר מחקרי</b>: הוא הגיע משם מסחרי של מד־צעדים '+
     'יפני משנות ה־60 ונשאר בתרבות. הצעדים לא נוספים לחישוב הקלוריות כדי לא לספור פעמיים — '+
     'מכפיל הפעילות שבחרת כבר כולל את התנועה היומית.</p>';
  h+='</div>';
  return h;
}

/* צעדים הם תחום בפני עצמו — הרגל יומי, לא חלק מרישום אימון.
   לכן לשונית משלהם ולא כרטיס בתוך "אימונים". */
function viewSteps(){
  let h='<div class="lgtitle">צעדים</div>';
  const a7=stepAvg(7);
  h+='<p class="sub">'+(steps.length
      ? steps.length+' ימים נרשמו'+(a7?' · ממוצע '+nInt(a7.avg)+' ליום':'')
      : 'עוד לא נרשמו צעדים')+'</p>';
  h+=stepsCard();
  return h;
}

function viewWork(){
  /* מסך רישום אימון פעיל */
  if(ui.logId!==undefined&&ui.logId!==null) return viewLog();

  let h='<div class="lgtitle">אימונים</div>';
  const last=workouts.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
  h+='<p class="sub">'+(workouts.length
      ? workouts.length+' אימונים · האחרון '+fmtDate(last.date)
      : 'עוד לא רשמת אימון')+'</p>';

  /* התחלת אימון */
  h+='<div class="card"><h2>סמן שביצעת אימון</h2>';
  if(!plans.length){
    h+='<div class="empty">צריך קודם תוכנית. עבור ללשונית תוכניות.</div>';
  }else{
    h+='<div class="btnrow">';
    plans.forEach(p=>{ h+='<button class="btn" data-startw="'+p.id+'">'+esc(p.title||"תוכנית")+'</button>' });
    h+='</div><p class="tiny" style="margin-top:10px">בחר את התוכנית שביצעת. התרגילים ייטענו עם הפרוטוקול שכתוב בה, '+
       'ואתה רק רושם מה עשית בפועל.</p>';
  }
  h+='</div>';

  /* נפח שבועי */
  if(workouts.length){
    const wv=weeklyVolume(28);
    if(wv.perWeek.length){
      h+='<div class="card"><h2>נפח שבועי לפי שריר</h2>';
      h+='<p class="tiny" style="margin-bottom:10px">ממוצע על פני '+heWeeks(wv.weeks)+' שבהם התאמנת.</p>';
      wv.perWeek.slice(0,10).forEach(([m,v])=>{
        const lo=v<10, hi=v>20;
        const b=hi?"b-warn":lo?"b-mute":"b-ok";
        h+='<div class="row" style="padding:9px 0;border-color:var(--sep)">'+
           '<div class="k">'+esc(m)+'</div><div class="v"><span class="num">'+n1(v)+'</span> סטים '+
           '<span class="badge '+b+'">'+(hi?"מעל הטווח":lo?"מתחת לטווח":"בטווח")+'</span></div></div>';
      });
      h+='<p class="tiny" style="margin-top:10px">הטווח שרוב הראיות תומכות בו הוא <b>10–20 סטים לקבוצת שריר בשבוע</b> '+
         '(Schoenfeld ואחרים). מתחת לזה יש מקום להוסיף; הרבה מעל — עולה מחיר ההתאוששות בלי תוספת ברורה.</p></div>';
    }
  }

  /* היסטוריה */
  if(workouts.length){
    h+='<h3 style="padding:0 4px;font-size:15px;color:var(--label2)">היסטוריית אימונים</h3><div class="list">';
    workouts.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,30).forEach(w=>{
      const done=(w.items||[]).filter(i=>i.done).length;
      h+='<div class="row tap" data-openw="'+w.id+'"><div class="k"><b>'+esc(w.title||"אימון")+'</b>'+
         '<div class="tiny">'+fmtDate(w.date)+' · '+done+' מתוך '+(w.items||[]).length+' תרגילים'+
         (w.note?' · '+esc(w.note):'')+'</div></div><div class="v">‹</div></div>';
    });
    h+='</div>';
  }

  /* מעקב ביצועים לפי תרגיל */
  const names=[...new Set(workouts.flatMap(w=>(w.items||[]).filter(i=>i.done&&i.ex).map(i=>i.ex)))];
  if(names.length){
    h+='<div class="card"><h2>ביצועים לפי תרגיל</h2>';
    names.forEach(nm=>{
      const hist=exHistory(nm), tr=exTrend(nm);
      h+='<details class="param"><summary>';
      h+='<span class="pn">'+esc(nm)+'</span>';
      h+='<span class="pv num">'+esc(hist[0].perf||"—")+'</span>';
      if(tr) h+='<span class="badge '+(tr.v==="good"?"b-ok":tr.v==="bad"?"b-crit":"b-mute")+'">'+tr.t+'</span>';
      h+='<span class="badge b-mute">'+hist.length+'</span>';
      h+='</summary><div class="pbody">';
      hist.slice(0,8).forEach(x=>{
        h+='<p class="tiny"><b class="num">'+fmtDate(x.date)+'</b> — '+esc(x.perf||"—")+
           (x.sets?' · '+esc(x.sets)+' סטים':'')+(x.note?' · '+esc(x.note):'')+'</p>';
      });
      if(tr) h+='<p class="tiny" style="margin-top:6px"><b>מול הפעם הקודמת:</b> '+
        (tr.v==="good"?'שיפור מ־'+tr.prev+' ל־'+tr.now+'. זו הראיה הישירה ביותר שהאימון עובד — יותר מכל מספר במשקל.'
        :tr.v==="bad"?'ירידה מ־'+tr.prev+' ל־'+tr.now+'. פעם אחת זה רעש; אם זה חוזר, שווה לבדוק שינה, קלוריות ועייפות מצטברת.'
        :'אותו ביצוע. קיפאון של אימון־שניים תקין לחלוטין.')+'</p>';
      h+='</div></details>';
    });
    h+='<p class="tiny" style="margin-top:10px">ההשוואה נעשית לפי המספר הראשון שרשמת בשדה הביצוע — '+
       'חזרות, שניות או כל מה שמדדת. לכן כדאי לרשום באותו פורמט בכל פעם.</p></div>';
  }
  return h;
}

/* ---- מסך רישום אימון ---- */
function viewLog(){
  const w=workouts.find(x=>x.id===ui.logId);
  if(!w){ ui.logId=null; return viewWork() }
  let h='<div class="lgtitle">'+esc(w.title||"אימון")+'</div>';
  h+='<p class="sub">'+fmtDate(w.date)+'</p>';
  h+='<div class="btnrow" style="margin-bottom:14px"><button class="btn sec" id="backWork">חזרה</button></div>';

  h+='<div class="card"><h2>מה ביצעת</h2>';
  h+='<p class="tiny" style="margin-bottom:12px">סמן כל תרגיל שעשית ורשום מה יצא בפועל. מה שלא תסמן ייחשב כלא בוצע.</p>';
  (w.items||[]).forEach((it,i)=>{
    h+='<div class="logrow'+(it.done?' done':'')+'">';
    h+='<label class="chk"><input type="checkbox" data-wdone="'+i+'"'+(it.done?" checked":"")+'>'+
       '<span class="box"></span></label>';
    h+='<div class="lgmain"><div class="lgnm">'+esc(it.name||it.ex||"תרגיל")+'</div>';
    if(it.planned) h+='<div class="tiny">בתוכנית: '+esc(it.planned)+'</div>';
    h+='<div class="lgin">'+
       '<input data-wsets="'+i+'" value="'+esc(it.sets||"")+'" placeholder="סטים" inputmode="numeric">'+
       '<input data-wperf="'+i+'" value="'+esc(it.perf||"")+'" placeholder="מה יצא — חזרות / שניות">'+
       '</div>';
    h+='<input class="lgnote" data-wnote="'+i+'" value="'+esc(it.note||"")+'" placeholder="הערה">';
    const tr=it.ex?exTrend(it.ex):null;
    if(tr&&it.done) h+='<div class="tiny">מול הפעם הקודמת: '+tr.t+' ('+tr.prev+' ← '+tr.now+')</div>';
    h+='</div></div>';
  });
  h+='<div class="f wide" style="margin-top:12px"><label>איך הרגיש האימון</label>'+
     '<input id="wnote" value="'+esc(w.note||"")+'" placeholder="למשל: כתף תפוסה, ישנתי 5 שעות"></div>';
  h+='<div class="btnrow"><button class="btn" id="saveWork">שמור אימון</button>'+
     '<button class="btn danger" data-delw="'+w.id+'">מחק</button></div>';
  h+='</div>';
  return h;
}

/* ============================================================================
   הגדרת מטרות — נשאלת בכניסה הראשונה וניתנת לשינוי בכל רגע
   ----------------------------------------------------------------------------
   המטרה אינה קבועה. היא אמורה להשתנות לפי ההתקדמות — מי שסיים תקופת עלייה
   עובר לשמירה או לחיטוב, והיעדים נגזרים מחדש. לכן אותו מסך משמש גם להגדרה
   הראשונה וגם לעדכון.
   ============================================================================ */
function viewSetup(){
  const first=!me.goal;
  const g=me.goal||"mass", a=(me.act!=null)?me.act:2;
  let h='<div class="authwrap"><div class="authcard" style="max-width:460px">';
  h+='<div class="brand"><span class="bmark"></span><span>ShapeUp</span></div>';
  h+='<h1>'+(first?"מה המטרה שלך":"עדכון המטרה")+'</h1>';

/* ---- מסך התפריט ---- */
function menuState(){
  const m=ui.menu||(ui.menu={});
  if(m.meals==null) m.meals=3;
  if(m.snacks==null) m.snacks=1;
  if(m.like==null) m.like="";
  if(m.dislike==null) m.dislike="";
  if(m.seed==null) m.seed=1;
  if(!m.pick) m.pick={};
  if(!m.swap) m.swap={};
  return m;
}
/* החלפת פריט בודד: המשתמש בחר מאכל אחר לאותו תפקיד, וזה נשמר לפי מיקום */
function menuApplySwaps(menu,m){
  menu.slots.forEach((s,si)=>{
    s.options.forEach((o,oi)=>{
      o.parts.forEach((pt,pi)=>{
        const k=si+":"+oi+":"+pi, nm=m.swap[k];
        if(!nm) return;
        const f=foodBy(nm); if(!f) return;
        const ratio=pt.food.kcal>0?pt.food.kcal/Math.max(1,f.kcal):1;
        pt.food=f; pt.g=menuRound(pt.g*Math.max(0.4,Math.min(2.5,ratio))); pt.swapped=1;
      });
      const mm=menuMacros(o.parts); o.kcal=mm.kcal; o.p=mm.p; o.c=mm.c; o.f=mm.f;
    });
  });
  return menu;
}
function menuCard(){
  const m=menuState();
  const menu=menuApplySwaps(buildMenu({meals:m.meals,snacks:m.snacks,like:m.like,
    dislike:m.dislike,seed:m.seed}),m);
  const tot=menuTotals(menu,m.pick);
  const t=menu.targets;

  let h='<div class="card"><h2>בניית תפריט</h2>';
  h+='<p class="tiny" style="margin-bottom:13px">כתוב מה אתה אוהב ומה לא, ואבנה יום שלם — ארבע אפשרויות לכל ארוחה, ואפשר להחליף כל פריט בנפרד. הכמויות מכוילות ליעד הקלוריות והחלבון שלך.</p>';

  /* כמה ארוחות */
  h+='<div class="bq"><label class="bql">כמה ארוחות עיקריות ביום</label>'+
     '<div class="seg" id="mMeals">'+[2,3,4,5].map(n=>

  /* מלל חופשי */

     '<button class="btn sec" id="mAgain">תפריט אחר</button></div>';

  if(!t.ready)
    h+='<p class="tiny note">אין עדיין שקילה או תאריך לידה, אז היעד כאן הוא הערכה כללית. הזן אותם בהגדרות ואכייל את הכמויות אליך.</p>';
  h+='</div>';

  /* סיכום היום */
  const inRange=t.ready&&tot.kcal>=t.kcal[0]-120&&tot.kcal<=t.kcal[1]+120;

     '<div class="mt"><b class="num">'+tot.kcal+'</b><span>קלוריות</span></div>'+
     '<div class="mt"><b class="num">'+tot.p+'</b><span>חלבון (גר\')</span></div>'+
     '<div class="mt"><b class="num">'+tot.c+'</b><span>פחמימה (גר\')</span></div>'+
     '<div class="mt"><b class="num">'+tot.f+'</b><span>שומן (גר\')</span></div></div>';
  if(t.ready){
    h+='<p class="tiny" style="margin:11px 0 0">היעד שלך: <b>'+t.kcal[0]+'–'+t.kcal[1]+'</b> קלוריות ו־<b>'+
       t.protein[0]+'–'+t.protein[1]+'</b> גרם חלבון. '+
       (inRange?'<span class="good">התפריט בטווח.</span>'
              :'<span class="bad">התפריט '+(tot.kcal<t.kcal[0]?'נמוך':'גבוה')+' מהיעד — החלף פריטים או שנה את מספר הארוחות.</span>')+'</p>';
    h+='<p class="tiny">שומן: לא לרדת מ־'+t.fatMin+' גרם ביום. '+
       (tot.f<t.fatMin?'<span class="bad">כרגע פחות מזה.</span>':'')+'</p>';

  menu.slots.forEach((s,si)=>{
    const oi=Math.min(m.pick[si]||0,Math.max(0,s.options.length-1));
    const o=s.options[oi];
    h+='<div class="card"><div class="mhead"><h2>'+esc(s.lab)+'</h2>'+

    h+='<div class="seg wrapseg mopt">'+s.options.map((x,i)=>
       '<button data-mpick="'+si+':'+i+'" aria-selected="'+(i===oi)+'">'+esc(x.n)+'</button>').join("")+'</div>';
    o.parts.forEach((pt,pi)=>{
      h+='<div class="mrow'+(pt.swapped?" sw":"")+'">'+
         '<span class="mn">'+esc(pt.food.n)+'</span>'+
         '<span class="mg num">'+pt.g+' גר\'</span>'+
         '<span class="mk num">'+Math.round(pt.food.kcal*pt.g/100)+'</span>'+
         '<button class="mswap" data-mswap="'+si+':'+oi+':'+pi+':'+pt.role+'" '+
         'aria-label="החלף '+esc(pt.food.n)+'">החלף</button></div>';
      const open=m.open===si+":"+oi+":"+pi;
      if(open){
        const alts=(MENU_R[pt.role]||[]).filter(n=>foodBy(n)&&!menuBlocked(n,m.dislike)&&n!==pt.food.n).slice(0,14);
        h+='<div class="malts">'+alts.map(n=>
           '<button data-malt="'+si+':'+oi+':'+pi+':'+esc(n)+'">'+esc(n)+'</button>').join("")+
           (m.swap[si+":"+oi+":"+pi]?'<button class="reset" data-malt="'+si+':'+oi+':'+pi+':">בטל החלפה</button>':'')+
           '</div>';

    h+='</div>';
  });
  return h;
}

/* סרגל התקדמות מול טווח יעד */
function bar(lab,val,lo,hi){
  const pct=Math.max(0,Math.min(120,val/hi*100));
  const inRange=val>=lo&&val<=hi;
  const over=val>hi;
  const col=over?"var(--red)":inRange?"var(--green)":"var(--blue)";
  return '<div style="margin-top:12px"><div class="rnglbl" style="margin:0 0 5px">'+
    '<span>'+esc(lab)+'</span><span class="num">'+val+' / '+lo+'–'+hi+'</span></div>'+
    '<div class="rngbar"><i style="position:absolute;inset-inline-start:0;top:0;height:100%;width:'+
    Math.min(100,pct)+'%;border-radius:980px;background:'+col+'"></i></div></div>';
}
