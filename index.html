}

function renderTabs(){
  $("#tabs").innerHTML=TABS.map(t=>
    '<button data-tab="'+t.id+'" aria-selected="'+(ui.tab===t.id)+'">'+ICONS[t.id]+'<span>'+t.label+'</span></button>'
  ).join("");
  /* תשע לשוניות לא נכנסות ברוחב של טלפון בגודל שאפשר ללחוץ עליו.
     במקום להקטין את כולן עד שהן בלתי קריאות — הסרגל נגלל, והלשונית
     הפעילה נגררת אל תוך התצוגה כדי שתמיד יהיה ברור איפה אתה. */
  const bar=$("#tabs"), cur=bar&&bar.querySelector('[aria-selected="true"]');
  if(bar&&cur&&bar.scrollWidth>bar.clientWidth+2){
    const mid=cur.offsetLeft+cur.offsetWidth/2-bar.clientWidth/2;
    bar.scrollLeft=Math.max(0,Math.min(bar.scrollWidth-bar.clientWidth,mid));
  }
}

/* ---- נגישות: קשירת תוויות לשדות ----
   נמדדו 57 שדות בלי שם נגיש. הסיבה אינה חוסר בתוויות — התוויות קיימות
   וגלויות, אבל הן `<label>` ללא `for`, ולכן קורא מסך שמגיע לשדה מקריא
   "עריכת טקסט" ותו לא. במקום להוסיף id ידנית בעשרות מקומות ולשכוח באחד,
   הקשירה נעשית פעם אחת אחרי כל ציור: כל תווית בתוך `.f` נקשרת לפקד שלידה.
   מה שאין לו תווית גלויה מקבל aria-label לפי הקשר. */
let LBL_N=0;
const ARIA_BY_ID={
  file:"בחר צילום מסך של דוח המדידה",
  lblFile:"בחר תמונה של תווית מזון",
  planFile:"בחר קובץ תוכנית אימון",
  io:"טקסט הגיבוי",
  netTerm:"חיפוש מאכל",
  unitSel:"יחידת מידה"
};
function linkLabels(root){
  const R=root||document.getElementById("app");
  if(!R) return;
  /* 1 — תווית שיושבת ליד הפקד בתוך אותה קבוצה */
  R.querySelectorAll("label").forEach(lb=>{
    if(lb.getAttribute("for")) return;
    if(lb.querySelector("input,select,textarea")) return;   /* תווית עוטפת — כבר תקין */
    const box=lb.parentElement; if(!box) return;
    const ctl=box.querySelector("input:not([type=hidden]),select,textarea");
    if(!ctl) return;
    if(!ctl.id) ctl.id="ac"+(++LBL_N);
    lb.setAttribute("for",ctl.id);
  });
  /* 2 — פקד בלי שום תווית: aria-label לפי מזהה, ואם אין — לפי הרמז */
  R.querySelectorAll("input:not([type=hidden]),select,textarea").forEach(ctl=>{
    if(ctl.getAttribute("aria-label")||ctl.getAttribute("aria-labelledby")) return;
    if(ctl.id&&R.querySelector('label[for="'+CSS.escape(ctl.id)+'"]')) return;
    if(ctl.closest("label")) return;
    const byId=ctl.id&&ARIA_BY_ID[ctl.id];
    const ph=ctl.getAttribute("placeholder");
    /* טקסט השורה שבה הפקד יושב — למשל "משקל" בשורת מדידה */
    let near="";
    const row=ctl.closest(".f,.row,.steprow,.lgin,.mrow,.rng");
    if(row){ const t=(row.textContent||"").replace(/\s+/g," ").trim(); if(t&&t.length<40) near=t }
    const name=byId||ph||near||({date:"תאריך",number:"מספר",text:"טקסט",file:"בחירת קובץ"}[ctl.type]||"שדה");
    ctl.setAttribute("aria-label",name);
  });
}
/* ---- נגישות: תפקידים, מצבים וגרפיקה ----
   `aria-selected` תקף רק בתוך רשימה, לשוניות או טבלה. על כפתורי הבחירה
   שלנו הוא היה חסר משמעות, וקורא מסך פשוט התעלם ממנו. `aria-pressed` על
   כפתור הוא הצורה הנכונה ל"הכפתור הזה דלוק", ואינו מבטיח ניווט בחצים
   שלא מימשנו. */
const SEG_NAME={
  segMetric:"בחירת מדד", segRange:"בחירת תקופה", skKind:"סינון סוג מיומנות",
  skStep:"בחירת שלב", fView:"יומן או תפריט", bGoal:"מטרה", bDays:"אימונים בשבוע",
  bLevel:"רמת ותק", bEnv:"סביבת אימון", bWhen:"מתי לעשות אירובי",
  mMeals:"מספר ארוחות עיקריות", mSnk:"מספר ארוחות ביניים"
};
function a11yPass(root){
  const R=root||document.getElementById("app");
  if(!R) return;
  R.querySelectorAll(".seg,.lvls").forEach(g=>{
    if(!g.getAttribute("role")) g.setAttribute("role","group");
    if(!g.getAttribute("aria-label")&&SEG_NAME[g.id]) g.setAttribute("aria-label",SEG_NAME[g.id]);
    g.querySelectorAll(":scope > button").forEach(b=>{
      const sel=b.getAttribute("aria-selected");
      if(sel!=null){ b.removeAttribute("aria-selected"); b.setAttribute("aria-pressed",sel) }
      else if(b.classList.contains("lvl")||b.classList.contains("cdo"))
        b.setAttribute("aria-pressed",b.classList.contains("on")?"true":"false");
    });
  });
  R.querySelectorAll(".cdo").forEach(b=>{
    if(!b.getAttribute("aria-pressed"))
      b.setAttribute("aria-pressed",b.classList.contains("on")?"true":"false");
  });
  /* אייקונים הם קישוט — קורא מסך צריך לדלג עליהם ולהקריא את הטקסט לידם */
  R.querySelectorAll("svg").forEach(s=>{
    if(s.classList.contains("chart")) return;
    if(s.getAttribute("aria-label")||s.querySelector("title")) return;
    s.setAttribute("aria-hidden","true"); s.setAttribute("focusable","false");
  });
}

/* ---- אישור בתוך האפליקציה ----
   `confirm()` של הדפדפן הוא נקודת כשל אמיתית: ספארי באייפון מציע
   "אל תציג עוד הודעות", ומאותו רגע כל confirm מחזיר false **בשקט**.
   מבחוץ זה נראה בדיוק כמו כפתור מקולקל — לוחצים וכלום לא קורה.
   שלושה כפתורים נפרדים התנהגו כך. מעכשיו האישור הוא חלק
   מהדף עצמו, ואי אפשר להשתיק אותו. */
let ASK=null;
function ask(msg,onYes,opt){
  ASK={msg:String(msg),yes:onYes||function(){},
       ok:(opt&&opt.ok)||"אישור", no:(opt&&opt.no)||"ביטול",
       danger:!!(opt&&opt.danger)};
  render();
}
function askClose(){ ASK=null; render() }
function askCard(){
  if(!ASK) return "";
  return '<div class="askwrap" role="dialog" aria-modal="true" aria-labelledby="askMsg">'+
    '<div class="askbox"><p id="askMsg" class="askmsg">'+esc(ASK.msg).replace(/\n/g,"<br>")+'</p>'+
    '<div class="btnrow"><button class="btn'+(ASK.danger?" danger":"")+'" id="askYes">'+esc(ASK.ok)+'</button>'+
    '<button class="btn sec" id="askNo">'+esc(ASK.no)+'</button></div></div></div>';
}
function bindAsk(){
  if(!ASK) return;
  const y=document.getElementById("askYes"), n=document.getElementById("askNo");
  if(y) y.onclick=()=>{ const f=ASK.yes; ASK=null; render(); try{ f() }catch(e){ toast("לא הצליח: "+e.message) } };
  if(n) n.onclick=askClose;
  if(y) y.focus();
}
/* ---- האם האחסון באמת מחזיק ----
   ספארי בגלישה פרטית **מרשה** לכתוב ל-localStorage, ומוחק הכול ברגע
   שסוגרים את הכרטיסייה. לכן הבדיקה הקיימת (שתופסת רק כתיבה שנכשלת)
   לא תפסה כלום, והמשתמש נרשם שוב ושוב בלי להבין למה זה לא נדבק.
   אין דרך אמינה לזהות גלישה פרטית, אבל אפשר לזהות שני סימנים:
   1. המכסה קטנה בצורה חריגה — סימן מובהק בספארי פרטי.
   2. יש חותמת מפגש קודם? אם לא, וזו לא באמת פתיחה ראשונה, משהו נמחק. */
/* ---- האם האחסון באמת מחזיק ----
   שתי דרכים שונות לגמרי שבהן אחסון "עובד" ובכל זאת נמחק:
   • ספארי בגלישה פרטית — כותב, וזורק הכול בסגירת הכרטיסייה.
   • דף שרץ בתוך מסגרת (iframe) של אתר אחר — ספארי חוסם או מבודד לו
     את האחסון, ואז כל טעינה מתחילה מאפס למרות ששום כתיבה לא נכשלה.
   בדיקה שמסתכלת רק על "האם הכתיבה נכשלה" מפספסת את שתיהן.

   הבדיקה כאן מסתמכת על הבדל שאי אפשר לזייף: `sessionStorage` שורד
   רענון של אותה כרטיסייה, ו-`localStorage` אמור לשרוד הרבה יותר.
   אם יש סימן מפגש ב-sessionStorage אבל אין ב-localStorage — סימן
   שה-localStorage נמחק בין שתי טעינות, וזו כבר עובדה ולא ניחוש. */
const K_SEEN="trendline.seen.v1";
let STORE_WARN=null;
function checkStorage(){
  let ls=true;
  try{
    localStorage.setItem("__t","1");
    if(localStorage.getItem("__t")!=="1") ls=false;
    localStorage.removeItem("__t");
  }catch(e){ ls=false }
  if(!ls){
    window.__saveFail=true;
    STORE_WARN="הדפדפן חוסם שמירת נתונים בעמוד הזה. שום דבר שתזין לא יישמר.";
    return;
  }
  let sess=null;
  try{ sess=sessionStorage.getItem(K_SEEN); sessionStorage.setItem(K_SEEN,"1") }catch(e){}
  const seen=(function(){ try{ return localStorage.getItem(K_SEEN) }catch(e){ return null } })();
  if(sess&&!seen){
    /* היינו כאן קודם באותה כרטיסייה, והסימן ב-localStorage נעלם */
    window.__saveFail=true;
    STORE_WARN="**האחסון בעמוד הזה לא מחזיק.** נבדק: מה שנשמר בטעינה הקודמת "+
      "כבר לא קיים. זה קורה בגלישה פרטית, או כשספארי חוסם אחסון לדף שרץ "+
      "בתוך אתר אחר. עד שזה ייפתר, כל הרשמה וכל שקילה יימחקו כשתסגור.";
  }
  try{ localStorage.setItem(K_SEEN,String(Date.now())) }catch(e){}
  /* מכסה קטנה בצורה חריגה — סימן נוסף, לא הכרחי */
  if(!STORE_WARN&&navigator.storage&&navigator.storage.estimate){
    navigator.storage.estimate().then(function(r){
      if(r&&r.quota&&r.quota<60*1024*1024){
        STORE_WARN="נראה שאתה בגלישה פרטית. אפשר להשתמש באפליקציה, אבל "+
          "**הכול יימחק ברגע שתסגור את הכרטיסייה** — כולל ההרשמה.";
        render();
      }
    }).catch(function(){});
  }
}
/* בדיקה יזומה שהמשתמש מפעיל בעצמו — הדרך הוודאית לדעת */
function storageProbe(){
  let out=[];
  try{
    localStorage.setItem("__probe","abc");
    out.push(localStorage.getItem("__probe")==="abc"?"כתיבה וקריאה: תקין":"כתיבה וקריאה: נכשל");
    localStorage.removeItem("__probe");
  }catch(e){ out.push("כתיבה: נחסמה ("+e.name+")") }
  out.push("סימן מטעינה קודמת: "+((function(){ try{ return localStorage.getItem(K_SEEN)?"קיים":"חסר" }catch(e){ return "לא נגיש" } })()));
  out.push("בתוך מסגרת של אתר אחר: "+(window.top!==window.self?"כן":"לא"));
  try{ out.push("מספר מפתחות שמורים: "+localStorage.length) }catch(e){ out.push("מספר מפתחות: לא נגיש") }
  if(navigator.storage&&navigator.storage.estimate)
    navigator.storage.estimate().then(function(r){
      ask(out.join("\n")+"\nמכסת אחסון: "+(r&&r.quota?Math.round(r.quota/1048576)+"MB":"לא ידוע"),
          function(){}, {ok:"סגור",no:"סגור"});
    }).catch(function(){ ask(out.join("\n"),function(){},{ok:"סגור",no:"סגור"}) });
  else ask(out.join("\n"),function(){},{ok:"סגור",no:"סגור"});
}
function render(){
  const bar=document.querySelector(".tabbar");
  if(!me){
    if(bar) bar.style.display="none";
    document.body.classList.add("noauth");
    app.innerHTML=viewAuth();
    window.scrollTo(0,0);
    try{ linkLabels(); a11yPass() }catch(e){}
    bindAuth();
    return;
  }
  /* כניסה ראשונה — קודם המטרות, אחר כך האפליקציה */
  if(!me.goal||ui.editGoals){
    if(bar) bar.style.display="none";
    document.body.classList.add("noauth");
    app.innerHTML=viewSetup();
    window.scrollTo(0,0);
    try{ linkLabels(); a11yPass() }catch(e){}
    bindSetup();
    return;
  }
  if(bar) bar.style.display="";
  document.body.classList.remove("noauth");
  renderTabs();
  const views={add:viewAdd,dash:viewDash,trend:viewTrend,steps:viewSteps,learn:viewLearn,
               food:viewFood,work:viewWork,plan:viewPlan,data:viewData};
  /* רשת ביטחון: אם מסך אחד נופל, בלי זה app.innerHTML לא מתעדכן — המסך הישן
     נשאר תקוע — ו-bind() לא רץ, כך ששום כפתור לא לחיץ, כולל סרגל הלשוניות.
     המשתמש רואה "האפליקציה נתקעה" בלי שום רמז למה. עכשיו: המסך אומר מה קרה,
     שאר הלשוניות ממשיכות לעבוד, ויש כפתור שמאפס את התצוגה בלי לגעת בנתונים. */
  let body;
  try{
    body=(views[ui.tab]||viewAdd)();
  }catch(err){
    window.__lastErr=err;
    const nm=(TABS.filter(t=>t.id===ui.tab)[0]||{}).label||ui.tab;
    body='<div class="lgtitle">משהו נשבר</div>'+
      '<div class="card"><h2>מסך «'+esc(nm)+'» לא נטען</h2>'+
      '<p class="tiny">שאר האפליקציה עובדת — אפשר לעבור ללשונית אחרת מלמטה. '+
      '<b>הנתונים שלך לא נפגעו.</b></p>'+
      '<div class="calc">'+esc(String(err&&err.message||err))+'</div>'+
      '<details class="xtra"><summary>פרטים טכניים</summary>'+
      '<div class="calc" style="white-space:pre-wrap">'+
      esc(String((err&&err.stack)||"").split("\n").slice(0,6).join("\n"))+'</div></details>'+
      '<div class="btnrow"><button class="btn" id="errReset">אפס את התצוגה</button></div>'+
      '<p class="tiny" style="margin-top:10px">«אפס את התצוגה» מחזיר את המסכים למצב התחלתי. '+
      'שקילות, היקפים, תוכניות וצעדים נשארים במקומם.</p></div>';
  }
  /* אזהרת אחסון מופיעה בכל מסך, לא רק בכניסה — היא נוגעת לכל פעולה */
  const warn=(STORE_WARN||window.__saveFail)
    ? '<div class="card storewarn"><p class="amsg bad" style="margin:0">'+
      esc(STORE_WARN||"הדפדפן חוסם שמירה בעמוד הזה — שום דבר לא יישמר.")
        .replace(/**(.+?)**/g,"<b></b>")+'</p>'+
      '<div class="btnrow"><button class="btn sec" id="storeChk">בדוק מה קורה כאן</button></div></div>'
    : "";
  app.innerHTML='<div class="wrap">'+warn+body+'</div>'+askCard();
  window.scrollTo(0,0);
  try{ linkLabels(); a11yPass() }catch(e){}
  /* גם החיווט עצמו מוגן — שגיאה בכפתור אחד לא תשתק את סרגל הלשוניות */
  try{ bind() }catch(e){ window.__bindErr=e }
  try{ bindAsk() }catch(e){}
  const sc2=document.getElementById("storeChk");
  if(sc2) sc2.onclick=storageProbe;
  const er=document.getElementById("errReset");
  if(er) er.onclick=()=>{
    ui=Object.assign({},UI_DEFAULT);
    window.__prog=null; window.__planImp=null; window.__ocr=null;
    persist(); render(); toast("התצוגה אופסה");
  };
}

/* ============================================================================
   תצוגה: הוספת שקילה
   ============================================================================ */
function viewAdd(){
  const last=official().slice(-1)[0];
  const o=window.__ocr||null;
  const v=(o&&o.vals)||{};
  const val=k=> v[k]!=null?' value="'+v[k]+'"':'';
  const fx=(o&&o.fixed)||{};
  const tag=k=> v[k]==null?'':
    (fx[k]? ' <span class="badge b-warn" style="font-size:10px;padding:1px 7px" title="'+esc(fx[k])+'">'+esc(fx[k])+'</span>'
          : ' <span class="badge b-info" style="font-size:10px;padding:1px 7px">מהתמונה</span>');

  let h='<div class="lgtitle">שקילה חדשה</div>';
  h+='<p class="sub">'+(last?'האחרונה: '+fmtDate(last.date)+' · '+n2(last.weight)+' ק"ג':'אין עדיין שקילות')+'</p>';

  /* ---- אזור העלאת צילום המסך ---- */
  h+='<div class="card">';
  if(o&&o.busy){
    h+='<div class="drop busy"><div class="spin"></div><div><b>'+esc(o.msg||"קוראת…")+'</b>'+
       '<div class="tiny">בפעם הראשונה טעינת מנוע הקריאה לוקחת כמה שניות</div></div></div>';
  }else{
    h+='<div class="drop" id="drop" tabindex="0">'+
       '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+
       '<rect x="3" y="6" width="22" height="17" rx="3.5"/><circle cx="14" cy="14.5" r="4.2"/><path d="M9 6l1.6-2.4h6.8L19 6"/></svg>'+
       '<div><b>העלה צילום מסך מהמשקל</b><div class="tiny">גרירה · לחיצה לבחירת קובץ · או הדבקה עם Ctrl+V</div></div></div>';
    h+='<input type="file" id="file" accept="image/*" hidden>';
  }
  if(window.__ocrImg) h+='<img class="shot" src="'+window.__ocrImg+'" alt="צילום המסך שהועלה">';

  if(o&&!o.busy){
    if(o.found) h+='<p style="margin-top:12px"><span class="badge b-ok">זוהו '+o.found+' ערכים</span> '+
                   '<span class="tiny">ודאות המנוע '+o.conf+'% — עבור על המספרים לפני שמירה</span></p>';
    (o.warn||[]).forEach(w=>{ h+='<p style="margin-top:9px"><span class="badge b-warn">בדוק</span> <span class="tiny">'+esc(w)+'</span></p>' });
    if(o.raw&&o.raw.length)
      h+='<details style="margin-top:10px"><summary class="tiny" style="cursor:pointer">הטקסט הגולמי שנקרא</summary>'+
         '<div class="calc" style="white-space:pre-wrap;max-height:180px;overflow:auto">'+esc(o.raw.join("\n"))+'</div></details>';
  }
  h+='</div>';

  /* ---- הטופס ---- */
  h+='<div class="card"><form id="wForm">';
  const dv=(o&&o.meta&&o.meta.date)?o.meta.date:today();
  h+='<div class="fields">';
  h+='<div class="f"><label>תאריך'+((o&&o.meta&&o.meta.date)?' <span class="badge b-info" style="font-size:10px;padding:1px 7px">מהתמונה</span>':'')+
     '</label><input type="date" name="date" value="'+dv+'" required></div>';
  h+='<div class="f"><label>סוג המדידה</label><select name="kind">'+
     '<option value="morning">בוקר — רשמית</option>'+
     '<option value="other">אחר — סקרנות בלבד</option></select></div>';
  OCR_FIELDS.filter(f=>f.core).forEach(f=>{
    h+='<div class="f"><label>'+f.lab+(f.unit?' ('+f.unit+')':'')+tag(f.key)+'</label>'+
       '<input type="number" step="'+(f.dec>=2?"0.01":f.dec===1?"0.1":"1")+'" inputmode="decimal" name="'+f.key+'"'+
       ' placeholder="'+(f.key==="fat"||f.key==="lean"?"מחושב אוטומטית":"")+'"'+val(f.key)+'></div>';
  });
  h+='<div class="f wide"><label>הערה</label><input type="text" name="note" placeholder="למשל: אחרי מקלחת / הייתי חולה"></div>';
  h+='</div>';

  /* מדדים נוספים מהדוח — נשמרים ומוצגים, אך אינם הליבה של המעקב */
  const extra=OCR_FIELDS.filter(f=>!f.core);
  const anyExtra=extra.some(f=>v[f.key]!=null);
  h+='<details class="xtra"'+(anyExtra?" open":"")+'><summary class="tiny">מדדים נוספים מהדוח'+
     (anyExtra?' — זוהו '+extra.filter(f=>v[f.key]!=null).length:'')+'</summary><div class="fields" style="margin-top:10px">';
  extra.forEach(f=>{
    h+='<div class="f"><label>'+f.lab+(f.unit?' ('+f.unit+')':'')+tag(f.key)+'</label>'+
       '<input type="number" step="'+(f.dec>=1?"0.1":"1")+'" inputmode="decimal" name="'+f.key+'"'+val(f.key)+'></div>';
  });
  h+='</div></details>';
  h+='<div class="btnrow"><button class="btn" type="submit">שמור ונתח</button>'+
     (o?'<button class="btn sec" type="button" id="clearOcr">נקה</button>':'')+'</div>';
  h+='</form>';
  h+='<p class="tiny" style="margin-top:12px">מסת שומן ומסה רזה מחושבות ממשקל ואחוז שומן אם לא הוזנו. '+
     'מדידה מסוג «אחר» נשמרת אך מוחרגת מכל ממוצע, מגמה והשוואה.</p>';
  h+='</div>';

  if(window.__lastAnalysis) h+='<div class="card">'+renderAnalysis(window.__lastAnalysis)+'</div>';
  return h;
}

/* ============================================================================
   רינדור הניתוח — מבנה חמשת השלבים מהסקיל
   ============================================================================ */
function renderAnalysis(r){
  const e=r.entry;
  let h='<h2>ניתוח — '+fmtDate(e.date)+'</h2>';
  if(r.isOutlier) h+='<p><span class="badge b-crit">מדידה חריגה</span> <span class="tiny">אינה מייצגת מגמה</span></p>';

  /* 1. המספרים */
  h+='<div class="step"><div class="st">1 · המספרים</div>';
  h+='<div class="tiles">';
  h+=tile("משקל",n2(e.weight),r.compare&&r.compare.dW!=null?sgn(r.compare.dW,2):null,true);
  h+=tile("אחוז שומן",n1(e.bf),r.compare&&r.compare.dBf!=null?sgn(r.compare.dBf,1):null,false);
  h+=tile("מסת שומן",n2(e.fat),r.compare&&r.compare.dFat!=null?sgn(r.compare.dFat,2):null,false);
  h+=tile("מסה רזה",n2(e.lean),r.compare&&r.compare.dLean!=null?sgn(r.compare.dLean,2):null,true);
  h+='</div>';
  if(r.avg7!=null){
    h+='<div class="tiles" style="margin-top:10px">';
    h+=tile("ממוצע 7 ימים",n2(r.avg7),r.avg7p!=null?sgn(r.avg7-r.avg7p,2):null,true);
    h+=tile("ממוצע 28 יום",n2(r.avg28),null,true);
    h+=tile("שומן % ממוצע 7",n1(r.bf7),null,false);
    h+='</div>';
  }
  if(r.compare&&r.compare.skipped){
    h+='<p class="tiny" style="margin-top:9px">ההשוואה היא מול '+fmtDate(r.compare.prev.date)+
       ' ולא מול '+fmtDate(r.compare.skipped.date)+', כי המדידה ההיא סומנה כחריגה.</p>';
  }
  h+='</div>';

  /* 1.5 שלוש השקילות האחרונות */
  if(r.recent&&r.recent.length){
    h+='<div class="step"><div class="st">1.5 · מול שלוש השקילות האחרונות</div>';
    h+='<div class="list" style="box-shadow:none;margin:0 0 10px">';
    r.recent.forEach(o=>{
      const b=o.verdict?(o.verdict.cls==="ok"?"b-ok":o.verdict.cls==="warn"?"b-warn":"b-crit"):"b-mute";
      h+='<div class="row" style="padding:10px 12px"><div class="k">'+
         '<b class="num">'+fmtDate(o.prev.date)+'</b> <span class="tiny">לפני '+o.days+' ימים</span>'+
         (o.outlier?' <span class="badge b-crit" style="font-size:10px;padding:1px 6px">חריג</span>':'')+
         '<div class="tiny">'+(o.dW!=null?'משקל '+sgn(o.dW,2):'')+
         (o.dBf!=null?' · שומן '+sgn(o.dBf,1)+'%':'')+
         (o.kcalDay!=null?' · '+sgn(Math.round(o.kcalDay),0)+' קק"ל/יום נדרש':'')+'</div></div>'+
         (o.verdict?'<div class="v"><span class="badge '+b+'">'+o.verdict.txt+'</span></div>':'')+'</div>';
    });
    h+='</div>';
    if(r.consistent==="mixed")
      h+='<p><span class="badge b-warn">כיוונים מעורבים</span> <span class="tiny">המשקל זז לשני הכיוונים מול שלוש הנקודות. זו חתימה של רעש, לא של שינוי.</span></p>';
    else if(r.consistent)
      h+='<p><span class="badge b-info">כיוון עקבי '+(r.consistent==="up"?"כלפי מעלה":"כלפי מטה")+'</span> <span class="tiny">אותו כיוון בכל '+r.dirCount+' ההשוואות. עקביות היא מה שמפריד שינוי מרעש.</span></p>';
    h+='</div>';
  }

  /* 2. בדיקת הסבירות */
  if(r.compare&&r.compare.verdict){
    const c=r.compare,v=c.verdict;
    h+='<div class="step '+v.cls+'"><div class="st">2 · בדיקת הסבירות</div>';
    h+='<p><span class="badge '+v.badge+'">'+v.txt+'</span></p>';
    h+='<div class="calc">'+sgn(c.dFat,2)+' ק"ג שומן × 7,700 ÷ '+c.days+' ימים = <b>'+
       sgn(Math.round(c.kcalDay),0)+' קק"ל ליום</b></div>';
    if(v.cls==="crit"){
      h+='<p>כדי שהשינוי הזה יהיה שומן אמיתי היה נדרש עודף כזה בכל יום מאז המדידה הקודמת. זה לא קרה, ולכן זה לא שומן.</p>';
    }else if(v.cls==="warn"){
      h+='<p>העודף הנדרש גדול משמעותית מכל תרחיש תזונתי סביר. רוב הפער הזה הוא רעש מדידה, לא רקמה.</p>';
    }else{
      h+='<p>הסדר גודל של האנרגיה הנדרשת נמצא בטווח האפשרי. השינוי הזה יכול לשקף שינוי אמיתי — אבל עדיין רק מגמה תאשר אותו.</p>';
    }
    if(c.dLean!=null){
      h+='<div class="calc">מסה רזה: '+sgn(c.dLean,2)+' ק"ג ÷ '+c.days+' ימים = '+
         sgn(c.leanPerDay,3)+' ק"ג ליום · תקרה ריאלית ≈ '+LEAN_CEILING_DAY+'</div>';
      if(c.leanOverCeiling)
        h+='<p>העלייה במסה הרזה חורגת מהתקרה הביולוגית לצבירת שריר. המשמעות: מים וגליקוגן. גרם גליקוגן קושר כ־3 גרם מים, ולכן יום פחמימות גבוה מזיז את המספר הזה בלי שנוצר גרם שריר.</p>';
    }
    h+='</div>';
  }

  /* 2.5 ייחוס סיבתי */
  const att=attribute(r);
  h+='<div class="step info"><div class="st">2.5 · ממה זה נובע</div>';
  att.forEach(a=>{
    const b=a.w==="גבוהה"?"b-crit":a.w==="בינונית"?"b-warn":"b-mute";
    h+='<p style="margin-bottom:10px"><span class="badge '+b+'">'+esc(a.t)+'</span>'+
       (a.w!=="—"?' <span class="tiny">סבירות '+a.w+'</span>':'')+
       '<br><span class="tiny">'+esc(a.d)+'</span></p>';
  });
  h+='<p class="tiny">'+esc(physio(r))+'</p></div>';

  /* 3. פרמטר אחר פרמטר */
  h+='<div class="step"><div class="st">3 · כל פרמטר בנפרד</div>';
  h+=renderParams(r);
  h+='<p class="tiny" style="margin-top:10px">מדד המסומן «מחושב» אינו מדידה עצמאית — הוא נגזר ממדד אחר, '+
     'ולכן אינו ראיה נוספת אלא אותה ראיה בניסוח שונה.</p></div>';

  /* 4. המגמה */
  h+='<div class="step"><div class="st">4 · המגמה</div>';
  if(r.trend.ok){
    h+='<p>קצב המשקל: <b class="num">'+sgn(r.trend.perWeek,2)+' ק"ג לשבוע</b>'+
       (r.ratePct!=null?' · <span class="num">'+sgn(r.ratePct,2)+'%</span> ממשקל הגוף':'')+'</p>';
    if(r.rateBand) h+='<p><span class="badge '+r.rateBand.cls+'">'+r.rateBand.label+'</span></p>';
    h+='<p class="tiny">מבוסס על '+r.trend.n+' שקילות בפריסה של '+r.trend.span+' יום · R²='+n2(r.trend.r2)+
       (r.trend.r2<0.4?' — פיזור גבוה, המספר רועש':'')+'</p>';
  }else{
    h+='<p><span class="badge b-mute">'+(r.trend.reason||"אין מספיק נתונים")+'</span></p>';
    h+='<p class="tiny">כל אמירה על מגמה מציינת על כמה מדידות ואיזו פריסה היא מבוססת. כאן אין מספיק — ולכן אין מספר.</p>';
  }
  if(r.bfTrend.ok){
    h+='<p class="tiny" style="margin-top:8px">אחוז שומן: '+sgn(r.bfTrend.perWeek*4.345,1)+' נקודות אחוז לחודש · R²='+n2(r.bfTrend.r2)+
       (r.bfTrend.r2<0.4?' — רועש מדי כדי להסיק ממנו':'')+'</p>';
  }
  h+='</div>';

  /* 5. מה לעשות */
  h+='<div class="step"><div class="st">5 · מה לעשות</div>';
  r.recs.forEach(x=>{
    const b=x.cls==="ok"?"b-ok":x.cls==="warn"?"b-warn":(x.cls==="crit"||x.cls==="bad")?"b-crit":"b-info";
    h+='<p style="margin-bottom:11px"><span class="badge '+b+'">'+esc(x.t)+'</span><br><span class="tiny">'+esc(x.d)+'</span></p>';
  });
  h+='</div>';

  h+='<hr class="s"><p class="tiny">הניתוח מבוסס על החוקים המקודדים בסקיל <b>body-comp-coach</b>. '+
     'לשאלות שחורגות מהחוקים האלה — תביא את המסך לקלוד.</p>';
  return h;
}
/* ניתוח פרמטר־אחר־פרמטר: מה המדד, מה זז, והאם התזוזה חורגת מהרעש שלו */
function renderParams(r){
  const e=r.entry, c=r.compare;
  let h='';
  OCR_FIELDS.forEach(f=>{
    const info=PARAM_INFO[f.key]; if(!info) return;
    const now=e[f.key]; if(now==null) return;
    const was=c?c.prev[f.key]:null;
    const d=(was!=null)?now-was:null;
    const days=c?c.days:1;
    const band=info.noise*Math.max(1,Math.sqrt(days));   /* הרעש מצטבר עם הזמן */
    const over=d!=null&&Math.abs(d)>band;

    const rg=(e.rng||{})[f.key], vl=(e.val||{})[f.key];
    const pos=rangePos(now,rg), posW=rangeWord(pos);

    h+='<details class="param"><summary>';
    h+='<span class="pn">'+esc(info.lab)+'</span>';
    h+='<span class="pv num">'+(f.dec===0?Math.round(now):n1(now))+(info.unit?' '+info.unit:'')+'</span>';
    if(d!=null) h+='<span class="badge '+(over?"b-warn":"b-mute")+'">'+sgn(d,f.dec===0?0:1)+'</span>';
    if(vl) h+='<span class="badge '+(vl==="תקין"?"b-ok":"b-warn")+'">'+esc(vl)+'</span>';
    if(!info.direct) h+='<span class="badge b-mute" style="font-size:10px">מחושב</span>';
    h+='</summary><div class="pbody">';
    if(rg){
      /* סרגל מיקום בתוך טווח התקן של הדוח */
      const clamp=Math.max(0,Math.min(100,pos));
      h+='<div class="rng"><div class="rngbar"><span style="inset-inline-start:'+clamp+'%"></span></div>'+
         '<div class="rnglbl"><span class="num">'+n1(rg.lo)+'</span>'+
         '<span>'+esc(posW||"")+'</span><span class="num">'+n1(rg.hi)+'</span></div></div>';
    }
    h+='<p class="tiny"><b>מה זה:</b> '+esc(info.what)+'</p>';
    h+='<p class="tiny"><b>מה מזיז אותו:</b> '+esc(info.drivers)+'</p>';
    if(d!=null){
      h+='<p class="tiny"><b>מה קרה כאן:</b> '+
         (over
           ? 'תזוזה של '+sgn(d,f.dec===0?0:1)+' על פני '+days+' ימים, מעבר לרעש הצפוי של המדד הזה (±'+n1(band)+'). '+esc(info.real)
           : 'תזוזה של '+sgn(d,f.dec===0?0:1)+' על פני '+days+' ימים — בתוך הרעש הרגיל (±'+n1(band)+'). לא קרה כאן דבר שדורש הסבר.')+
         '</p>';
    }else{
      h+='<p class="tiny"><b>מה קרה כאן:</b> אין ערך קודם להשוואה. '+esc(info.real)+'</p>';
    }
    h+='</div></details>';
  });
  return h||'<p class="tiny">אין פרמטרים לניתוח.</p>';
}

function tile(t,n,d,goodUp){
  let cls="flat";
  if(d&&d!=="—"){ const v=parseFloat(d); if(v>0)cls=goodUp?"up":"dn"; else if(v<0)cls=goodUp?"dn":"up" }
  return '<div class="tile"><div class="t">'+t+'</div><div class="n">'+n+'</div>'+
         (d?'<div class="d '+cls+'">'+d+'</div>':'')+'</div>';
}
function physio(r){
  const c=r.compare;
  if(!c) return "זו השקילה הראשונה במאגר — אין מול מה להשוות. מכאן והלאה כל מדידה תיקרא מול ההיסטוריה.";
  const bits=[];
  if(c.verdict&&c.verdict.cls!=="ok"){
    bits.push("BIA לא מודד שומן. הוא מודד התנגדות חשמלית ומסיק ממנה הרכב גוף, ולכן כל שינוי בתכולת המים בגוף מזיז את התוצאה: הידרציה, מלח, גליקוגן, זרימת דם, טמפרטורת עור, תכולת מערכת העיכול, ואפילו לחות על העור אחרי מקלחת.");
  }
  if(c.leanOverCeiling) bits.push("העלייה במסה הרזה כאן מהירה מדי מכדי להיות שריר. גליקוגן ומים הם ההסבר הסביר.");

  /* אחוז המים הוא העדות הישירה ביותר לארטיפקט הידרציה.
     BIA מסיק שומן מהתנגדות, ומים מוליכים — כשהמים יורדים ההתנגדות עולה
     והמכשיר "רואה" יותר שומן. תנועה הפוכה של השניים היא החתימה של הארטיפקט. */
  const wx=(c.extra||[]).find(x=>x.f.key==="water");
  if(wx&&wx.d!=null&&c.dBf!=null&&Math.abs(wx.d)>=0.4){
    if(wx.d*c.dBf<0){
      bits.push("אחוז המים בגוף "+(wx.d<0?"ירד":"עלה")+" ב־"+n1(Math.abs(wx.d))+" נקודות ואחוז השומן זז בכיוון ההפוך. "+
        "זו החתימה הקלאסית של ארטיפקט הידרציה: מים מוליכים חשמל, וכשהם יורדים ההתנגדות עולה והמכשיר מפרש את זה כשומן. "+
        "שינוי בשומן לא מייצר תנועה כזו במים.");
    }else{
      bits.push("אחוז המים ואחוז השומן זזו לאותו כיוון, מה שפחות אופייני לארטיפקט הידרציה פשוט. "+
        "עדיין לא ראיה לשינוי אמיתי — רק סימן שהתנאים היו יציבים יחסית.");
    }
  }
  const px=(c.extra||[]).find(x=>x.f.key==="protein");
  if(px&&px.d!=null&&Math.abs(px.d)>=1.2)
    bits.push("גם אחוז החלבון זז ב־"+n1(Math.abs(px.d))+" נקודות. הוא אמור להיות מהמדדים היציבים ביותר, ותזוזה כזו בימים ספורים מצביעה על שינוי בתנאי המדידה ולא על שינוי ברקמה.");
  if(c.dW!=null&&Math.abs(c.dW)>=0.8&&c.days<=2) bits.push("תנודה של "+n2(Math.abs(c.dW))+' ק"ג ביום־יומיים היא בתחום הרעש הרגיל — נוזלים ותכולת מערכת עיכול נעים ב־1–2 ק"ג בקלות.');
  if(!bits.length) bits.push("השינוי מתון ותואם את התנודתיות הרגילה של מדידת BIA בתנאים דומים. אין כאן אירוע שדורש הסבר מיוחד.");
  if(r.circAge!=null&&r.circAge>14) bits.push("שים לב שהיקפים לא נמדדו "+r.circAge+" יום — זה המדד היחיד כאן שלא מושפע מהידרציה.");
  return bits.join(" ");
}

/* ============================================================================
   תצוגה: ניתוח (דשבורד)
   ============================================================================ */
function viewDash(){
  const rows=official();
  if(!rows.length) return '<div class="lgtitle">ניתוח</div><div class="card"><div class="empty">אין עדיין שקילות בוקר.</div></div>';

  /* אפשר לצפות בניתוח של כל שקילה בהיסטוריה, לא רק האחרונה */
  let target=null;
  if(ui.anId) target=entries.find(x=>x.id===ui.anId&&x.kind==="morning");
  const isPast=!!target;
  if(!target) target=entries.find(x=>x.id===rows[rows.length-1].id);
  const r=analyze(target);

  let h='<div class="lgtitle">ניתוח</div>';
  h+='<p class="sub">'+(isPast?'ניתוח שמור · ':'השקילה האחרונה · ')+fmtDate(target.date)+'</p>';
  if(isPast) h+='<div class="btnrow" style="margin:0 0 14px"><button class="btn sec" id="backLatest">חזרה לשקילה האחרונה</button></div>';
  h+='<div class="card">'+renderAnalysis(r)+'</div>';

  /* היסטוריה — לחיצה פותחת את הניתוח המלא של אותה שקילה */
  h+='<h3 style="padding:0 4px;font-size:15px;color:var(--label2)">היסטוריה — לחץ על שקילה כדי לראות את הניתוח שלה</h3><div class="list">';
  const out=markOutliers(rows,"bf");
  allSorted().slice().reverse().forEach(e=>{
    const bad=out[e.id], oth=e.kind!=="morning", cur=e.id===target.id;
    h+='<div class="row'+(oth?'':' tap')+'"'+(oth?'':' data-an="'+e.id+'"')+
       (cur?' style="background:var(--fill)"':'')+'>'+
       '<div class="k"><b class="num">'+fmtDate(e.date)+'</b>'+
       (oth?' <span class="badge b-mute">אחר</span>':'')+(bad?' <span class="badge b-crit">חריג</span>':'')+
       (cur?' <span class="badge b-info">מוצג</span>':'')+
       (e.img?' <span class="badge b-mute" style="font-size:10px">תמונה</span>':'')+
       (e.note?'<div class="tiny">'+esc(e.note)+'</div>':'')+'</div>'+
       '<div class="v">'+(e.weight!=null?n2(e.weight)+' ק"ג · ':'')+(e.bf!=null?n1(e.bf)+"%":"")+'</div>'+
       '<button class="btn danger mini" data-del="'+e.id+'">מחק</button></div>';
  });
  h+='</div>';
  h+='<p class="tiny" style="padding:0 6px">'+rows.length+' שקילות בוקר · '+entries.length+' רשומות בסך הכול. '+
     'הניתוח מחושב מחדש בכל פתיחה מהנתונים השמורים, כך שהוא תמיד משקף את כל מה שידוע עד אותו תאריך.</p>';
  return h;
}

/* ============================================================================
   תצוגה: מגמות + גרף
   ============================================================================ */
/* "שבועי" הוא תקופה כמו כל השאר מבחינת הכפתורים, אבל הדוח שמתחתיו שונה:
   במקום להשוות תחילת תקופה מול סופה, הוא מציג שבוע מול שבוע. הגרף שמעליו
   מוצג ב־84 יום (12 שבועות) כדי שהוא יתאים למה שהרשימה מראה. */
const WEEK_RANGE="week", WEEK_CHART_DAYS=84;
const RANGES=[{id:WEEK_RANGE,label:"שבועי"},{id:"30",label:"חודש"},{id:"90",label:"3 חודשים"},{id:"180",label:"חצי שנה"},{id:"365",label:"שנה"},{id:"9999",label:"הכל"}];
/* בבחירה "שבועי" הגרף נמתח בדיוק עד השבוע הכי ישן שמופיע ברשימה שמתחתיו.
   אחרת הרשימה מראה שבועות שהגרף חתך, וזה נראה כמו תקלה. */
function rangeDays(){
  if(ui.range!==WEEK_RANGE) return parseInt(ui.range,10)||180;
  const w=weeklySeries(ui.metric,WEEK_SHOW);
  if(w.length<2) return WEEK_CHART_DAYS;
  const rows=official().filter(r=>r[ui.metric]!=null);
  const last=dayNum(rows[rows.length-1].date);
  return Math.max(WEEK_CHART_DAYS, last-dayNum(w[w.length-1].week)+7);
}
const METRICS=[{id:"weight",label:"משקל",unit:'ק"ג'},{id:"bf",label:"אחוז שומן",unit:"%"},{id:"lean",label:"מסה רזה",unit:'ק"ג'},{id:"fat",label:"מסת שומן",unit:'ק"ג'}];

/* ============================================================================
   כרטיס המגמה השבועית
   ----------------------------------------------------------------------------
   מציג שבוע מול שבוע, וקודם כול אומר במילים מה קרה. הכללים זהים לשאר
   הניתוחים: חריגים לא נכנסים, שבוע עם מדידה אחת מסומן ככזה, ושינוי מתחת
   לסף המשמעות של המדד נאמר במפורש כ"כמעט לא זז" ולא כמספר שנשמע מדויק.
   ============================================================================ */
function curGoal(){
  return GOALS.find(g=>g.id===((me&&me.goal)||ui.goal||"mass"))||GOALS[0];
}
/* האם הכיוון הזה טוב? במסה רזה עלייה טובה, בשומן ירידה טובה. במשקל זה
   תלוי במטרה שנבחרה — ולכן אין תשובה קבועה. מדדים שאין להם כיוון רצוי
   (מים, מלח, BMI, ציון) מחזירים null ומוצגים ניטרלית, כי צביעה שלהם
   בירוק או באדום היא אמירה שאין לה כיסוי. */
function goodDir(key,d){
  if(!d) return null;
  const up=d>0;
  switch(key){
    case "lean": case "smmPct": case "smi": case "muscle": return up;
    case "bf": case "fat": case "visceral": case "subcut": return !up;
    case "weight": {
      const dir=curGoal().dir;
      return dir==="flat"?null:(dir==="up"?up:!up);
    }
    default: return null;
  }
}
function weeklyCard(key){
  const info=PARAM_INFO[key];
  if(!info) return "";
  const fld=OCR_FIELDS.find(f=>f.key===key);
  const dec=(fld&&fld.dec===0)?0:1;
  const fm=x=>dec===0?String(Math.round(x)):n1(x);
  /* מינוס טיפוגרפי (−) ולא מקף, בכל מקום — אחרת הכותרת והטבלה נראות
     כאילו נכתבו בשני מקומות שונים. */
  const sg=x=>(x>0?"+":"−")+fm(Math.abs(x));
  /* טווח היעד מוצג כפי שהוא מוגדר. עיגול 0.25 ל־0.3 משנה את המספר
     שהמחקר מדבר עליו, ולכן כאן שומרים שתי ספרות כשצריך. */
  const rt=x=>(x<0?"−":"")+String(+Math.abs(x).toFixed(2));
  const un=info.unit?" "+info.unit:"";
  const weeks=weeklySeries(key,WEEK_SHOW);

  let h='<div class="card"><h2>מגמה שבועית — '+esc(info.lab)+'</h2>';
  if(weeks.length<2){
    h+='<div class="empty">אין עדיין שני שבועות עם מדידות של '+esc(info.lab)+'.<br>'+
       '<span class="tiny">השבוע הוא היחידה הנכונה להשוואה — הוא ארוך מספיק כדי לספוג תנודות '+
       'יומיות של מים ומלח. צריך שקילות בשני שבועות שונים לפחות.</span></div></div>';
    return h;
  }

  const sig=(SIG[key]||1)*0.5;
  const newest=weeks[0], oldest=weeks[weeks.length-1];
  const nW=Math.round((dayNum(newest.week)-dayNum(oldest.week))/7);
  const total=newest.avg-oldest.avg;
  const perWeek=nW>0?total/nW:0;

  /* ההקשר לפסק הדין — נבנה מהממוצעים השבועיים עצמם, לא ממדידה בודדת */
  const bfW=weeklySeries("bf",WEEK_SHOW), lnW=weeklySeries("lean",WEEK_SHOW);
  const dOf=a=>a.length>=2?a[0].avg-a[a.length-1].avg:null;
  const ctx={bfUp:(dOf(bfW)||0)>SIG.bf*0.5, leanDown:(dOf(lnW)||0)<-SIG.lean*0.5};
  const vd=verdictOf(key,total,ctx);
  const hb=vd.v==="good"?"b-ok":vd.v==="bad"?"b-crit":vd.v==="warn"?"b-warn":"b-mute";

  /* הכותרת במילים */
  let story;
  if(Math.abs(total)<sig){
    story=esc(info.lab)+' כמעט לא זז לאורך '+heWeeks(nW)+' האחרונים — הממוצע השבועי נשאר סביב '+
          '<b class="num">'+fm(newest.avg)+'</b>'+esc(un)+'.';
  }else{
    story=esc(info.lab)+(total>0?' עלה ':' ירד ')+'לאורך '+heWeeks(nW)+', מ־<b class="num">'+fm(oldest.avg)+
          '</b> ל־<b class="num">'+fm(newest.avg)+'</b>'+esc(un)+
          ' — בממוצע <b class="num">'+sg(perWeek)+'</b>'+esc(un)+' בשבוע.';
  }
  h+='<div class="headline"><span class="badge '+hb+'">'+esc(vd.t)+'</span>'+
     '<p style="margin:9px 0 0">'+story+'</p>'+
     (vd.why?'<p class="tiny" style="margin:7px 0 0">'+esc(vd.why)+'</p>':'')+'</div>';

  /* כמה מהטווח באמת נמדד — בלי זה "לאורך 23 שבועות" נשמע כמו 23 שבועות
     של מעקב רצוף, גם כשיש שקילות בחמישה מהם בלבד. */
  if(nW+1>weeks.length)
    h+='<p class="tiny" style="margin:10px 0 0">יש שקילות ב־'+heWeeks(weeks.length)+
       ' מתוך <span class="num">'+(nW+1)+'</span> בטווח הזה. '+
       'ככל שיש יותר שבועות רצופים, הקצב הממוצע מדויק יותר.</p>';

  /* קצב מול היעד — רק למשקל, כי רק שם ליעד יש טווח קצב מוגדר */
  if(key==="weight"&&nW>0&&newest.avg>0){
    const g=curGoal();
    const pct=perWeek/newest.avg*100;
    const [lo,hi]=g.rate;
    let t,c;
    if(pct<lo-0.05){ t="מתחת ליעד"; c=g.dir==="up"?"b-warn":"b-crit"; }
    else if(pct>hi+0.05){ t="מעל היעד"; c=g.dir==="down"?"b-warn":"b-crit"; }
    else { t="בטווח היעד"; c="b-ok"; }
    if(g.dir==="flat"&&Math.abs(pct)<=hi) { t="יציב כמתוכנן"; c="b-ok"; }
    h+='<div class="pcard"><div class="ptop"><span class="pnm">קצב מול המטרה</span>'+
       '<span class="badge '+c+'">'+esc(t)+'</span></div>'+
       '<p class="pline">הקצב בפועל הוא <b class="num">'+(pct>0?"+":"−")+n1(Math.abs(pct))+'%</b> ממשקל הגוף בשבוע. '+
       'במטרה ״'+esc(g.lab)+'״ הטווח שמתאים הוא <b class="num">'+rt(lo)+'</b> עד <b class="num">'+rt(hi)+'</b>%.</p>'+
       '<p class="tiny">'+esc(g.why)+'</p></div>';
  }

  /* ---- כרטיס לכל מדד, כמו בתקופות הארוכות ---- */
  const cmp=weekCompare();
  if(cmp.length){
    h+='<div class="sep2"></div><h3 class="h3">מה השתנה מהשבוע שעבר</h3>';
    const wk=cmp[0];
    h+='<p class="tiny" style="margin-bottom:12px">מבוסס על '+heDays(wk.nNow)+' בשבוע הזה מול '+
       heDays(wk.nPrev)+' בשבוע שעבר'+(wk.gap>1?', עם '+heWeeks(wk.gap-1)+' בלי שקילות ביניהם':'')+'.</p>';
    cmp.forEach(it=>{
      const dec=it.dec===0?0:1;
      const fm=x=>dec===0?String(Math.round(x)):n1(x);
      const un=it.unit?" "+it.unit:"";
      const b=it.verdict
        ? (it.verdict.v==="good"?"b-ok":it.verdict.v==="bad"?"b-crit":it.verdict.v==="warn"?"b-warn":"b-mute")
        : "b-mute";
      h+='<div class="pcard"><div class="ptop"><span class="pnm">'+esc(it.lab)+'</span>'+
         '<span class="badge '+b+'">'+esc(it.verdict?it.verdict.t:"בתוך הרעש")+'</span>'+
         (it.solid?'<span class="badge b-mute">'+esc(it.mag)+'</span>':'')+'</div>';
      h+='<p class="pline">'+esc(it.lab)+' '+
         (Math.abs(it.d)<0.05?'נשאר על ':(it.d>0?'עלה מ־':'ירד מ־'))+
         '<b class="num">'+fm(it.from)+'</b>'+
         (Math.abs(it.d)<0.05?'':' ל־<b class="num">'+fm(it.to)+'</b>')+esc(un)+'.</p>';
      if(it.verdict)
        h+='<p class="tiny">'+esc(it.verdict.why)+'</p>';
      else if(!it.direct)
        h+='<p class="tiny">התזוזה קטנה מכדי להסיק ממנה משהו בטווח של שבוע. '+
           'המדד הזה מגיע מ־BIA, והוא זז עם מים, מלח וגליקוגן לפני שהוא זז עם רקמה.</p>';
      else
        h+='<p class="tiny">שינוי בתוך התנודה הרגילה. אין כאן מה להסביר.</p>';
      h+='</div>';
    });
    const noisy=cmp.filter(x=>!x.direct).length;
    if(noisy)
      h+='<p class="tiny" style="margin-top:12px"><b>למה חלק מהמדדים מסומנים כרעש:</b> '+
         'שבוע הוא חלון קצר. המשקל מגיב מהר ואפשר לקרוא אותו כך; אחוז השומן והמסה הרזה '+
         'מגיעים מ־BIA, ובטווח של שבוע ההידרציה מזיזה אותם יותר מהשינוי האמיתי. '+
         'לכן הם דורשים תזוזה גדולה יותר לפני שנאמר עליהם משהו — ובחודש או בשלושה חודשים הם כבר אומרים.</p>';
  }

  /* הטבלה — שבוע אחרי שבוע, החדש למעלה */
  h+='<div class="sep2"></div><h3 class="h3">'+esc(info.lab)+' — שבוע אחרי שבוע</h3>';
  h+='<div class="wklist">';
  weeks.forEach(w=>{
    const thin=w.n<2;
    let cls,txt;
    if(w.d==null){ cls="flat"; txt="—"; }
    else if(Math.abs(w.d)<sig){ cls="flat"; txt="≈"; }
    else{
      /* במסה רזה עלייה היא הכיוון הרצוי; בשומן — הפוך. במשקל זה תלוי במטרה.
         הצבע לבדו לא נושא את המידע — יש גם סימן וגם המספר עצמו. */
      const g=goodDir(key,w.d);
      cls=g==null?"flat":(g?"pos":"neg");
      txt=sg(w.d);
    }
    /* השורה וההערות שלה עטופות יחד — מרווח קטן בתוך הקבוצה וגדול בין
       קבוצות, כדי שלא יהיה ספק לאיזה שבוע ההערה שייכת. */
    h+='<div class="wkitem"><div class="wkrow'+(thin?" thin":"")+'">'+
       '<span class="wkdt num">'+esc(weekRange(w.week))+'</span>'+
       '<span class="wkav num">'+fm(w.avg)+'</span>'+
       '<span class="wkd '+cls+' num">'+txt+'</span>'+
       '</div>';
    /* שתי ההערות יכולות לחול על אותו שבוע, ולכן אף אחת לא דוחקת את השנייה */
    if(thin)
      h+='<p class="wknote">מדידה אחת בלבד בשבוע הזה — זה לא ממוצע, ואי אפשר להסיק ממנו שינוי אמיתי.</p>';
    if(w.gap>1)
      h+='<p class="wknote">לפני השבוע הזה עברו '+heWeeks(w.gap-1)+' בלי שקילות. ההפרש שמוצג פרוס על כל הטווח הזה, לא על שבוע אחד.</p>';
    h+='</div>';
  });
  h+='</div>';

  h+='<p class="tiny" style="margin-top:12px">כל שורה היא ממוצע השקילות של אותו שבוע (ראשון עד שבת), '+
     'אחרי הוצאת מדידות חריגות. שינוי קטן מ־<span class="num">'+n1(sig)+'</span>'+esc(un)+
     ' מסומן כ־≈ כי הוא בתוך רעש המדידה ולא מייצג שינוי אמיתי.</p>';
  h+='</div>';
  return h;
}

function viewTrend(){
  let h='<div class="lgtitle">מגמות</div>';
  h+='<div class="seg" id="segMetric">'+METRICS.map(m=>'<button data-metric="'+m.id+'" aria-selected="'+(ui.metric===m.id)+'">'+m.label+'</button>').join("")+'</div>';
  h+='<div class="card" id="chartBox">'+chart(ui.metric,rangeDays())+'</div>';

  /* בחירת תקופה — מתחת לגרף, ומזינה גם אותו וגם את הדוח המילולי */
  h+='<p class="tiny" style="padding:0 6px;margin-bottom:6px">בחר תקופה כדי לראות מה השתנה בה:</p>';
  h+='<div class="seg" id="segRange">'+RANGES.map(x=>'<button data-range="'+x.id+'" aria-selected="'+(ui.range===x.id)+'">'+x.label+'</button>').join("")+'</div>';

  /* ---- מה השתנה, במילים ----
     "שבועי" מחליף את דוח התקופה בהשוואת שבוע מול שבוע. שאר הכפתורים
     משווים תחילת תקופה מול סופה, כמו קודם. */
  if(ui.range===WEEK_RANGE){ h+=weeklyCard(ui.metric); }
  else{
  const rep=periodReport(rangeDays());
  h+='<div class="card"><h2>מה השתנה בתקופה הזו</h2>';
  if(!rep.items.length){
    h+='<div class="empty">אין מספיק שקילות בתקופה הזו כדי להשוות.<br>'+
       '<span class="tiny">צריך לפחות 4 מדידות בפריסה של 10 ימים ומעלה.</span></div>';
  }else{
    if(rep.head){
      const hb=rep.head.v==="good"?"b-ok":rep.head.v==="bad"?"b-crit":rep.head.v==="warn"?"b-warn":"b-mute";
      h+='<div class="headline"><span class="badge '+hb+'">'+esc(rep.head.t)+'</span>'+
         '<p style="margin:9px 0 0">'+esc(rep.head.d)+'</p></div>';
    }
    if(rep.base)
      h+='<p class="tiny" style="margin:12px 0 4px">מבוסס על '+rep.base.n+' שקילות, מ־'+
         fmtDate(rep.base.firstDate)+' עד '+fmtDate(rep.base.lastDate)+'. '+
         'ההשוואה היא בין תחילת התקופה לסופה, לפי ממוצעים — לא לפי שקילה בודדת.</p>';

    rep.items.forEach(it=>{
      const b=it.verdict.v==="good"?"b-ok":it.verdict.v==="bad"?"b-crit":it.verdict.v==="warn"?"b-warn":"b-mute";
      const dec=it.dec===0?0:1;
      const dir=Math.abs(it.st.d)<(SIG[it.key]||1)*0.5?"נשאר על":(it.st.d>0?"עלה מ־":"ירד מ־");
      h+='<div class="pcard">';
      h+='<div class="ptop"><span class="pnm">'+esc(it.lab)+'</span>'+
         '<span class="badge '+b+'">'+esc(it.verdict.t)+'</span>'+
         '<span class="badge b-mute">'+esc(it.mag)+'</span></div>';
      h+='<p class="pline">'+esc(it.lab)+' '+dir+' <b class="num">'+n1(it.st.from)+'</b>'+
         (Math.abs(it.st.d)<(SIG[it.key]||1)*0.5?'':' ל־<b class="num">'+n1(it.st.to)+'</b>')+
         (it.unit?' '+it.unit:'')+'.</p>';
      h+='<p class="tiny">'+esc(it.verdict.why)+'</p>';
      h+='<p class="tiny" style="opacity:.7">'+esc(it.what)+'</p>';
      h+='</div>';
    });
    h+='<p class="tiny" style="margin-top:12px">מדדים שאין להם מספיק שקילות בתקופה הזו פשוט לא מופיעים כאן — '+
       'עדיף להשמיט מדד מלהמציא עליו מסקנה.</p>';
  }
  h+='</div>';
  }

  /* היקפים */
  h+='<div class="card"><h2>היקפים</h2>';
  h+='<form id="cForm"><div class="fields">';
  h+='<div class="f"><label>תאריך</label><input type="date" name="date" value="'+today()+'" required></div>';
  [["navel","טבור"],["nipple","פטמות"],["shoulders","כתפיים"],["thigh","ירך"],["calf","שוק"],["armFlex","יד בכיווץ"],["forearmFlex","אמה בכיווץ"]]
    .forEach(([k,l])=>{ h+='<div class="f"><label>'+l+' (ס"מ)</label><input type="number" step="0.1" inputmode="decimal" name="'+k+'"></div>' });
  h+='</div><div class="btnrow"><button class="btn" type="submit">שמור מדידה</button></div></form>';

  if(circ.length){
    const sorted=circ.slice().sort((a,b)=>a.date<b.date?1:-1);
    const base=circ.slice().sort((a,b)=>a.date<b.date?-1:1)[0];
    h+='<hr class="s">';
    sorted.slice(0,6).forEach(c=>{
      h+='<div class="ex"><div class="top"><b class="nm num">'+fmtDate(c.date)+'</b>'+
         '<button class="btn danger mini" data-delc="'+c.id+'">מחק</button></div><div class="mus">';
      [["navel","טבור"],["nipple","פטמות"],["shoulders","כתפיים"],["thigh","ירך"],["calf","שוק"],["armFlex","יד"],["forearmFlex","אמה"]]
        .forEach(([k,l])=>{ if(c[k]!=null){ const d=(base&&base!==c&&base[k]!=null)?" ("+sgn(c[k]-base[k],1)+")":""; h+='<span>'+l+' '+n1(c[k])+d+'</span>' } });
      h+='</div>'+(c.note?'<p class="tiny" style="margin-top:6px">'+esc(c.note)+'</p>':'')+'</div>';
    });
  }
  h+='</div>';
  return h;
}

/* ---- מצב התצוגה של הגרף ----
   לא נשמר בין כניסות בכוונה: גרף שנפתח מוגדל למקום אקראי מבלבל.
   מתאפס לבד כשמחליפים מדד או תקופה. */
let CHART_VIEW={z:1,c:0.5,sel:null,key:null,days:null};
const CHART_ZMAX=10;
function chartReset(key,days){
  if(CHART_VIEW.key!==key||CHART_VIEW.days!==days)
    CHART_VIEW={z:1,c:0.5,sel:null,key:key,days:days};
}
function chartZoom(mult,at){
  const v=CHART_VIEW, z0=v.z;
  const z=Math.max(1,Math.min(CHART_ZMAX,z0*mult));
  if(z===z0) return;
  /* מגדילים סביב הנקודה שנגעו בה ולא סביב המרכז — אחרת מה שרצית
     לראות בורח מהמסך בדיוק כשאתה מתקרב אליו. */
  if(at!=null){
    const span0=1/z0, s0=v.c-span0/2;
    const abs=s0+at*span0;
    v.c=abs-(at-0.5)*(1/z);
  }
  v.z=z;
  const half=1/(2*z);
  v.c=Math.max(half,Math.min(1-half,v.c));
}
function chartPan(frac){
  const v=CHART_VIEW, half=1/(2*v.z);
  v.c=Math.max(half,Math.min(1-half,v.c+frac/v.z));
}

function chart(key,days){
  const rows=official().filter(r=>r[key]!=null);
  if(rows.length<2) return '<div class="empty">אין מספיק נתונים לגרף.</div>';
  const last=dayNum(rows[rows.length-1].date);
  const sub=rows.filter(r=>last-dayNum(r.date)<=days);
  if(sub.length<2) return '<div class="empty">אין מספיק נתונים בטווח הזה.</div>';

  chartReset(key,days);
  const V=CHART_VIEW;
  const out=markOutliers(rows,"bf");
  const W=640,H=230,PL=44,PR=12,PT=16,PB=26;

  /* התחום המלא, ומתוכו החלון שרואים כרגע */
  const f0=dayNum(sub[0].date), f1=last, fSpan=(f1-f0)||1;
  const vSpan=fSpan/V.z;
  let v0=f0+(V.c*fSpan)-vSpan/2;
  v0=Math.max(f0,Math.min(f1-vSpan,v0));
  const v1=v0+vSpan;

  const visible=sub.filter(r=>{ const d=dayNum(r.date); return d>=v0-0.5&&d<=v1+0.5 });
  const shown=visible.length>1?visible:sub;

  const maAll=movingAvg(rows,key,days>120?28:7).filter(p=>p.d>=f0);
  const maVis=maAll.filter(p=>p.d>=v0-0.5&&p.d<=v1+0.5);
  const ma=maVis.length>1?maVis:maAll;

  /* הסקאלה האנכית נגזרת ממה שרואים — אחרת זום פנימה לא מגלה כלום */
  const vals=shown.map(r=>r[key]).concat(ma.map(p=>p.v));
  let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  const pad=(hi-lo)*0.14||0.5; lo-=pad; hi+=pad;

  const X=d=> PL+(v1===v0?0.5:(d-v0)/(v1-v0))*(W-PL-PR);
  const Y=v=> PT+(1-(v-lo)/(hi-lo||1))*(H-PT-PB);

  /* חלופה טקסטואלית — נבנית מהנתונים כדי שלא תשקר כשהם משתנים */
  const mLab=(METRICS.filter(m=>m.id===key)[0]||{label:key}).label;
  const fV=shown[0][key], lV=shown[shown.length-1][key], dV=lV-fV;
  const chartAlt=mLab+": "+shown.length+" מדידות מ־"+fmtDate(shown[0].date)+
    " עד "+fmtDate(shown[shown.length-1].date)+". מ־"+n2(fV)+" ל־"+n2(lV)+", "+
    (Math.abs(dV)<0.005?"כמעט בלי שינוי":(dV>0?"עלייה של ":"ירידה של ")+n2(Math.abs(dV)))+
    ". הנמוך ביותר "+n2(Math.min.apply(null,vals))+", הגבוה ביותר "+n2(Math.max.apply(null,vals))+"."+
    (V.z>1?" מוגדל פי "+n1(V.z)+".":"");

  let g='<svg class="chart" id="chartSvg" role="img" aria-label="'+esc(chartAlt)+
        '" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" dir="ltr">'+
        '<title>'+esc(chartAlt)+'</title>';
  for(let i=0;i<=3;i++){
    const gv=lo+(hi-lo)*i/3, gy=Y(gv);
    g+='<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--sep)" stroke-width="1"/>';
    g+='<text x="'+(PL-7)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--label2)">'+n1(gv)+'</text>';
  }
  /* קו הסימון נמתח לפני הנקודות כדי שלא יסתיר אותן */
  const selRow=V.sel?shown.filter(r=>r.date===V.sel)[0]:null;
  if(selRow){
    const sx=X(dayNum(selRow.date));
    g+='<line x1="'+sx.toFixed(1)+'" y1="'+PT+'" x2="'+sx.toFixed(1)+'" y2="'+(H-PB)+
       '" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.85"/>';
  }
  shown.forEach(r=>{
    const x=X(dayNum(r.date)),y=Y(r[key]);
    if(out[r.id]) g+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="none" stroke="var(--red)" stroke-width="2"/>';
    else g+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.6" fill="var(--label2)"/>';
  });
  if(ma.length>1){
    g+='<path d="'+ma.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ")+
       '" fill="none" stroke="var(--blue)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
    const lp=ma[ma.length-1];
    g+='<circle cx="'+X(lp.d).toFixed(1)+'" cy="'+Y(lp.v).toFixed(1)+'" r="4.5" fill="var(--blue)"/>';
  }
  const reg=regress(shown.map(r=>({x:dayNum(r.date),y:r[key]})));
  if(reg&&shown.length>=MIN_POINTS&&(v1-v0)>=MIN_SPAN){
    g+='<line x1="'+X(v0).toFixed(1)+'" y1="'+Y(reg.slope*v0+reg.icpt).toFixed(1)+
       '" x2="'+X(v1).toFixed(1)+'" y2="'+Y(reg.slope*v1+reg.icpt).toFixed(1)+
       '" stroke="var(--orange)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.8"/>';
  }
  if(selRow){
    const sx=X(dayNum(selRow.date)), sy=Y(selRow[key]);
    g+='<circle cx="'+sx.toFixed(1)+'" cy="'+sy.toFixed(1)+'" r="6.5" fill="var(--accent)" stroke="var(--bar)" stroke-width="2"/>';
  }
  g+='<text x="'+PL+'" y="'+(H-6)+'" font-size="11" fill="var(--label2)">'+fmtDate(shown[0].date)+'</text>';
  g+='<text x="'+(W-PR)+'" y="'+(H-6)+'" font-size="11" fill="var(--label2)" text-anchor="end">'+fmtDate(shown[shown.length-1].date)+'</text>';
  /* שכבת מגע על כל שטח הגרף — נוגעים איפשהו ונבחרת המדידה הקרובה.
     לרדוף אחרי עיגול של שלושה פיקסלים באצבע זה לא ממשק. */
  g+='<rect id="chartHit" x="'+PL+'" y="0" width="'+(W-PL-PR)+'" height="'+H+
     '" fill="transparent" style="cursor:crosshair;touch-action:none"/>';
  g+='</svg>';

  let h='<div class="chartwrap">'+g;
  if(selRow){
    const sxPct=(X(dayNum(selRow.date))/W*100);
    const unit=(METRICS.filter(m=>m.id===key)[0]||{}).unit||"";
    const idx=sub.map(r=>r.date).indexOf(selRow.date);
    const prev=idx>0?sub[idx-1]:null;
    const dd=prev?selRow[key]-prev[key]:null;
    h+='<div class="ctip" style="left:'+sxPct.toFixed(2)+'%">'+
       '<b class="num">'+n2(selRow[key])+(unit?' <span class="cunit">'+esc(unit)+'</span>':'')+'</b>'+
       '<span class="cdate">'+fmtDate(selRow.date)+'</span>'+
       (dd!=null?'<span class="cdelta '+(dd>0?"up":(dd<0?"dn":""))+'">'+
          (dd>0?"▴ ":(dd<0?"▾ ":""))+n2(Math.abs(dd))+' מהמדידה הקודמת</span>':'')+
       (out[selRow.id]?'<span class="cflag">סומנה כחריגה</span>':'')+
       '</div>';
  }
  h+='</div>';
  h+='<div class="czoom">'+
     '<button class="cz" id="czOut" aria-label="הקטן את הגרף"'+(V.z<=1?' disabled':'')+'>−</button>'+
     '<button class="cz" id="czIn" aria-label="הגדל את הגרף"'+(V.z>=CHART_ZMAX?' disabled':'')+'>+</button>'+
     '<span class="czlab">'+(V.z>1?'פי '+n1(V.z):'טווח מלא')+'</span>'+
     (V.z>1?'<button class="cz wide" id="czReset">כל הטווח</button>':'')+
     (selRow?'<button class="cz wide" id="czClear">נקה בחירה</button>':'')+
     '</div>';
  if(V.z>1)
    h+='<p class="tiny" style="margin:6px 6px 0">גרור ימינה ושמאלה כדי לנוע בזמן. צביטה מגדילה ומקטינה.</p>';
  else if(!selRow)
    h+='<p class="tiny" style="margin:6px 6px 0">גע בגרף כדי לראות תאריך וערך. צביטה או «+» מגדילים.</p>';
  h+='<div class="legend"><span><i style="background:var(--blue)"></i>ממוצע נע '+(days>120?28:7)+' ימים</span>'+
     '<span><i style="background:var(--label2)"></i>מדידות בודדות</span>'+
     '<span><i style="background:var(--orange)"></i>קו מגמה</span>'+
     '<span><i style="background:var(--red)"></i>חריג</span></div>';
  return h;
}
/* ציור מחדש של הגרף בלבד. render() המלא גם גולל לראש הדף, וקפיצה
   למעלה בכל נגיעה בגרף הופכת אותו לבלתי שמיש. */
/* ---- אינטראקציה עם הגרף ----
   נגיעה בוחרת את המדידה הקרובה, גרירה מזיזה בזמן, צביטה מגדילה.
   הכול דרך Pointer Events — עכבר ומגע באותו קוד, בלי כפילות. */
function bindChart(){
  const svg=document.getElementById("chartSvg");
  const hit=document.getElementById("chartHit");
  const zin=document.getElementById("czIn"), zout=document.getElementById("czOut");
  const zres=document.getElementById("czReset"), zclr=document.getElementById("czClear");
  if(zin)  zin.onclick =()=>{ chartZoom(1.6,0.5); redrawChart() };
  if(zout) zout.onclick=()=>{ chartZoom(1/1.6,0.5); redrawChart() };
  if(zres) zres.onclick=()=>{ CHART_VIEW.z=1; CHART_VIEW.c=0.5; redrawChart() };
  if(zclr) zclr.onclick=()=>{ CHART_VIEW.sel=null; redrawChart() };
  if(!svg||!hit) return;

  const W=640,PL=44,PR=12,plotW=W-PL-PR;
  /* מיקום האצבע ביחס לשטח הגרף, ב-0..1 */
  const frac=cx=>{
    const r=svg.getBoundingClientRect();
    if(!r.width) return 0.5;
    const x=(cx-r.left)/r.width*W;
    return Math.max(0,Math.min(1,(x-PL)/plotW));
  };
  /* מאיזה תאריך מדובר, ואיזו מדידה הכי קרובה אליו */
  const pick=f=>{
    const rows=official().filter(r=>r[ui.metric]!=null);
    if(rows.length<2) return null;
    const days=rangeDays(), last=dayNum(rows[rows.length-1].date);
    const sub=rows.filter(r=>last-dayNum(r.date)<=days);
    if(sub.length<2) return null;
    const V=CHART_VIEW;
    const f0=dayNum(sub[0].date), f1=last, fSpan=(f1-f0)||1;
    const vSpan=fSpan/V.z;
    let v0=f0+(V.c*fSpan)-vSpan/2;
    v0=Math.max(f0,Math.min(f1-vSpan,v0));
    const target=v0+f*vSpan;
    let best=null,bd=Infinity;
    sub.forEach(r=>{ const d=Math.abs(dayNum(r.date)-target); if(d<bd){bd=d;best=r} });
    return best;
  };

  const pts=new Map();
  let mode=null, startX=0, startC=0, startDist=0, startZ=1, moved=0;

  hit.onpointerdown=e=>{
    hit.setPointerCapture&&hit.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,e.clientX);
    if(pts.size===2){
      const v=[...pts.values()];
      mode="pinch"; startDist=Math.abs(v[0]-v[1])||1; startZ=CHART_VIEW.z;
    }else{
      mode="drag"; startX=e.clientX; startC=CHART_VIEW.c; moved=0;
    }
  };
  hit.onpointermove=e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,e.clientX);
    if(mode==="pinch"&&pts.size===2){
      const v=[...pts.values()];
      const dist=Math.abs(v[0]-v[1])||1;
      const mid=(v[0]+v[1])/2;
      const want=startZ*(dist/startDist);
      chartZoom(want/CHART_VIEW.z,frac(mid));
      redrawChart(); return;
    }
    if(mode==="drag"){
      const dx=e.clientX-startX;
      moved=Math.max(moved,Math.abs(dx));
      if(CHART_VIEW.z>1&&Math.abs(dx)>3){
        const r=svg.getBoundingClientRect();
        const plotPx=r.width*(plotW/W)||1;
        /* בעברית הדף מיושר לימין אבל ציר הזמן נשאר משמאל לימין,
           ולכן גרירה שמאלה מקדמת בזמן — בלי היפוך. */
        CHART_VIEW.c=Math.max(1/(2*CHART_VIEW.z),
          Math.min(1-1/(2*CHART_VIEW.z), startC-(dx/plotPx)/CHART_VIEW.z));
        redrawChart();
      }
    }
  };
  const finish=e=>{
    if(mode==="drag"&&moved<=4){
      const r=pick(frac(e.clientX));
      if(r) CHART_VIEW.sel=(CHART_VIEW.sel===r.date?null:r.date);
      redrawChart();
    }
    pts.delete(e.pointerId);
    if(pts.size<2) mode=pts.size?"drag":null;
  };
  hit.onpointerup=finish;
  hit.onpointercancel=e=>{ pts.delete(e.pointerId); if(pts.size<2) mode=pts.size?"drag":null };
  /* גלגלת בעכבר — מגדילה סביב הסמן */
  hit.onwheel=e=>{
    e.preventDefault();
    chartZoom(e.deltaY<0?1.25:1/1.25,frac(e.clientX));
    redrawChart();
  };
  /* מקלדת: חיצים מזיזים בין מדידות, בלי להיות תלוי בעכבר */
  svg.setAttribute("tabindex","0");
  svg.onkeydown=e=>{
    const rows=official().filter(r=>r[ui.metric]!=null);
    const days=rangeDays(), last=rows.length?dayNum(rows[rows.length-1].date):0;
    const sub=rows.filter(r=>last-dayNum(r.date)<=days);
    if(sub.length<2) return;
    let i=CHART_VIEW.sel?sub.map(r=>r.date).indexOf(CHART_VIEW.sel):-1;
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      e.preventDefault();
      /* ציר הזמן בגרף רץ משמאל לימין גם בעברית, ולכן חץ שמאלה
         הוא אחורה בזמן — כלומר אינדקס קטן יותר. */
      const step=(e.key==="ArrowLeft")?-1:1;
      i=(i<0)?sub.length-1:Math.max(0,Math.min(sub.length-1,i+step));
      CHART_VIEW.sel=sub[i].date; redrawChart();
      const s2=document.getElementById("chartSvg"); if(s2) s2.focus();
    }else if(e.key==="Escape"){ CHART_VIEW.sel=null; redrawChart() }
    else if(e.key==="+"||e.key==="="){ chartZoom(1.6,0.5); redrawChart() }
    else if(e.key==="-"||e.key==="_"){ chartZoom(1/1.6,0.5); redrawChart() }
  };
}
function redrawChart(){
  const box=document.getElementById("chartBox");
  if(!box) return;
  box.innerHTML=chart(ui.metric,rangeDays());
  try{ bindChart() }catch(e){}
  try{ a11yPass(box) }catch(e){}
}

/* ============================================================================
   תצוגה: תוכניות אימון + החלפת תרגילים
   ============================================================================ */
function norm(s){ return String(s||"").toLowerCase().replace(/["'׳״\-–—_.,()]/g," ").replace(/\s+/g," ").trim() }

/* זיהוי תרגיל מתוך שורת טקסט */
function matchEx(line){
  const t=norm(line);
  let best=null,bestLen=0;
  EX_DB.forEach(x=>{
    [x.n,x.en].concat(x.alt||[]).forEach(name=>{
      const nn=norm(name);
      if(nn&&t.includes(nn)&&nn.length>bestLen){ best=x; bestLen=nn.length }
    });
  });
  if(best) return best;
  /* התאמה חלקית — לפי מילות מפתח */
  let score=0;
  EX_DB.forEach(x=>{
    const words=norm(x.n).split(" ").filter(w=>w.length>2);
    if(!words.length) return;
    const hit=words.filter(w=>t.includes(w)).length/words.length;
    if(hit>=0.6&&hit>score){ score=hit; best=x }
  });
  return best;
}

/* פורמט שורה: שם | N סטים | חזרות | מנוחה ...
   החזרות נשמרות כטקסט חופשי כי בתוכניות אמיתיות הן לא תמיד מספר —
   "מקסימום", "RIR 2", "8-10 שניות", "3 ניסיונות" הם ערכים לגיטימיים.
   שורה בלי מפרידים עדיין נקראת בפורמט הישן של 4x8. */
function parsePlan(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    let s=line,tag=null;
    const tm=s.match(/^(חימום|בונוס)\s*[:|־-]\s*/);
    if(tm){ tag=tm[1]; s=s.slice(tm[0].length).trim() }

    const parts=s.split("|").map(x=>x.trim()).filter(Boolean);
    let name=parts[0]||s, sets=null, reps=null, rest=null;

    if(parts.length>1){
      parts.slice(1).forEach(p=>{
        if(/מנוחה/.test(p)) rest=p.replace(/מנוחה\s*/,"").trim();
        else if(/סטים|סט\b/.test(p)){ const n=parseInt(p,10); if(!isNaN(n)) sets=n }
        else if(reps==null) reps=p;
      });
    }else{
      const m=s.match(/(\d+)\s*[xX×*]\s*(\d+)/);
      if(m){ sets=+m[1]; reps=m[2] }
    }
    const ex=matchEx(name);
    return {raw:line,name,ex:ex?ex.n:null,sets,reps,rest,tag};
  });
}

/* משפחות שרירים — "חזה עליון" ו"חזה תחתון" הם אותו שריר בראשים שונים,
   ולכן צריכים להיחשב חפיפה חלקית ולא זרות מוחלטת. */
const FAM=[["חזה"],["כתף"],["טרפז"],["גב רחב"],["רומבואידים"],["בטן"],["טרייספס"],
           ["בייספס"],["ברכיאליס","ברכיורדיאליס"],["אמות"],["ארבע ראשי"],["המסטרינג"],
           ["ישבן"],["מקרבים"],["תאומים","סולית"],["זוקפי גב"],["כופפי ירך"]];
function fam(m){
  for(const g of FAM){ for(const k of g){ if(m.indexOf(k)===0||m===k) return g[0] } }
  return m;
}
/* דמיון שרירים: חפיפה מדויקת שווה יותר מחפיפה ברמת המשפחה */
function musSim(a,b){
  if(!a.length||!b.length) return 0;
  const exact=a.filter(m=>b.includes(m)).length;
  const fa=a.map(fam), fb=b.map(fam);
  const famHit=fa.filter(m=>fb.includes(m)).length;
  const union=new Set([...fa,...fb]).size;
  return (exact*1.0 + (famHit-exact)*0.6)/union;
}

/* ---- כיסוי שרירי המטרה ----
   זה מה שקובע אם חלופה היא באמת חלופה. שריר ראשוני שמופיע כראשוני גם
   בתרגיל החלופי — מכוסה במלואו. מופיע שם רק כמשני — כיסוי חלקי.
   לא מופיע כלל — חסר, ואז התרגיל מאמן משהו אחר. */
function coverage(src,x){
  const inP=m=>x.p.some(y=>fam(y)===fam(m));
  const inS=m=>x.s.some(y=>fam(y)===fam(m));
  const full=src.p.filter(inP);
  const part=src.p.filter(m=>!inP(m)&&inS(m));
  const missed=src.p.filter(m=>!inP(m)&&!inS(m));
  const ratio=src.p.length?(full.length+part.length*0.5)/src.p.length:0;
  return {full,part,missed,ratio};
}

/* ---- מנוע ההחלפה ----
   כיסוי שרירי המטרה הוא הקריטריון הראשי — זה מה שהתרגיל אמור לאמן.
   אחריו משפחת מיומנות ותבנית תנועה, ולבסוף קרבה בדרגת קושי.
   הקנס על תרגיל קשה יותר גדול בכוונה: חלופה אמורה להתבצע באותו נפח,
   לא להיות השלב הבא של המיומנות. */
function rank(src,pool,exclude){
  const ex=new Set((exclude||[]).map(norm));
  return pool
    .filter(x=>x.n!==src.n && !ex.has(norm(x.n)))
    .map(x=>{
      const cov=coverage(src,x);
      const sameFam=(x.fam&&src.fam&&x.fam===src.fam)?1:0;
      const samePat=x.pat===src.pat?1:0;
      const sSim=musSim(x.s.concat(x.p),src.s.concat(src.p));
      const dDiff=Math.abs(x.diff-src.diff);
      const harder=Math.max(0,x.diff-src.diff), easier=Math.max(0,src.diff-x.diff);
      const score = cov.ratio*170 + sameFam*70 + samePat*55 + sSim*10 - harder*40 - easier*12;
      return {x,score,cov,dDiff,samePat,sameFam};
    })
    /* בלי כיסוי של לפחות מחצית משרירי המטרה זו לא חלופה, גם אם התנועה דומה */
    .filter(o=>o.cov.ratio>=0.5)
    .sort((a,b)=> b.score-a.score || b.cov.ratio-a.cov.ratio || a.dDiff-b.dDiff);
}

/* שתי חלופות לכל תרגיל: אחת עם ציוד פשוט, אחת בלי ציוד בכלל.
   `compromise` מסמן שהחלופה חולקת שרירים אבל לא את תבנית התנועה —
   יש תרגילים, בעיקר סטטיקות על מוט, שאין להם תחליף אמיתי על הרצפה. */
function substitutes(name,exclude){
  const src=EX_DB.find(x=>x.n===name);
  if(!src) return null;
  const all=rank(src,EX_DB,exclude);
  const pick=eq=>{
    const c=all.filter(o=>o.x.eq===eq);
    if(!c.length) return null;
    const best=c[0];
    return {x:best.x,dDiff:best.dDiff,cov:best.cov,
            /* פשרה = לא כל שרירי המטרה מכוסים במלואם */
            compromise:best.cov.ratio<1,
            easier:best.x.diff<src.diff,harder:best.x.diff>src.diff};
  };
  return {src,simple:pick("simple"),none:pick("none"),all:all.slice(0,4)};
}

   ----------------------------------------------------------------------------
   בתמונה עברית נדרשים שני מעברים: המנוע העברי קורא את שמות התרגילים אבל
   הורס ספרות, והמעבר האנגלי המוגבל לספרות קורא את הסטים והחזרות נכון.
   לכן הספרות של המעבר העברי נזרקות ובמקומן נכנסות אלה של המעבר האנגלי.
   ============================================================================ */
const PDFJS_CDN="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
const PDFJS_WORKER="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
let pdfLoading=null, planNumWorker=null, planTxtWorker=null, labelNumWorker=null;
function loadPDF(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfLoading) return pdfLoading;
  pdfLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=PDFJS_CDN;
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER }catch(e){} res() };
    s.onerror=()=>rej(new Error("no-net"));
    document.head.appendChild(s);
  });
  return pdfLoading;
}

async function planLinesFromImage(canvas){
  await loadTesseract();
  if(!planTxtWorker) planTxtWorker=await Tesseract.createWorker(["heb","eng"]);
  const A=await planTxtWorker.recognize(canvas,{},{text:true,blocks:true});
  if(!planNumWorker){
    planNumWorker=await Tesseract.createWorker("eng");
    await planNumWorker.setParameters({tessedit_char_whitelist:"0123456789xX×*-/ "});
  }
  const B=await planNumWorker.recognize(canvas,{},{text:true,blocks:true});

  const aLines=linesOf(A.data).filter(l=>l.bbox);
  const bWords=wordsOf(B.data).filter(w=>w.bbox&&/\d/.test(w.text||""));
  if(!aLines.length) return (A.data.text||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);

  return aLines.map(l=>{
    const y0=l.bbox.y0,y1=l.bbox.y1;
    const toks=bWords.filter(w=>{ const y=(w.bbox.y0+w.bbox.y1)/2; return y>=y0-3&&y<=y1+3 })
                     .map(w=>String(w.text).trim()).filter(Boolean);
    /* מעדיפים אסימון שנראה כמו סטים×חזרות. אחרת עד שני מספרים בודדים.
       בלי הסינון הזה נכנס לשורה זבל כמו "072" ו־"7X79" שה־OCR ממציא בשוליים. */
    const sr=toks.filter(t=>/^\d{1,3}\s*[xX×*]\s*\d{1,3}$/.test(t.replace(/\s/g,"")));
    const use=sr.length?[sr[0].replace(/\s/g,"")]
                       :toks.filter(t=>/^\d{1,3}$/.test(t)).slice(0,2);
    /* סימני כיווניות בלתי נראים ש־OCR משאיר בטקסט עברי */
    const name=(l.text||"").replace(/[‎‏‪-‮⁦-⁩]/g,"")
                 .replace(/\d+/g,"").replace(/\s*[xX×*]\s*/g," ").replace(/\s+/g," ").trim();
    return (name+" "+use.join("x")).trim();
  }).filter(Boolean);
}

async function readPlanFile(file){
  window.__planImp={busy:true,msg:"קורא את הקובץ…",name:file.name};
  render();
  try{
    const ext=(file.name.split(".").pop()||"").toLowerCase();
    let lines=[];
    if(/^image\//.test(file.type)||["png","jpg","jpeg","webp","heic","bmp"].indexOf(ext)>=0){
      window.__planImp.msg="קורא את התמונה…"; render();
      lines=await planLinesFromImage(prepOCR(await loadImage(file)));
    }else if(ext==="pdf"){
      window.__planImp.msg="קורא את ה־PDF…"; render();
      await loadPDF();
      const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      for(let p=1;p<=doc.numPages;p++){
        const tc=await (await doc.getPage(p)).getTextContent();
        const byY={};
        tc.items.forEach(it=>{
          const y=Math.round(it.transform[5]);
          (byY[y]=byY[y]||[]).push(it.str);
        });
        Object.keys(byY).sort((a,b)=>b-a).forEach(y=>{
          const s=byY[y].join(" ").replace(/\s+/g," ").trim();
          if(s) lines.push(s);
        });
      }
    }else if(["xlsx","xls"].indexOf(ext)>=0){
      window.__planImp.msg="טוען קורא Excel…"; render();
      await loadXLSX();
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
      wb.SheetNames.forEach(nm=>{
        XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:""}).forEach(row=>{
          const s=row.map(c=>String(c).trim()).filter(Boolean).join(" ").trim();
          if(s) lines.push(s);
        });
      });
    }else{
      const txt=await file.text();
      lines=(ext==="csv"||ext==="tsv")
        ? parseDelimited(txt).map(r=>r.filter(Boolean).join(" ").trim())
        : txt.split(/\r?\n/).map(s=>s.trim());
      lines=lines.filter(Boolean);
    }
    /* שומרים רק שורות שנראות כמו תרגיל: זוהה שם, או שיש בהן סטים×חזרות */
    const keep=lines.filter(l=>matchEx(l)||/\d+\s*[xX×*]\s*\d+/.test(l));
    window.__planImp={busy:false,name:file.name,lines,keep,
                      matched:keep.filter(l=>matchEx(l)).length};
  }catch(err){
    window.__planImp={busy:false,error:err.message==="no-net"
      ? "הקורא נטען מהאינטרנט בפעם הראשונה. התחבר פעם אחת, או הדבק את התוכנית כטקסט."
      : (err.message||String(err))};
  }
  render();
}

function planDetail(p){
  const items=p.items&&p.items.length?p.items:parsePlan(p.body||"");
  const names=items.filter(i=>i.ex).map(i=>i.ex);
  let h='<div class="lgtitle">'+esc(p.title||"תוכנית")+'</div>';
  h+='<p class="sub">'+items.length+' תרגילים · '+items.filter(i=>i.ex).length+' זוהו · נשמר '+fmtDate(p.date)+'</p>';
  if(p.note) h+='<div class="card" style="padding:12px 15px;margin-bottom:14px"><b>'+esc(p.note)+'</b></div>';
  h+='<div class="btnrow" style="margin-bottom:14px"><button class="btn sec" id="backPlans">כל התוכניות</button></div>';

  /* נפח לפי שריר */
  const vol={};
  items.forEach((it,i)=>{
    const nm=(p.swaps||{})[i]||it.ex; if(!nm) return;
    const x=EX_DB.find(d=>d.n===nm); if(!x) return;
    x.p.forEach(m=>{ vol[m]=(vol[m]||0)+(it.sets||3) });
  });
  const volArr=Object.entries(vol).sort((a,b)=>b[1]-a[1]);
  if(volArr.length){
    h+='<div class="card"><h2>נפח לפי שריר ראשוני</h2><div class="mus">';

    h+='</div><p class="tiny" style="margin-top:8px">הטווח שרוב הראיות תומכות בו הוא 10–20 סטים לקבוצת שריר '+
       '<b>בשבוע</b>, לא לאימון בודד. אם התוכנית חוזרת פעמיים בשבוע — הכפל.</p></div>';
  }

  /* התרגילים */
  h+='<div class="card"><h2>התרגילים</h2>';
  h+='<p class="tiny" style="margin-bottom:12px">לחץ על תרגיל כדי לראות חלופות.</p>';
  items.forEach((it,i)=>{
    const swapped=(p.swaps||{})[i];
    const linked=(p.links||{})[i];
    const baseName=it.ex||linked;
    const baseX=baseName?EX_DB.find(d=>d.n===baseName):null;
    const curX=swapped?EX_DB.find(d=>d.n===swapped):baseX;
    const open=ui.exIdx===i;

    h+='<div class="exr'+(open?' open':'')+'">';
    h+='<div class="exhead" data-exi="'+i+'">';
    h+='<div class="exmain">';
    if(it.tag) h+='<span class="badge '+(it.tag==="בונוס"?"b-mute":"b-info")+'" style="font-size:10px;padding:1px 8px">'+esc(it.tag)+'</span> ';
    h+='<span class="exnm">'+esc(curX?curX.n:(it.name||it.raw))+'</span>';
    if(swapped) h+=' <span class="badge b-info">הוחלף</span>';
    if(!baseX) h+=' <span class="badge b-warn">לא זוהה</span>';
    else if(linked&&!it.ex) h+=' <span class="badge b-mute">קושר ל'+esc(linked)+'</span>';
    /* פרוטוקול הביצוע — סטים, חזרות ומנוחה, כפי שכתובים בתוכנית */
    const proto=[];
    if(it.sets) proto.push(it.sets+" סטים");
